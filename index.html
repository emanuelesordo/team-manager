<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb"><meta name="description" content="Team Manager - gestione squadra, partite, livescore e statistiche.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./src/styles.css?v=20260929-19">
<title>Team Manager</title>
</head>
<body><div id="app"><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui;color:#697386">Caricamento Team Manager…</div></div><div id="toast-root"></div>
<script>
(function(){
  window.addEventListener('error',function(e){
    var a=document.getElementById('app');
    if(a && !a.dataset.ready) a.innerHTML='<div style="max-width:520px;margin:15vh auto;padding:24px;font-family:system-ui"><h2>Errore di caricamento</h2><p>'+String(e.message||'Errore JavaScript')+'</p><button onclick="location.reload()" style="padding:12px 16px">Ricarica</button></div>';
  });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});
  }
  if('caches' in window){caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k)})})}
})();
</script>
<script type="module" src="./src/main.js?v=20260929-19"></script></body>
</html>
