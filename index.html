<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101828"><title>Team Manager</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#"><span class="brand-mark">TM</span><strong>Team Manager</strong></a>
    <nav class="nav" aria-label="Navigazione principale">
      <button class="nav-item active" data-view="seasons">Config</button>
      <button class="nav-item" disabled>Competizioni</button><button class="nav-item" disabled>Calendario</button>
      <button class="nav-item" disabled>Giocatori</button><button class="nav-item" disabled>Rosa</button>
      <button class="nav-item" disabled>Partite</button><button class="nav-item" disabled>Livescore</button>
      <button class="nav-item" disabled>Eventi</button><button class="nav-item" disabled>Statistiche</button>
    </nav>
  </header>

  <main class="main">
    <div class="actions-row">
      <div class="status-pill" id="connectionState">Connessione…</div>
      <button class="primary" id="newSeasonBtn">+ Stagione</button>
    </div>
    <section id="seasonGrid" class="season-grid" aria-live="polite"></section>
    <div id="emptyState" class="empty hidden"><strong>Nessuna stagione</strong><span>Crea la prima annata.</span></div>
  </main>

  <dialog id="seasonDialog">
    <form id="seasonForm" method="dialog">
      <div class="dialog-head"><h2 id="dialogTitle">Nuova stagione</h2><button type="button" class="icon-btn" id="closeDialog">×</button></div>
      <input type="hidden" id="seasonId">
      <label>Nome stagione<input id="seasonName" required placeholder="2026/27" maxlength="30"></label>
      <div class="form-row"><label>Inizio<input id="startDate" type="date" required></label><label>Fine<input id="endDate" type="date" required></label></div>
      <label>Stato<select id="seasonStatus"><option value="future">Futura</option><option value="active">Attiva</option><option value="archived">Archiviata</option></select></label>
      <p class="form-error hidden" id="formError"></p>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancelDialog">Annulla</button><button class="primary" type="submit">Salva</button></div>
    </form>
  </dialog>
  <script src="./app.js"></script>
</body></html>
