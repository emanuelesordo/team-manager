const countryDisplayNames = typeof Intl.DisplayNames==="function"
  ? new Intl.DisplayNames(["it"],{type:"region"})
  : null;

function countryFlag(code){
  const c=String(code||"").trim().toUpperCase();
  if(!/^[A-Z]{2}$/.test(c))return "";
  return [...c].map(ch=>String.fromCodePoint(127397+ch.charCodeAt(0))).join("");
}

function countryName(code){
  const c=String(code||"").trim().toUpperCase();
  if(!c)return "";
  try{return countryDisplayNames?.of(c)||c}catch{return c}
}

function countryOptions(selected=""){
  const current=String(selected||"").toUpperCase();
  const ordered=[
    "IT",
    ...ISO_COUNTRY_CODES
      .filter(code=>code!=="IT")
      .map(code=>({code,name:countryName(code)}))
      .sort((a,b)=>a.name.localeCompare(b.name,"it"))
      .map(x=>x.code)
  ];

  return `<option value="">—</option>`+
    ordered
      .map(code=>`<option value="${code}" ${code===current?"selected":""}>${countryFlag(code)} ${esc(countryName(code))}</option>`)
      .join("");
}

function countryCodeFromValue(value){
  const raw=String(value??"").trim();
  if(!raw)return null;

  const upper=raw.toUpperCase();
  if(/^[A-Z]{2}$/.test(upper)&&ISO_COUNTRY_CODES.includes(upper))return upper;

  const norm=normalizeImportText(raw);
  const aliases={
    italia:"IT",italiana:"IT",italiano:"IT",
    francia:"FR",francese:"FR",
    germania:"DE",tedesca:"DE",tedesco:"DE",
    spagna:"ES",spagnola:"ES",spagnolo:"ES",
    portogallo:"PT",portoghese:"PT",
    inghilterra:"GB",regno_unito:"GB",gran_bretagna:"GB",britannica:"GB",britannico:"GB",
    brasile:"BR",brasiliana:"BR",brasiliano:"BR",
    argentina:"AR",argentino:"AR",
    croazia:"HR",croata:"HR",
    serbia:"RS",serba:"RS",serbo:"RS",
    romania:"RO",rumena:"RO",rumeno:"RO",
    albania:"AL",albanese:"AL",
    slovenia:"SI",slovena:"SI",sloveno:"SI",
    bosnia:"BA",bosniaca:"BA",bosniaco:"BA",
    svizzera:"CH",svizzero:"CH",
    austria:"AT",austriaco:"AT",
    belgio:"BE",belga:"BE",
    olanda:"NL",paesi_bassi:"NL",olandese:"NL",
    marocco:"MA",marocchino:"MA",
    tunisia:"TN",tunisino:"TN",
    nigeria:"NG",nigeriano:"NG",
    senegal:"SN",senegalese:"SN",
    ghana:"GH",ghanese:"GH",
    usa:"US",stati_uniti:"US",statunitense:"US"
  };

  const aliasKey=norm.replace(/\s+/g,"_");
  if(aliases[aliasKey])return aliases[aliasKey];

  const match=ISO_COUNTRY_CODES.find(code=>normalizeImportText(countryName(code))===norm);
  return match||"__INVALID__";
}

async function getRosterSettings(force=false){
  if(
    !force
    && state.rosterSettings?.team_id===state.team.id
    && state.rosterSettings?.season_id===state.season.id
  ){
    return state.rosterSettings;
  }

  const row=await must(
    supabase.from("roster_settings")
      .select("*")
      .eq("team_id",state.team.id)
      .eq("season_id",state.season.id)
      .maybeSingle()
  );

  state.rosterSettings=row||{
    team_id:state.team.id,
    season_id:state.season.id,
    show_contract_period:true,
    show_shirt_numbers:true,
    show_contact_options:true
  };

  return state.rosterSettings;
}

function rosterSortHeader(label,key,className=""){
  const current=state.rosterSort||{key:"name",dir:"asc"};
  const arrow=current.key===key?(current.dir==="asc"?"▲":"▼"):"";
  return `<th class="sort-th ${className}" data-roster-sort="${key}">
    <span class="sort-head">${esc(label)}<span class="sort-arrow">${arrow}</span></span>
  </th>`;
}

function compareRosterValues(a,b,key){
  const av=a.sort?.[key];
  const bv=b.sort?.[key];

  if(av===null||av===undefined||av===""){
    if(bv===null||bv===undefined||bv==="")return 0;
    return 1;
  }
  if(bv===null||bv===undefined||bv==="")return -1;

  if(typeof av==="number"&&typeof bv==="number")return av-bv;
  if(typeof av==="boolean"&&typeof bv==="boolean")return Number(av)-Number(bv);

  return String(av).localeCompare(String(bv),"it",{numeric:true,sensitivity:"base"});
}

    must(supabase.from("injuries").select("*").eq("team_id",state.team.id).eq("season_id",state.season.id).order("injury_date",{ascending:false})),
    must(supabase.from("suspensions").select("*").eq("team_id",state.team.id).eq("season_id",state.season.id).order("issued_date",{ascending:false})),

        <strong>${esc(x.reason||x.suspension_type)}</strong>

  }).join("");

  $("#absence-new-other")?.addEventListener("click",()=>openUnavailabilityModal(players));

  $$("[data-cancel-own-unavailability]").forEach(b=>b.onclick=async()=>{
    try{

function openOpponentModal(opponent){

  let removeLogo=false;
  let previewUrl=null;

  showModal(opponent?"Modifica avversaria":"Nuova avversaria",`
    <form id="opponent-form">
      <div class="team-logo-settings">
        <div class="team-logo-preview" id="opp-logo-preview">
          ${opponent?.logo_url
            ? `<img src="${esc(opponent.logo_url)}">`
            : esc((opponent?.short_name||"VS").slice(0,3).toUpperCase())
          }
        </div>

        <div>
          <div class="field">
            <label>Logo</label>
            <input id="opp-logo-file" type="file" accept="image/png,image/jpeg,image/webp">
          </div>
          ${opponent?.logo_url
            ? `<button class="btn btn-sm btn-danger" type="button" id="opp-remove-logo">Rimuovi logo</button>`
            : ""
          }
        </div>
      </div>

      <div class="field"><label>Nome</label><input id="opp-name" value="${esc(opponent?.name||"")}" required></div>
      <div class="field"><label>Nome breve / sigla</label><input id="opp-short" value="${esc(opponent?.short_name||"")}" maxlength="16"></div>

      <h3>Campo di casa</h3>

      <div class="field"><label>Nome campo</label><input id="opp-field-name" value="${esc(opponent?.home_venue_name||"")}" placeholder="es. Stadio Comunale"></div>
      <div class="field"><label>Indirizzo</label><input id="opp-field-address" value="${esc(opponent?.home_address_line||"")}"></div>

      <div class="form-grid">
        <div class="field"><label>Città</label><input id="opp-field-city" value="${esc(opponent?.home_city||"")}"></div>
        <div class="field"><label>Provincia</label><input id="opp-field-province" maxlength="3" value="${esc(opponent?.home_province||"")}"></div>
      </div>

      <div class="form-grid">
        <div class="field"><label>CAP</label><input id="opp-field-postal" value="${esc(opponent?.home_postal_code||"")}"></div>
        <div class="field"><label>Paese</label><input id="opp-field-country" value="${esc(opponent?.home_country||"Italia")}"></div>
      </div>

      <label class="check">
        <input id="opp-active" type="checkbox" ${opponent?.active===false?"":"checked"}>
        Avversaria attiva e proposta nelle nuove partite
      </label>

      <div style="height:10px"></div>
      <div class="field"><label>Note</label><textarea id="opp-notes">${esc(opponent?.notes||"")}</textarea></div>

      <button class="btn btn-primary">Salva avversaria</button>
    </form>
  `,root=>{
    $("#opp-logo-file",root).onchange=e=>{
      const f=e.target.files?.[0];
      if(!f)return;
      if(!["image/png","image/jpeg","image/webp"].includes(f.type)){toast("Formato logo non supportato","error");return}
      if(f.size>5*1024*1024){toast("Logo massimo 5 MB","error");return}

      logoFile=f;
      removeLogo=false;
      if(previewUrl)URL.revokeObjectURL(previewUrl);
      previewUrl=URL.createObjectURL(f);
      $("#opp-logo-preview",root).innerHTML=`<img src="${previewUrl}">`;
    };

    $("#opp-remove-logo",root)?.addEventListener("click",()=>{
      logoFile=null;
      removeLogo=true;
      $("#opp-logo-preview",root).textContent=($("#opp-short",root).value||"VS").slice(0,3).toUpperCase();
    });

    $("#opponent-form",root).onsubmit=async e=>{
      e.preventDefault();
      try{
        const row={
          team_id:state.team.id,
          name:$("#opp-name",root).value.trim(),
          short_name:$("#opp-short",root).value.trim()||null,
          home_venue_name:$("#opp-field-name",root).value.trim()||null,
          home_address_line:$("#opp-field-address",root).value.trim()||null,
          home_city:$("#opp-field-city",root).value.trim()||null,
          home_province:$("#opp-field-province",root).value.trim().toUpperCase()||null,
          home_postal_code:$("#opp-field-postal",root).value.trim()||null,
          home_country:$("#opp-field-country",root).value.trim()||"Italia",
          default_venue_id:null,
          active:$("#opp-active",root).checked,
          notes:$("#opp-notes",root).value.trim()||null,
          created_by:opponent?.created_by||state.profile.id
        };

        let saved;
        if(opponent){
          saved=await must(
            supabase.from("opponent_teams")
              .update(row)
              .eq("id",opponent.id)
              .select("*")
              .single()
          );
        }else{
          saved=await must(
            supabase.from("opponent_teams")
              .insert(row)
              .select("*")
              .single()
          );
        }

        let logoUrl=opponent?.logo_url||null;
        const logoPath=`${state.team.id}/${saved.id}/logo.png`;

        if(logoFile){
          const blob=await normalizeLogoToPng(logoFile);
          const {error}=await supabase.storage
            .from("opponent-assets")
            .upload(logoPath,blob,{contentType:"image/png",cacheControl:"3600",upsert:true});
          if(error)throw error;

          const {data}=supabase.storage.from("opponent-assets").getPublicUrl(logoPath);
          logoUrl=`${data.publicUrl}?v=${Date.now()}`;
        }else if(removeLogo){
          await supabase.storage.from("opponent-assets").remove([logoPath]);
          logoUrl=null;
        }

        if(logoUrl!==saved.logo_url){
          await must(
            supabase.from("opponent_teams")
              .update({logo_url:logoUrl})
              .eq("id",saved.id)
          );
        }

        if(previewUrl)URL.revokeObjectURL(previewUrl);
        closeModal();
        toast("Avversaria salvata","ok");
        pageOpponents();
      }catch(err){
        toast(err.message,"error");
      }
    };
  });
}

async function pageMedical(){
  await syncMedicalAbsencesSafe();

  const allPlayers=await must(
    supabase.from("players")
      .select("id,first_name,last_name,profile_id,photo_url")
      .eq("team_id",state.team.id)
      .order("last_name")
  );

  const players=can("medical.view_all")
    ? allPlayers
    : allPlayers.filter(p=>p.profile_id===state.profile.id);

  const genericMap=await loadGenericRoleMap();

  const [exams,appointments]=await Promise.all([
    must(
      supabase.from("medical_examinations")
        .select("*")
        .eq("team_id",state.team.id)
        .lte("issued_date",today())
        .order("issued_date",{ascending:false})
    ),
    must(
      supabase.from("medical_appointments")
        .select("*")
        .eq("team_id",state.team.id)
        .order("scheduled_for",{ascending:true})
    )
  ]);

  const latest=new Map();
  exams.forEach(e=>{
    if(!latest.has(e.player_id))latest.set(e.player_id,e);
  });

  const scheduled=new Map();
  appointments
    .filter(a=>a.status==="scheduled")
    .forEach(a=>{
      if(!scheduled.has(a.player_id))scheduled.set(a.player_id,a);
    });

  const validCount=players.filter(p=>{
    const e=latest.get(p.id);
    return e&&e.issued_date<=today()&&e.expires_on>=today();
  }).length;

  const expiring=players.filter(p=>{
    const e=latest.get(p.id);
    if(!e||e.expires_on<today())return false;
    const days=medicalDaysToExpiry(e.expires_on);
    return days!==null&&days<=45;
  }).length;

  const invalid=players.length-validCount;

  renderShell("Visite mediche",`
    <div class="page-title">
      <div>
        <h1>Visite mediche</h1>
        <p>Una visita programmata non abilita il calciatore finché non viene confermata come svolta dalla dirigenza.</p>
      </div>
      ${can("medical.manage")?`<button class="btn btn-primary" id="new-medical">Programma visita</button>`:""}
    </div>

    <div class="grid grid-3">
      <div class="card"><div class="stat">${validCount}</div><div class="stat-label">Abilitati oggi</div></div>
      <div class="card"><div class="stat">${expiring}</div><div class="stat-label">Scadenza ≤45 gg</div></div>
      <div class="card"><div class="stat">${invalid}</div><div class="stat-label">Non abilitati</div></div>
    </div>

    <div style="height:14px"></div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Calciatore</th>
            <th>Ultima visita</th>
            <th>Scadenza</th>
            <th>Prossima visita</th>
            <th>Stato</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${players.map(p=>{
            const exam=latest.get(p.id);
            const appointment=scheduled.get(p.id);
            const status=medicalStatus(exam);
            const due=appointment&&appointment.scheduled_for<=today();

            return `<tr>
              <td>${playerListIdentity(p,genericMap.get(p.id))}</td>
              <td>${exam?fmtDate(exam.issued_date):"—"}</td>
              <td>${exam?fmtDate(exam.expires_on):"—"}</td>
              <td>
                ${appointment
                  ? `<span class="medical-scheduled ${due?"medical-due":""}">
                      ${due?"⏳":"📅"} ${fmtDate(appointment.scheduled_for)}
                    </span>`
                  : "—"
                }
              </td>
              <td><span class="badge ${status.cls}">${esc(status.label)}</span></td>
              <td>
                ${can("medical.manage")?`
                  <div class="actions">
                    <button class="btn btn-sm" data-schedule-medical="${p.id}">
                      ${appointment?"Riprogramma":"Programma"}
                    </button>
                    ${appointment&&due
                      ? `<button class="btn btn-sm btn-primary" data-approve-medical="${appointment.id}">Approva svolta</button>
                         <button class="btn btn-sm btn-danger" data-missed-medical="${appointment.id}">Non svolta</button>`
                      : ""
                    }
                    ${appointment&&!due
                      ? `<button class="btn btn-sm btn-ghost" data-cancel-medical="${appointment.id}">Annulla</button>`
                      : ""
                    }
                  </div>
                `:""}
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `);

  $("#new-medical")?.addEventListener("click",()=>openMedicalScheduleModal(players));

  $$("[data-schedule-medical]").forEach(b=>{
    const playerId=b.dataset.scheduleMedical;
    b.onclick=()=>openMedicalScheduleModal(
      players,
      playerId,
      scheduled.get(playerId)||null
    );
  });

  $$("[data-approve-medical]").forEach(b=>b.onclick=()=>{
    const appointment=appointments.find(a=>a.id===b.dataset.approveMedical);
    if(appointment)openMedicalApprovalModal(appointment,players);
  });

  $$("[data-missed-medical]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Confermi che la visita programmata non è stata svolta?"))return;
    try{
      await must(
        supabase.rpc("resolve_medical_appointment",{
          p_appointment_id:b.dataset.missedMedical,
          p_result:"missed",
          p_actual_date:null,
          p_provider:null,
          p_certificate_number:null,
          p_notes:"Visita non svolta come programmato"
        })
      );
      toast("Visita segnata come non svolta","ok");
      pageMedical();
    }catch(err){
      toast(err.message,"error");
    }
  });

  $$("[data-cancel-medical]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Annullare la visita programmata?"))return;
    try{
      await must(
        supabase.rpc("resolve_medical_appointment",{
          p_appointment_id:b.dataset.cancelMedical,
          p_result:"cancelled",
          p_actual_date:null,
          p_provider:null,
          p_certificate_number:null,
          p_notes:"Appuntamento annullato"
        })
      );
      toast("Visita programmata annullata","ok");
      pageMedical();
    }catch(err){
      toast(err.message,"error");
    }
  });
}

async function pageCash(){
  await syncMedicalAbsencesSafe();

  await must(
    supabase.rpc("ensure_cash_setup",{
      p_team_id:state.team.id,
      p_season_id:state.season.id
    })
  );

  const [fines,fees,players,genericRows,assignments,plans,history]=await Promise.all([
    must(
      supabase.from("fines")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
        .order("fine_date",{ascending:false})
    ),
    must(
      supabase.from("membership_fees")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
        .order("due_date",{ascending:true})
    ),
    must(
      supabase.from("players")
        .select("id,first_name,last_name,profile_id,photo_url")
        .eq("team_id",state.team.id)
        .order("last_name")
    ),
    must(
      supabase.rpc("get_roster_generic_roles",{
        p_team_id:state.team.id,
        p_season_id:state.season.id
      })
    ),
    must(
      supabase.from("player_fee_plan_assignments")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
    ),
    must(
      supabase.from("season_fee_plans")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
    ),
    must(
      supabase.rpc("get_season_roster_history",{
        p_team_id:state.team.id,
        p_season_id:state.season.id
      })
    )
  ]);

  const pm=new Map(players.map(p=>[p.id,p]));
  const gm=new Map(genericRows.map(x=>[x.player_id,x.generic_role_code||null]));
  const assignmentMap=new Map(assignments.map(x=>[x.player_id,x.payment_mode]));
  const now=today();

  const singleAvailable=plans.some(x=>x.payment_mode==="single"&&x.active);
  const installmentsAvailable=plans.some(x=>x.payment_mode==="installments"&&x.active);

  const activeIds=new Set(
    history
      .filter(x=>
        x.roster_status==="active"
        && now>=x.start_date
        && now<=(x.actual_end_date||x.planned_end_date)
      )
      .map(x=>x.player_id)
  );

  const visiblePlayers=isStaffAudience()
    ? players.filter(p=>activeIds.has(p.id))
    : players.filter(p=>p.profile_id===state.profile.id);

  const activeFines=fines.filter(x=>x.status!=="cancelled");
  const activeFees=fees.filter(x=>x.status!=="cancelled");

  const pendingFines=activeFines
    .filter(x=>x.status==="pending")
    .reduce((a,x)=>a+Number(x.amount||0),0);

  const pendingFees=activeFees
    .filter(x=>x.status==="pending")
    .reduce((a,x)=>a+Number(x.amount||0),0);

  const overdueFees=activeFees
    .filter(x=>x.status==="pending"&&x.due_date&&x.due_date<now)
    .reduce((a,x)=>a+Number(x.amount||0),0);

  const paid=
    activeFines.filter(x=>x.status==="paid").reduce((a,x)=>a+Number(x.amount||0),0)
    +activeFees.filter(x=>x.status==="paid").reduce((a,x)=>a+Number(x.amount||0),0);

  const modeOptions=(selected)=>`
    <option value="single" ${selected==="single"?"selected":""} ${singleAvailable?"":"disabled"}>Una tantum</option>
    <option value="installments" ${selected==="installments"?"selected":""} ${installmentsAvailable?"":"disabled"}>Dilazionato</option>
  `;

  const summaryRows=visiblePlayers.map(p=>{
    const pf=activeFees.filter(x=>x.player_id===p.id);
    const pending=pf.filter(x=>x.status==="pending");
    const overdue=pending.filter(x=>x.due_date&&x.due_date<now);
    const reported=pending.filter(x=>x.payment_report_status==="reported");
    const next=pending
      .filter(x=>x.due_date)
      .sort((a,b)=>a.due_date.localeCompare(b.due_date))[0]||null;
    const mode=assignmentMap.get(p.id)||(singleAvailable?"single":installmentsAvailable?"installments":"single");
    const canChoose=
      (state.myPlayer?.id===p.id)
      || can("fees.manage")
      || can("cash.setup");

    return `<tr>
      <td>${playerListIdentity(p,gm.get(p.id))}</td>
      <td>
        <select class="cash-mode-select" data-fee-mode="${p.id}" ${canChoose?"":"disabled"}>
          ${modeOptions(mode)}
        </select>
      </td>
      <td>€ ${pending.reduce((a,x)=>a+Number(x.amount||0),0).toFixed(2)}</td>
      <td>${next?fmtDate(next.due_date):"—"}</td>
      <td>
        ${overdue.length
          ? `<span class="badge red">💰 ${overdue.length} scadut${overdue.length===1?"a":"e"}</span>`
          : reported.length
            ? `<span class="badge yellow">⏳ pagamento in verifica</span>`
            : pending.length
              ? `<span class="badge">aperta</span>`
              : `<span class="badge green">regolare</span>`
        }
      </td>
    </tr>`;
  }).join("");

  const feeRows=activeFees.map(x=>{
    const overdue=x.status==="pending"&&x.due_date&&x.due_date<now;
    const p=pm.get(x.player_id);
    const own=state.myPlayer?.id===x.player_id;
    const reported=x.payment_report_status==="reported";
    const rejected=x.payment_report_status==="rejected";

    let statusHtml=x.status==="paid"
      ? `<span class="badge green">✅ pagata</span>`
      : x.status==="waived"
        ? `<span class="badge green">abbuonata</span>`
        : reported
          ? `<span class="badge yellow">⏳ segnalata pagata</span>`
          : overdue
            ? `<span class="badge red">scaduta</span>`
            : `<span class="badge">da pagare</span>`;

    if(rejected&&x.status==="pending"){
      statusHtml+=`<div class="muted payment-report-note">Segnalazione respinta${x.payment_review_note?`: ${esc(x.payment_review_note)}`:""}</div>`;
    }

    return `<tr>
      <td>${x.due_date?fmtDate(x.due_date):"—"}</td>
      <td>${playerListIdentity(p,gm.get(x.player_id))}</td>
      <td>${esc(x.title)}</td>
      <td>€ ${Number(x.amount||0).toFixed(2)}</td>
      <td>${statusHtml}</td>
      <td>
        <div class="payment-review-actions">
          ${own&&x.status==="pending"&&!reported
            ? `<button class="btn btn-sm btn-primary" data-report-fee-paid="${x.id}">✓ Ho pagato</button>`
            : ""
          }
          ${can("fees.manage")&&reported
            ? `<button class="btn btn-sm btn-primary" data-review-fee="${x.id}" data-action="approve">Approva</button>
               <button class="btn btn-sm btn-danger" data-review-fee="${x.id}" data-action="reject">Rifiuta</button>`
            : ""
          }
          ${can("fees.manage")&&x.status==="pending"&&!reported
            ? `<button class="btn btn-sm" data-fee-paid="${x.id}">Pagata</button>
               <button class="btn btn-sm btn-ghost" data-fee-waive="${x.id}">Abbuona</button>`
            : ""
          }
        </div>
      </td>
    </tr>`;
  }).join("");

  const fineRows=activeFines.map(x=>{
    const p=pm.get(x.player_id);
    const own=state.myPlayer?.id===x.player_id;
    const auto=x.source_kind==="match_event";
    const reported=x.payment_report_status==="reported";
    const rejected=x.payment_report_status==="rejected";

    const statusHtml=x.status==="paid"
      ? `<span class="badge green">✅ pagata</span>`
      : reported
        ? `<span class="badge yellow">⏳ segnalata pagata</span>`
        : `<span class="badge">da pagare</span>`;

    return `<tr>
      <td>${fmtDate(x.fine_date)}</td>
      <td>${playerListIdentity(p,gm.get(x.player_id))}</td>
      <td>
        ${esc(x.reason)}
        ${auto?`<span class="badge cash-auto-tag">auto</span>`:""}
        ${x.adjustment_note?`<div class="muted">${esc(x.adjustment_note)}</div>`:""}
        ${rejected&&x.status==="pending"
          ? `<div class="muted payment-report-note">Segnalazione respinta${x.payment_review_note?`: ${esc(x.payment_review_note)}`:""}</div>`
          : ""
        }
      </td>
      <td>€ ${Number(x.amount||0).toFixed(2)}</td>
      <td>${statusHtml}</td>
      <td>
        <div class="payment-review-actions">
          ${own&&x.status==="pending"&&!reported
            ? `<button class="btn btn-sm btn-primary" data-report-fine-paid="${x.id}">✓ Ho pagato</button>`
            : ""
          }
          ${can("fines.manage")&&reported
            ? `<button class="btn btn-sm btn-primary" data-review-fine="${x.id}" data-action="approve">Approva</button>
               <button class="btn btn-sm btn-danger" data-review-fine="${x.id}" data-action="reject">Rifiuta</button>`
            : ""
          }
          ${can("fines.manage")
            ? `<button class="btn btn-sm" data-edit-fine="${x.id}">Modifica</button>
               ${x.status==="pending"&&!reported?`<button class="btn btn-sm" data-fine-paid="${x.id}">Pagata</button>`:""}`
            : ""
          }
        </div>
      </td>
    </tr>`;
  }).join("");

  renderShell("Cassa",`
    <div class="page-title">
      <div>
        <h1>Cassa</h1>
        <p>Quote, modalità di pagamento e sanzioni della stagione ${esc(state.season.name)}.</p>
      </div>
      <div class="actions">
        ${can("cash.setup")||can("fees.manage")||can("fines.categories_manage")
          ? `<button class="btn" id="cash-setup">⚙ Setup Cassa</button>`
          : ""
        }
        ${can("fines.manage")?`<button class="btn btn-primary" id="cash-new-fine">+ Multa</button>`:""}
      </div>
    </div>

    <div class="grid grid-4">
      <div class="card"><div class="stat">€ ${pendingFees.toFixed(2)}</div><div class="stat-label">Quote aperte</div></div>
      <div class="card"><div class="stat ${overdueFees?"cash-overdue":""}">€ ${overdueFees.toFixed(2)}</div><div class="stat-label">Quote scadute</div></div>
      <div class="card"><div class="stat">€ ${pendingFines.toFixed(2)}</div><div class="stat-label">Multe aperte</div></div>
      <div class="card"><div class="stat">€ ${paid.toFixed(2)}</div><div class="stat-label">Incassato</div></div>
    </div>

    <div style="height:10px"></div>

    <div class="card cash-summary-card">
      <div class="card-head">
        <div>
          <h2>💳 Riepilogo quote</h2>
          <div class="muted">La modalità si sceglie direttamente qui. Il calciatore può selezionare autonomamente la propria formula.</div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="table cash-table">
          <thead><tr><th>Calciatore</th><th>Modalità</th><th>Da pagare</th><th>Prossima scadenza</th><th>Situazione</th></tr></thead>
          <tbody>${summaryRows||`<tr><td colspan="5">Nessuna quota configurata</td></tr>`}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Dettaglio quote</h2>
      <div class="table-wrap">
        <table class="table cash-table">
          <thead><tr><th>Scadenza</th><th>Calciatore</th><th>Rata</th><th>Importo</th><th>Stato</th><th>Azioni</th></tr></thead>
          <tbody>${feeRows||`<tr><td colspan="6">Nessuna quota generata.</td></tr>`}</tbody>
        </table>
      </div>
    </div>

    <div style="height:10px"></div>

    <div class="card">
      <h2>Multe</h2>
      <div class="table-wrap">
        <table class="table cash-table">
          <thead><tr><th>Data</th><th>Calciatore</th><th>Sanzione</th><th>Importo</th><th>Stato</th><th>Azioni</th></tr></thead>
          <tbody>${fineRows||`<tr><td colspan="6">Nessuna multa</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `);

  $("#cash-setup")?.addEventListener("click",openCashSetup);
  $("#cash-new-fine")?.addEventListener("click",()=>openFineModal(players,gm));

  $$("[data-fee-mode]").forEach(sel=>sel.onchange=async()=>{
    const playerId=sel.dataset.feeMode;
    try{
      if(state.myPlayer?.id===playerId&&!can("fees.manage")){
        await must(
          supabase.rpc("set_my_fee_payment_mode",{
            p_team_id:state.team.id,
            p_season_id:state.season.id,
            p_payment_mode:sel.value
          })
        );
      }else{
        await must(
          supabase.rpc("set_player_fee_payment_mode",{
            p_team_id:state.team.id,
            p_season_id:state.season.id,
            p_player_id:playerId,
            p_payment_mode:sel.value
          })
        );
      }
      toast("Modalità quota aggiornata","ok");
      pageCash();
    }catch(err){
      toast(err.message,"error");
      pageCash();
    }
  });

  $$("[data-report-fee-paid]").forEach(b=>b.onclick=async()=>{
    try{
      await must(supabase.rpc("report_my_fee_paid",{p_fee_id:b.dataset.reportFeePaid}));
      toast("Pagamento segnalato alla dirigenza","ok");
      pageCash();
    }catch(err){toast(err.message,"error")}
  });

  $$("[data-report-fine-paid]").forEach(b=>b.onclick=async()=>{
    try{
      await must(supabase.rpc("report_my_fine_paid",{p_fine_id:b.dataset.reportFinePaid}));
      toast("Pagamento multa segnalato alla dirigenza","ok");
      pageCash();
    }catch(err){toast(err.message,"error")}
  });

  $$("[data-review-fee]").forEach(b=>b.onclick=async()=>{
    const action=b.dataset.action;
    const note=action==="reject"?prompt("Motivo del rifiuto (facoltativo)",""):null;
    try{
      await must(
        supabase.rpc("review_fee_payment_report",{
          p_fee_id:b.dataset.reviewFee,
          p_action:action,
          p_note:note||null
        })
      );
      toast(action==="approve"?"Pagamento approvato":"Segnalazione rifiutata","ok");
      pageCash();
    }catch(err){toast(err.message,"error")}
  });

  $$("[data-review-fine]").forEach(b=>b.onclick=async()=>{
    const action=b.dataset.action;
    const note=action==="reject"?prompt("Motivo del rifiuto (facoltativo)",""):null;
    try{
      await must(
        supabase.rpc("review_fine_payment_report",{
          p_fine_id:b.dataset.reviewFine,
          p_action:action,
          p_note:note||null
        })
      );
      toast(action==="approve"?"Pagamento approvato":"Segnalazione rifiutata","ok");
      pageCash();
    }catch(err){toast(err.message,"error")}
  });

  $$("[data-fine-paid]").forEach(b=>b.onclick=async()=>{
    try{
      await must(
        supabase.from("fines")
          .update({status:"paid",paid_at:new Date().toISOString()})
          .eq("id",b.dataset.finePaid)
      );
      pageCash();
    }catch(e){toast(e.message,"error")}
  });

  $$("[data-edit-fine]").forEach(b=>{
    b.onclick=()=>{
      const fine=fines.find(x=>x.id===b.dataset.editFine);
      if(fine)openFineEditModal(fine,players,gm);
    };
  });

  $$("[data-fee-paid]").forEach(b=>b.onclick=async()=>{
    try{
      await must(
        supabase.from("membership_fees")
          .update({status:"paid",paid_at:new Date().toISOString()})
          .eq("id",b.dataset.feePaid)
      );
      pageCash();
    }catch(e){toast(e.message,"error")}
  });

  $$("[data-fee-waive]").forEach(b=>b.onclick=async()=>{
    try{
      await must(
        supabase.from("membership_fees")
          .update({status:"waived"})
          .eq("id",b.dataset.feeWaive)
      );
      pageCash();
    }catch(e){toast(e.message,"error")}
  });
}

async function openCashSetup(){
  try{
    await must(
      supabase.rpc("ensure_cash_setup",{
        p_team_id:state.team.id,
        p_season_id:state.season.id
      })
    );

    const [planRows,rules]=await Promise.all([
      must(
        supabase.from("season_fee_plans")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("season_id",state.season.id)
      ),
      must(
        supabase.from("cash_fine_rules")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("season_id",state.season.id)
          .order("sort_order")
      )
    ]);

    const planSingle=planRows.find(x=>x.payment_mode==="single")||null;
    const planInstallments=planRows.find(x=>x.payment_mode==="installments")||null;
    const planIds=planRows.map(x=>x.id);

    const allInstallments=planIds.length
      ? await must(
          supabase.from("season_fee_installments")
            .select("*")
            .in("plan_id",planIds)
            .eq("active",true)
            .order("installment_no")
        )
      : [];

    const singleItems=planSingle
      ? allInstallments.filter(x=>x.plan_id===planSingle.id)
      : [];

    const installmentItems=planInstallments
      ? allInstallments.filter(x=>x.plan_id===planInstallments.id)
      : [];

    let draftRules=rules.map(x=>({...x}));

    showModal("Setup Cassa",`
      <div class="cash-tabs">
        <button class="btn active" type="button" data-cash-tab="fees">💳 Quote</button>
        <button class="btn" type="button" data-cash-tab="fines">💸 Tariffario multe</button>
      </div>

      <div id="cash-setup-fees">
        <div class="dual-fee-grid">
          <form class="fee-plan-column" id="fee-single-form">
            <h3>💳 Pagamento unico</h3>
            <div class="field"><label>Descrizione</label><input id="fsp-single-title" value="${esc(planSingle?.title||`Quota ${state.season.name}`)}" required></div>
            <div class="form-grid">
              <div class="field"><label>Importo €</label><input id="fsp-single-amount" type="number" min="0" step=".01" value="${singleItems[0]?.amount??""}" required></div>
              <div class="field"><label>Scadenza</label><input id="fsp-single-due" type="date" value="${singleItems[0]?.due_date||""}" required></div>
            </div>
            <div class="field"><label>Note</label><textarea id="fsp-single-notes">${esc(planSingle?.notes||"")}</textarea></div>
            <label class="check"><input id="fsp-single-active" type="checkbox" ${planSingle?.active===false?"":"checked"}> Formula disponibile</label>
            <div class="actions" style="margin-top:10px"><button class="btn btn-primary">Salva pagamento unico</button></div>
          </form>

          <form class="fee-plan-column" id="fee-installments-form">
            <h3>🗓️ Pagamento dilazionato</h3>
            <div class="field"><label>Descrizione</label><input id="fsp-inst-title" value="${esc(planInstallments?.title||`Quota ${state.season.name} dilazionata`)}" required></div>
            <div class="field"><label>Numero tranche</label><input id="fsp-inst-count" type="number" min="2" max="12" value="${Math.max(2,installmentItems.length||2)}"></div>
            <div class="fee-installments-editor" id="fsp-inst-editor"></div>
            <div class="field" style="margin-top:8px"><label>Note</label><textarea id="fsp-inst-notes">${esc(planInstallments?.notes||"")}</textarea></div>
            <label class="check"><input id="fsp-inst-active" type="checkbox" ${planInstallments?.active===false?"":"checked"}> Formula disponibile</label>
            <div class="actions" style="margin-top:10px"><button class="btn btn-primary">Salva pagamento dilazionato</button></div>
          </form>
        </div>

        <div class="section-note" style="margin-top:10px">
          La formula del singolo calciatore non si gestisce più qui: viene scelta direttamente nel riepilogo Quote della Cassa.
        </div>
      </div>

      <div id="cash-setup-fines" class="hidden">
        <div class="section-note">
          La checkbox abilita il controllo. Gialli e rossi vengono generati automaticamente dagli eventi partita, escluse le amichevoli.
        </div>
        <div id="fine-rules-editor" style="margin-top:10px"></div>
        <div class="actions" style="margin-top:12px">
          <button class="btn" type="button" id="add-fine-rule">➕ Aggiungi voce</button>
          <button class="btn btn-primary" type="button" id="save-fine-rules">Salva tariffario</button>
        </div>
      </div>
    `,root=>{
      root.closest(".modal").style.width="min(980px,100%)";

      const instCount=$("#fsp-inst-count",root);
      const instEditor=$("#fsp-inst-editor",root);
      const rulesEditor=$("#fine-rules-editor",root);

      const renderInstallments=()=>{
        const n=Math.max(2,Number(instCount.value)||2);
        instEditor.innerHTML=Array.from({length:n},(_,idx)=>{
          const no=idx+1;
          const old=installmentItems.find(x=>x.installment_no===no);

          return `<div class="fee-installment-row">
            <div class="field"><label>Rata</label><input value="${no}" disabled></div>
            <div class="field"><label>€</label><input data-inst-amount="${no}" type="number" min="0" step=".01" value="${old?.amount??""}" required></div>
            <div class="field installment-due"><label>Scadenza</label><input data-inst-due="${no}" type="date" value="${old?.due_date||""}" required></div>
          </div>`;
        }).join("");
      };

      const renderRules=()=>{
        rulesEditor.innerHTML=draftRules.map((r,idx)=>`
          <div class="fine-rule-row">
            <label class="check"><input type="checkbox" data-rule-enabled="${idx}" ${r.enabled?"checked":""}></label>
            <input data-rule-label="${idx}" value="${esc(r.label)}" ${r.is_system?"readonly":""}>
            <input data-rule-amount="${idx}" type="number" min="0" step=".50" value="${Number(r.amount||0)}">
            ${r.is_system
              ? `<span>${r.automatic_event_type?"⚡":"•"}</span>`
              : `<button class="btn btn-sm btn-danger" type="button" data-rule-remove="${idx}">×</button>`
            }
          </div>
        `).join("");

        $$("[data-rule-remove]",rulesEditor).forEach(b=>b.onclick=()=>{
          draftRules.splice(Number(b.dataset.ruleRemove),1);
          renderRules();
        });
      };

      instCount.oninput=renderInstallments;
      renderInstallments();
      renderRules();

      $$("[data-cash-tab]",root).forEach(b=>b.onclick=()=>{
        $$("[data-cash-tab]",root).forEach(x=>x.classList.toggle("active",x===b));
        const tab=b.dataset.cashTab;
        $("#cash-setup-fees",root).classList.toggle("hidden",tab!=="fees");
        $("#cash-setup-fines",root).classList.toggle("hidden",tab!=="fines");
      });

      $("#fee-single-form",root).onsubmit=async e=>{
        e.preventDefault();
        try{
          await must(
            supabase.rpc("save_season_fee_plan",{
              p_team_id:state.team.id,
              p_season_id:state.season.id,
              p_title:$("#fsp-single-title",root).value.trim(),
              p_payment_mode:"single",
              p_installments:[{
                installment_no:1,
                amount:Number($("#fsp-single-amount",root).value),
                due_date:$("#fsp-single-due",root).value
              }],
              p_active:$("#fsp-single-active",root).checked,
              p_notes:$("#fsp-single-notes",root).value.trim()||null
            })
          );
          toast("Pagamento unico salvato","ok");
        }catch(err){toast(err.message,"error")}
      };

      $("#fee-installments-form",root).onsubmit=async e=>{
        e.preventDefault();
        try{
          const n=Math.max(2,Number(instCount.value)||2);
          const payload=Array.from({length:n},(_,idx)=>{
            const no=idx+1;
            return {
              installment_no:no,
              amount:Number($(`[data-inst-amount="${no}"]`,root).value),
              due_date:$(`[data-inst-due="${no}"]`,root).value
            };
          });

          await must(
            supabase.rpc("save_season_fee_plan",{
              p_team_id:state.team.id,
              p_season_id:state.season.id,
              p_title:$("#fsp-inst-title",root).value.trim(),
              p_payment_mode:"installments",
              p_installments:payload,
              p_active:$("#fsp-inst-active",root).checked,
              p_notes:$("#fsp-inst-notes",root).value.trim()||null
            })
          );
          toast("Pagamento dilazionato salvato","ok");
        }catch(err){toast(err.message,"error")}
      };

      $("#add-fine-rule",root).onclick=()=>{
        draftRules.push({
          id:null,
          rule_code:`custom_${crypto.randomUUID().replaceAll("-","").slice(0,12)}`,
          label:"Nuova sanzione",
          amount:0,
          enabled:true,
          automatic_event_type:null,
          is_system:false,
          sort_order:100+draftRules.length
        });
        renderRules();
      };

      $("#save-fine-rules",root).onclick=async()=>{
        try{
          const rows=draftRules.map((r,idx)=>({
            id:r.id||undefined,
            team_id:state.team.id,
            season_id:state.season.id,
            rule_code:r.rule_code,
            label:$(`[data-rule-label="${idx}"]`,rulesEditor).value.trim(),
            amount:Number($(`[data-rule-amount="${idx}"]`,rulesEditor).value)||0,
            enabled:$(`[data-rule-enabled="${idx}"]`,rulesEditor).checked,
            automatic_event_type:r.automatic_event_type,
            is_system:!!r.is_system,
            sort_order:r.sort_order??100+idx,
            created_by:r.created_by||state.profile.id
          }));

          const existingIds=new Set(rows.filter(x=>x.id).map(x=>x.id));
          const removed=rules.filter(r=>!r.is_system&&!existingIds.has(r.id));

          for(const row of rows){
            if(row.id){
              const {id,...changes}=row;
              await must(supabase.from("cash_fine_rules").update(changes).eq("id",id));
            }else{
              delete row.id;
              await must(supabase.from("cash_fine_rules").insert(row));
            }
          }

          for(const r of removed){
            await must(supabase.from("cash_fine_rules").delete().eq("id",r.id));
          }

          await must(
            supabase.rpc("resync_automatic_fines",{
              p_team_id:state.team.id,
              p_season_id:state.season.id
            })
          );

          toast("Tariffario salvato","ok");
        }catch(err){toast(err.message,"error")}
      };
    });
  }catch(err){
    toast(err.message,"error");
  }
}

async function openFineModal(players,genericMap){
  try{
    const rules=await must(
      supabase.from("cash_fine_rules")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
        .eq("enabled",true)
        .order("sort_order")
    );

    if(!rules.length){
      toast("Nessuna sanzione abilitata nel tariffario","error");
      return;
    }

    showModal("Nuova multa",`
      <form id="fine-form">
        <div class="field">
          <label>Calciatore</label>
          <select id="fine-player">
            ${players.map(p=>`<option value="${p.id}">${esc(p.last_name)} ${esc(p.first_name)}</option>`).join("")}
          </select>
        </div>

        <div class="field">
          <label>Tipologia</label>
          <select id="fine-rule">
            ${rules.map(r=>`<option value="${r.id}">${esc(r.label)}</option>`).join("")}
          </select>
        </div>

        <div class="form-grid">
          <div class="field"><label>Data</label><input id="fine-date" type="date" value="${today()}" required></div>
          <div class="field"><label>Importo €</label><input id="fine-amount" type="number" min="0" step=".50" required></div>
        </div>

        <div class="field">
          <label>Descrizione / dettaglio</label>
          <textarea id="fine-reason"></textarea>
        </div>

        <button class="btn btn-primary">Registra multa</button>
      </form>
    `,root=>{
      const ruleSel=$("#fine-rule",root);
      const amount=$("#fine-amount",root);
      const reason=$("#fine-reason",root);

      const applyRule=()=>{
        const r=rules.find(x=>x.id===ruleSel.value);
        amount.value=Number(r?.amount||0);
        if(!reason.value.trim())reason.value=r?.label||"";
      };
      ruleSel.onchange=applyRule;
      applyRule();

      $("#fine-form",root).onsubmit=async e=>{
        e.preventDefault();
        try{
          const pid=$("#fine-player",root).value;
          const rule=rules.find(x=>x.id===ruleSel.value);
          const player=players.find(p=>p.id===pid);

          await must(
            supabase.from("fines").insert({
              team_id:state.team.id,
              season_id:state.season.id,
              player_id:pid,
              profile_id:player?.profile_id||null,
              fine_rule_id:rule?.id||null,
              source_kind:"manual",
              fine_date:$("#fine-date",root).value,
              amount:Number(amount.value),
              original_amount:Number(rule?.amount||amount.value||0),
              reason:reason.value.trim()||rule?.label||"Multa",
              status:"pending",
              issued_by:state.profile.id
            })
          );

          closeModal();
          toast("Multa registrata","ok");
          pageCash();
        }catch(err){
          toast(err.message,"error");
        }
      };
    });
  }catch(err){
    toast(err.message,"error");
  }
}

      <div style="height:10px"></div>

      <div class="form-grid">
        <div class="field"><label>Data</label><input id="fine-edit-date" type="date" value="${fine.fine_date}" required></div>
        <div class="field"><label>Importo €</label><input id="fine-edit-amount" type="number" min="0" step=".50" value="${Number(fine.amount||0)}" required></div>
      </div>

      <div class="field">
        <label>Motivo</label>

        ${fine.status!=="cancelled"?`<button class="btn btn-danger" type="button" id="fine-edit-delete">Elimina sanzione</button>`:""}
      </div>
    </form>
  `,root=>{

      e.preventDefault();

        await must(
          supabase.from("fines")
            .update({
              fine_date:$("#fine-edit-date",root).value,
              amount:Number($("#fine-edit-amount",root).value),
              reason:$("#fine-edit-reason",root).value.trim(),
              adjustment_note:$("#fine-edit-note",root).value.trim()||null
            })
            .eq("id",fine.id)
        );
        closeModal();toast("Multa aggiornata","ok");pageCash();
      }catch(err){toast(err.message,"error")}
    };

    $("#fine-edit-paid",root)?.addEventListener("click",async()=>{
      try{
        await must(
          supabase.from("fines")
            .update({status:"paid",paid_at:new Date().toISOString()})
            .eq("id",fine.id)
        );
        closeModal();pageCash();
      }catch(err){toast(err.message,"error")}
    });

    $("#fine-edit-delete",root)?.addEventListener("click",async()=>{
      if(!confirm("Eliminare questa sanzione? Resterà nello storico come annullata."))return;
      try{
        await must(
          supabase.from("fines")
            .update({
              status:"cancelled",
              adjustment_note:$("#fine-edit-note",root).value.trim()||"Sanzione annullata manualmente"
            })
            .eq("id",fine.id)
        );
        closeModal();toast("Sanzione annullata","ok");pageCash();
      }catch(err){toast(err.message,"error")}
    });
  });
}

async function pageAdmin(tab="users"){
  const tabs=[
    ["users","Utenti",can("users.manage")],
    ["player-links","Associazioni",can("player_link.approve")],
    ["permissions","Permessi",can("permissions.manage")],
    ["seasons","Stagioni",can("seasons.manage")],
    ["staff","Staff",can("staff.manage")||can("staff.view")],
    ["contracts","Permanenze",can("contracts.manage")],
    ["audit","Audit",can("audit.view")],
    ["organization","Società",can("organization.settings.manage")||can("team.settings.manage")]
  ].filter(x=>x[2]);

  if(!tabs.some(x=>x[0]===tab))tab=tabs[0]?.[0];

  renderShell("Amministrazione",`
    <div class="tabs">
      ${tabs.map(x=>`<button class="tab ${x[0]===tab?"active":""}" data-admin-tab="${x[0]}">${x[1]}</button>`).join("")}
    </div>
    <div id="admin-content"><div class="empty">Caricamento…</div></div>
  `);

  $(".shell")?.classList.add("admin-page");

  $$("[data-admin-tab]").forEach(b=>b.onclick=()=>pageAdmin(b.dataset.adminTab));

  if(tab==="users")return adminUsers();
  if(tab==="player-links")return adminPlayerLinks();
  if(tab==="permissions")return adminPermissions();
  if(tab==="seasons")return adminSeasons();
  if(tab==="staff")return adminStaff();
  if(tab==="contracts")return adminContracts();
  if(tab==="audit")return adminAudit();
  if(tab==="organization")return adminOrganizationSettings();
}
async function adminUsers(){
  const members=await must(
    supabase.from("team_members").select("*").eq("team_id",state.team.id)
  );

  const profiles=members.length
    ? await must(supabase.from("profiles").select("*").in("id",members.map(x=>x.profile_id)))
    : [];

  const roleRows=await must(supabase.from("roles").select("id,code"));
  const adminRole=roleRows.find(r=>r.code==="admin");

  const memberRoles=adminRole && members.length
    ? await must(
        supabase.from("team_member_roles")
          .select("*")
          .in("team_member_id",members.map(x=>x.id))
          .eq("role_id",adminRole.id)
      )
    : [];

  const adminMembers=new Set(
    memberRoles.filter(r=>r.active).map(r=>r.team_member_id)
  );

  const players=await must(
    supabase.from("players")
      .select("*")
      .eq("team_id",state.team.id)
  );

  const linked=new Map(
    players.filter(p=>p.profile_id).map(p=>[p.profile_id,p])
  );

  $("#admin-content").innerHTML=`
    <div class="page-title">
      <div>
        <h2>Utenti</h2>
        <p>Account della squadra. Le associazioni ai calciatori vengono gestite tramite il flusso di approvazione dedicato.</p>
      </div>
      <button class="btn btn-primary" id="admin-new-user">Nuovo utente</button>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr><th>Utente</th><th>Username</th><th>Stato</th><th>Calciatore associato</th><th></th></tr>
        </thead>
        <tbody>
          ${members.map(m=>{
            const p=profiles.find(x=>x.id===m.profile_id);
            const pl=linked.get(m.profile_id);
            const isAdmin=adminMembers.has(m.id)||m.is_owner;

            return `<tr>
              <td>
                ${esc(p?.display_name||"")}
                ${m.is_owner
                  ? `<span class="badge green">owner</span>`
                  : isAdmin
                    ? `<span class="badge blue">admin</span>`
                    : ""
                }
              </td>
              <td>@${esc(p?.username||"")}</td>
              <td>${p?.is_active?"attivo":"disattivato"}</td>
              <td>
                ${pl
                  ? `${esc(pl.last_name+" "+pl.first_name)}
                     ${can("player_link.approve")?`<button class="btn btn-sm btn-ghost" data-unlink-player="${pl.id}">Scollega</button>`:""}`
                  : "—"
                }
              </td>
              <td>
                <div class="actions">
                  <button
                    class="btn btn-sm"
                    data-admin-role="${m.profile_id}"
                    data-admin-enabled="${isAdmin&&!m.is_owner}"
                    ${m.is_owner?"disabled":""}
                  >${isAdmin?"Revoca Admin":"Rendi Admin"}</button>

                  <button class="btn btn-sm" data-reset="${m.profile_id}">Reset psw</button>

                  <button
                    class="btn btn-sm ${p?.is_active?"btn-danger":""}"
                    data-state="${m.profile_id}"
                    data-active="${p?.is_active}"
                  >${p?.is_active?"Disattiva":"Riattiva"}</button>
                </div>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;

  $("#admin-new-user").onclick=()=>openAdminNewUser();

  $$("[data-admin-role]").forEach(b=>b.onclick=async()=>{
    try{
      await must(supabase.rpc("set_member_admin_role",{
        p_team_id:state.team.id,
        p_profile_id:b.dataset.adminRole,
        p_enabled:b.dataset.adminEnabled!=="true"
      }));
      toast("Ruolo Admin aggiornato","ok");
      adminUsers();
    }catch(e){toast(e.message,"error")}
  });

  $$("[data-reset]").forEach(b=>b.onclick=async()=>{
    const pwd=prompt("Nuova password temporanea (min 8 caratteri)");
    if(!pwd)return;
    try{
      await edge("admin-reset-password",{
        team_id:state.team.id,
        user_id:b.dataset.reset,
        password:pwd
      });
      toast("Password reimpostata","ok");
    }catch(e){toast(e.message,"error")}
  });

  $$("[data-state]").forEach(b=>b.onclick=async()=>{
    try{
      await edge("admin-account-state",{
        team_id:state.team.id,
        user_id:b.dataset.state,
        active:b.dataset.active!=="true"
      });
      adminUsers();
    }catch(e){toast(e.message,"error")}
  });

  $$("[data-unlink-player]").forEach(b=>b.onclick=async()=>{
    const player=players.find(p=>p.id===b.dataset.unlinkPlayer);
    if(!player)return;
    const reason=prompt(`Motivo dello scollegamento di ${player.first_name} ${player.last_name}:`,"Correzione associazione");
    if(reason===null)return;
    try{
      await must(supabase.rpc("unlink_player_profile",{
        p_team_id:state.team.id,
        p_player_id:player.id,
        p_reason:reason||null
      }));
      toast("Associazione rimossa","ok");
      adminUsers();
    }catch(e){toast(e.message,"error")}
  });
}
async function adminPlayerLinks(){
  const requests=await must(
    supabase.from("player_link_requests")
      .select("*")
      .eq("team_id",state.team.id)
      .order("requested_at",{ascending:false})
      .limit(200)
  );

  const players=await must(
    supabase.from("players")
      .select("id,first_name,last_name,profile_id,photo_url")
      .eq("team_id",state.team.id)
      .order("last_name")
  );

  const profileIds=[...new Set(requests.map(r=>r.profile_id))];
  const profiles=profileIds.length
    ? await must(
        supabase.from("profiles")
          .select("id,display_name,username,is_active")
          .in("id",profileIds)
      )
    : [];

  const pmap=new Map(players.map(p=>[p.id,p]));
  const umap=new Map(profiles.map(p=>[p.id,p]));

  const pending=requests.filter(r=>r.status==="pending");
  const history=requests.filter(r=>r.status!=="pending");

  const pendingHtml=pending.length
    ? `<div class="list">
        ${pending.map(r=>{
          const player=pmap.get(r.player_id);
          const user=umap.get(r.profile_id);
          return `<div class="list-item">
            <div>
              <strong>${esc(user?.display_name||"Utente")}</strong>
              <span class="muted">@${esc(user?.username||"")}</span>
              <div style="margin-top:4px">
                chiede di essere associato a
                <strong>${esc(player?`${player.last_name} ${player.first_name}`:"Calciatore")}</strong>
              </div>
              <div class="muted">${fmtDateTime(r.requested_at)}</div>
            </div>
            <div class="actions">
              <button class="btn btn-sm btn-primary" data-link-approve="${r.id}">Approva</button>
              <button class="btn btn-sm btn-danger" data-link-reject="${r.id}">Rifiuta</button>
            </div>
          </div>`;
        }).join("")}
      </div>`
    : `<div class="empty">Nessuna richiesta in attesa</div>`;

  const historyHtml=history.length
    ? `<div class="table-wrap">
        <table class="table">
          <thead><tr><th>Utente</th><th>Calciatore</th><th>Esito</th><th>Richiesta</th><th>Motivo</th></tr></thead>
          <tbody>
            ${history.map(r=>{
              const player=pmap.get(r.player_id);
              const user=umap.get(r.profile_id);
              return `<tr>
                <td>${esc(user?.display_name||"")}<div class="muted">@${esc(user?.username||"")}</div></td>
                <td>${esc(player?`${player.last_name} ${player.first_name}`:"")}</td>
                <td><span class="badge ${r.status==="approved"?"green":r.status==="rejected"?"red":""}">${esc(r.status)}</span></td>
                <td>${fmtDateTime(r.requested_at)}</td>
                <td>${esc(r.review_reason||"—")}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>`
    : `<div class="empty">Nessuno storico disponibile</div>`;

  $("#admin-content").innerHTML=`
    <div class="page-title">
      <div>
        <h2>Associazioni account ↔ calciatore</h2>
        <p>L'utente resta fan finché la richiesta non viene approvata.</p>
      </div>
      ${pending.length?`<span class="badge">${pending.length} in attesa</span>`:""}
    </div>

    <div class="card">
      <h3>Da approvare</h3>
      ${pendingHtml}
    </div>

    <div style="height:14px"></div>

    <div class="card">
      <h3>Storico richieste</h3>
      ${historyHtml}
    </div>
  `;

  $$("[data-link-approve]").forEach(b=>b.onclick=async()=>{
    const req=requests.find(r=>r.id===b.dataset.linkApprove);
    const player=pmap.get(req?.player_id);
    const user=umap.get(req?.profile_id);

    if(!confirm(`Associare ${user?.display_name||"l'utente"} a ${player?`${player.first_name} ${player.last_name}`:"questo calciatore"}?`))return;

    try{
      await must(supabase.rpc("review_player_link_request",{
        p_request_id:b.dataset.linkApprove,
        p_action:"approve",
        p_reason:null
      }));
      toast("Associazione approvata","ok");
      adminPlayerLinks();
    }catch(e){toast(e.message,"error")}
  });

  $$("[data-link-reject]").forEach(b=>b.onclick=async()=>{
    const reason=prompt("Motivo del rifiuto (facoltativo):","");
    if(reason===null)return;

    try{
      await must(supabase.rpc("review_player_link_request",{
        p_request_id:b.dataset.linkReject,
        p_action:"reject",
        p_reason:reason||null
      }));
      toast("Richiesta rifiutata","ok");
      adminPlayerLinks();
    }catch(e){toast(e.message,"error")}
  });
}

        <table class="table perm-matrix">
          <thead>
            <tr>
              <th>Permesso</th>
              ${roles.map(r=>`<th>${esc(r.label)}</th>`).join("")}
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    `;

    $$("[data-perm]",content).forEach(c=>c.onchange=async()=>{
      try{
        await must(supabase.rpc("set_team_role_permission",{
          p_team_id:state.team.id,
          p_role_code:c.dataset.role,
          p_permission_key:c.dataset.perm,
          p_enabled:c.checked
        }));
        toast("Permesso del profilo aggiornato","ok");
      }catch(e){
        c.checked=!c.checked;
        toast(e.message,"error");
      }
    });

    return;
  }

  const sortedMembers=[...members].sort((a,b)=>{
    const pa=profiles.find(p=>p.id===a.profile_id)?.display_name||"";
    const pb=profiles.find(p=>p.id===b.profile_id)?.display_name||"";
    return pa.localeCompare(pb,"it");
  });

  const selectedMember=
    sortedMembers.find(m=>m.profile_id===selectedProfileId)
    || sortedMembers.find(m=>!m.is_owner)
    || sortedMembers[0]
    || null;

  if(!selectedMember){
    content.innerHTML=`<div class="empty">Nessun utente nella squadra</div>`;
    return;
  }

  const selectedProfile=profiles.find(p=>p.id===selectedMember.profile_id);

  const overview=await must(
    supabase.rpc("get_member_permission_overview",{
      p_team_id:state.team.id,
      p_profile_id:selectedMember.profile_id
    })
  );

  content.innerHTML=`
    <div class="card">
      <div class="field">
        <label>Utente</label>
        <select id="permission-user">
          ${sortedMembers.map(m=>{
            const pr=profiles.find(p=>p.id===m.profile_id);
            return `<option value="${m.profile_id}" ${m.profile_id===selectedMember.profile_id?"selected":""}>
              ${esc(pr?.display_name||"")} ${m.is_owner?"(Owner)":""}
            </option>`;
          }).join("")}
        </select>
      </div>

      <div class="section-note">
        <strong>${esc(selectedProfile?.display_name||"")}</strong>
        ${selectedMember.is_owner
          ? ` è Owner: dispone sempre di tutti i permessi e non può ricevere override.`
          : ` eredita normalmente i permessi dai propri ruoli attivi. Usa gli override solo per eccezioni specifiche.`
        }
      </div>
    </div>

    <div style="height:12px"></div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Permesso</th>
            <th>Da ruolo</th>
            <th>Override</th>
            <th>Effettivo</th>
          </tr>
        </thead>
        <tbody>
          ${overview.map(row=>`
            <tr>
              <td>
                <strong>${esc(row.label)}</strong>
                <div class="muted">${esc(row.permission_key)}</div>
              </td>
              <td>${row.role_granted?`<span class="badge green">consentito</span>`:`<span class="badge">no</span>`}</td>
              <td>
                <select
                  data-user-override="${row.permission_key}"
                  ${selectedMember.is_owner?"disabled":""}
                  style="min-width:130px"
                >
                  <option value="inherit" ${!row.override_effect?"selected":""}>Eredita</option>
                  <option value="allow" ${row.override_effect==="allow"?"selected":""}>Consenti</option>
                  <option value="deny" ${row.override_effect==="deny"?"selected":""}>Nega</option>
                </select>
              </td>
              <td>
                <span class="badge ${row.effective?"green":"red"}">${row.effective?"Sì":"No"}</span>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;

  $("#permission-user").onchange=e=>adminPermissions("users",e.target.value);

  $$("[data-user-override]",content).forEach(sel=>sel.onchange=async()=>{
    const previous=overview.find(x=>x.permission_key===sel.dataset.userOverride)?.override_effect||"inherit";

    try{
      await must(supabase.rpc("set_user_permission_override",{
        p_team_id:state.team.id,
        p_profile_id:selectedMember.profile_id,
        p_permission_key:sel.dataset.userOverride,
        p_effect:sel.value
      }));

      toast("Eccezione utente aggiornata","ok");
      adminPermissions("users",selectedMember.profile_id);

    }catch(e){
      sel.value=previous;
      toast(e.message,"error");
    }
  });
}

      <div style="height:10px"></div>
    `:""}

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Persona</th>
            <th>Ruolo</th>
            <th>Dal</th>
            <th>Al</th>
            <th>Stato</th>
            <th></th>

          ${assignments.map(a=>{
            const profile=pmap.get(mmap.get(a.team_member_id)?.profile_id);
            return `<tr>
              <td>${esc(profile?.display_name||"")}</td>
              <td>${esc(staffRoleLabel(a.role_code))}</td>

          }).join("")}
        </tbody>
      </table>

  `;

  $("#new-staff")?.addEventListener("click",()=>showModal("Nuovo incarico",`
    <form id="staff-form">
      <div class="field">
        <label>Utente</label>
        <select id="st-member">
          ${members.map(m=>`
            <option value="${m.id}">${esc(pmap.get(m.profile_id)?.display_name||"")}</option>
          `).join("")}
        </select>
      </div>

      <div class="field">
        <label>Ruolo</label>
        <select id="st-role">
          <option value="coach">Allenatore</option>
          <option value="assistant_coach">Vice allenatore</option>
          <option value="management">Dirigente</option>

      </div>

      end.value=role.value==="management"?"":state.season.end_date;

      try{

            season_id:state.season.id,

          p_action:"approve",
          p_reason:null

      toast(err.message,"error");

  $$("[data-staff-request-reject]").forEach(b=>b.onclick=async()=>{
    const reason=prompt("Motivo del rifiuto (facoltativo)","");

    try{
      await must(
        supabase.rpc("review_team_staff_access_request",{
          p_request_id:b.dataset.staffRequestReject,
          p_action:"reject",
          p_reason:reason||null
        })
      );

      toast("Richiesta rifiutata","ok");
      adminStaff();
    }catch(err){
      toast(err.message,"error");
    }
  });

  $$("[data-end-staff]").forEach(b=>b.onclick=async()=>{
    const d=prompt("Data fine incarico",today());
    if(!d)return;

    try{
      await must(
        supabase.from("staff_assignments")
          .update({actual_end_date:d,status:"terminated"})
          .eq("id",b.dataset.endStaff)
      );
      adminStaff();
    }catch(err){
      toast(err.message,"error");
    }
  });
}

        <div class="field"><label>Partita IVA</label><input id="org-vat" value="${esc(org.vat_number||"")}"></div>

  const primary=$("#org-primary");
  const secondary=$("#org-secondary");
  const accent=$("#org-accent");
  const logoPreview=$("#org-logo-preview");
  const proposal=$("#org-palette-proposal");
  const proposalSwatches=$("#org-palette-swatches");
  const proposalNote=$("#org-palette-note");
  const themePreview=$("#org-theme-preview");
  const codeInput=$("#org-code");

  const updatePreview=()=>{
    codeInput.value=codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);

    const p=primary.value.toUpperCase();
    const s=secondary.value.toUpperCase();
    const a=accent.value.toUpperCase();

    $("#org-primary-value").textContent=p;
    $("#org-secondary-value").textContent=s;
    $("#org-accent-value").textContent=a;
    $("#org-preview-code").textContent=codeInput.value||$("#org-name").value.slice(0,4).toUpperCase()||"SOC";

    applyPreviewPalette(themePreview,p,s,a);
  };

  const setPalette=palette=>{
    const finalPalette=derivePalette(palette);
    primary.value=finalPalette[0];
    secondary.value=finalPalette[1];
    accent.value=finalPalette[2];
    updatePreview();
  };

  [primary,secondary,accent,codeInput,$("#org-name")].forEach(el=>el.addEventListener("input",updatePreview));
  updatePreview();

  $("#org-logo-file").addEventListener("change",async e=>{
    const file=e.target.files?.[0];
    if(!file)return;

    try{
      if(!["image/png","image/jpeg","image/webp"].includes(file.type)){
        throw new Error("Formato non supportato: usa PNG, JPG o WebP");
      }
      if(file.size>5*1024*1024){
        throw new Error("Il logo non può superare 5 MB");
      }

      selectedLogoFile=file;
      logoRemoved=false;

      if(previewObjectUrl)URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl=URL.createObjectURL(file);
      logoPreview.innerHTML=`<img src="${previewObjectUrl}" alt="Nuovo logo società">`;

      proposal.classList.add("show");
      proposalNote.textContent="Analisi dei colori in corso…";
      proposalSwatches.innerHTML="";
      $("#org-apply-palette").disabled=true;

      detectedPalette=await extractLogoPalette(file);
      proposalSwatches.innerHTML=detectedPalette
        .map(c=>`<span class="palette-swatch" title="${c}" style="background:${c}"></span>`)
        .join("");

      }else{
        proposalNote.textContent="Nuova palette proposta. Premi il pulsante solo se vuoi sostituire i colori attuali.";
      }

      $("#org-apply-palette").disabled=false;
    }catch(err){
      selectedLogoFile=null;
      detectedPalette=null;
      if(previewObjectUrl){
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl=null;
      }
      logoPreview.innerHTML=org.logo_url
        ? `<img src="${esc(org.logo_url)}" alt="Logo ${esc(org.name)}">`
        : organizationMark(org,"SOC");
      proposal.classList.remove("show");
      e.target.value="";
      toast(err.message,"error");
    }
  });

  $("#org-apply-palette").onclick=()=>{
    if(!detectedPalette)return;
    setPalette(detectedPalette);
    proposalNote.textContent="Palette applicata. Puoi ancora modificarla manualmente.";
  };

  $("#org-logo-remove")?.addEventListener("click",()=>{
    selectedLogoFile=null;
    detectedPalette=null;
    logoRemoved=true;

    if(previewObjectUrl){
      URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl=null;
    }

    logoPreview.textContent=(codeInput.value||"SOC").slice(0,4);
    proposal.classList.remove("show");
    $("#org-logo-file").value="";
  });

  $("#organization-settings").onsubmit=async e=>{
    e.preventDefault();

    try{
      const displayCode=codeInput.value.trim().toUpperCase();
      if(displayCode && (displayCode.length<1 || displayCode.length>4)){
        throw new Error("La sigla visuale deve avere da 1 a 4 caratteri");
      }

      let logoUrl=org.logo_url||null;
      const logoPath=`${org.id}/logo.png`;

      if(selectedLogoFile){
        const logoBlob=await normalizeLogoToPng(selectedLogoFile);

        const {error:uploadError}=await supabase.storage
          .from("organization-assets")
          .upload(logoPath,logoBlob,{
            contentType:"image/png",
            cacheControl:"3600",
            upsert:true
          });

        if(uploadError)throw uploadError;

        const {data:publicData}=supabase.storage
          .from("organization-assets")
          .getPublicUrl(logoPath);

        logoUrl=`${publicData.publicUrl}?v=${Date.now()}`;
      }else if(logoRemoved){
        const {error:removeError}=await supabase.storage
          .from("organization-assets")
          .remove([logoPath]);

        if(removeError)console.warn("Rimozione logo società:",removeError);
        logoUrl=null;
      }

      if(canTeamSettings){
        const teamSlug=slugify($("#org-team-slug").value);
        if(!teamSlug)throw new Error("Team slug non valido");

        await must(
          supabase.from("teams")
            .update({
              name:$("#org-team-name").value.trim(),
              short_name:$("#org-team-short").value.trim()||null,
              slug:teamSlug,
              default_venue_id:$("#org-team-default-venue").value||null,
              is_discoverable:$("#org-team-discoverable").checked,
              allow_fan_follow:$("#org-team-follow").checked,
              inherit_organization_branding:true
            })
            .eq("id",state.team.id)
        );
      }

      if(canOrgSettings){
        await must(
          supabase.from("organizations")
            .update({
            name:$("#org-name").value.trim(),
            display_code:displayCode||null,
            logo_url:logoUrl,
            primary_color:primary.value.toUpperCase(),
            secondary_color:secondary.value.toUpperCase(),
            accent_color:accent.value.toUpperCase(),
            address_line:$("#org-address").value.trim()||null,
            city:$("#org-city").value.trim()||null,
            province:$("#org-province").value.trim().toUpperCase()||null,
            postal_code:$("#org-postal").value.trim()||null,
            country:$("#org-country").value.trim()||"Italia",
            email:$("#org-email").value.trim()||null,
            phone:$("#org-phone").value.trim()||null,
            website_url:$("#org-website").value.trim()||null,
            tax_code:$("#org-tax-code").value.trim().toUpperCase()||null,
            vat_number:$("#org-vat").value.trim().toUpperCase()||null
            })
            .eq("id",org.id)
        );
      }

      const updated=await must(
        supabase.from("organizations")
          .select("*")
          .eq("id",org.id)
          .single()
      );

      state.organization=updated;

      const freshTeam=await must(
        supabase.from("teams")
          .select("*")
          .eq("id",state.team.id)
          .single()
      );

      state.team={...freshTeam,membership:state.membership,organization:updated};
      state.teams=state.teams.map(t=>
        t.id===freshTeam.id
          ? {...freshTeam,membership:t.membership,organization:updated}
          : (t.organization_id===updated.id ? {...t,organization:updated} : t)
      );

      applyTeamBranding(state.team,updated);

      if(previewObjectUrl)URL.revokeObjectURL(previewObjectUrl);

      toast("Società aggiornata","ok");
      adminOrganizationSettings();

    }catch(err){
      console.error(err);
      toast(err.message,"error");
    }
  };
}

    [["squadre del cuore","tifoser"],"❤️"],
    [["quote scadute"],"⚠️"],
    [["quote"],"💳"],
    [["multe"],"💸"],
    [["incassato"],"💰"],
    [["utenti"],"👥"],
    [["squadre"],"⚽"],
    [["richieste"],"📥"],
    [["abilitati"],"✅"],
    [["non abilitati"],"❌"],
    [["scadenza"],"⏳"]
  ];

  for(const [words,emoji] of rules){
    if(words.some(w=>t.includes(w)))return emoji;
  }
  return "⚽";
}

function uiEmptyEmoji(text=""){
  const t=String(text).toLowerCase();
  if(t.includes("infortun"))return "🩹";
  if(t.includes("squalif"))return "🟥";
  if(t.includes("multa")||t.includes("quota"))return "💰";
  if(t.includes("partit"))return "⚽";
  if(t.includes("allenament"))return "🏃";
  if(t.includes("calciator")||t.includes("rosa"))return "👥";
  if(t.includes("evento"))return "📅";
  return "⚽";
}

function enhanceResponsiveTables(root=document){
  if(!root?.querySelectorAll)return;

  root.querySelectorAll(".table").forEach(table=>{
    if(
      table.classList.contains("roster-table")
      || table.closest(".import-preview-wrap")
      || table.classList.contains("month-calendar")
      || table.dataset.responsivePrepared
    )return;

    const headers=[...table.querySelectorAll("thead th")].map(th=>
      th.textContent.replace(/[▲▼]/g,"").trim()
    );

    if(headers.length<3)return;

    table.classList.add("responsive-stack-table");
    table.querySelectorAll("tbody tr").forEach(tr=>{
      [...tr.children].forEach((cell,index)=>{
        if(cell.tagName!=="TD")return;
        cell.dataset.mobileLabel=headers[index]||"";
      });
    });

    table.dataset.responsivePrepared="1";
  });
}

function enhanceViewportRecordContainers(root=document){
  const shell=document.querySelector(".shell");
  if(!shell)return;

  const content=shell.querySelector(":scope > .main > .content");
  if(!content)return;

  const directTable=[...content.children].find(el=>el.classList?.contains("table-wrap"));
  if(directTable && !shell.classList.contains("roster-page") && !shell.classList.contains("calendar-page")){
    shell.classList.add("table-focus-page");
    directTable.classList.add("record-scroll-container");
  }
}

function decorateManagerialUI(root=document){
  if(!root?.querySelectorAll)return;
  enhanceResponsiveTables(root);
  enhanceViewportRecordContainers(root);

  root.querySelectorAll(".page-title h1").forEach(h=>{
    if(h.dataset.uiDecorated)return;
    const emoji=uiSectionEmoji(h.textContent);
    if(emoji){
      const span=document.createElement("span");
      span.className="ui-title-icon";
      span.textContent=emoji;
      h.prepend(span);
    }
    h.dataset.uiDecorated="1";
  });

  root.querySelectorAll(".card .stat-label").forEach(label=>{
    const card=label.closest(".card");
    if(!card||card.dataset.uiKpiDecorated)return;
    card.classList.add("manager-kpi-card");
    card.dataset.uiIcon=uiStatEmoji(label.textContent);
    card.dataset.uiKpiDecorated="1";
  });

  root.querySelectorAll(".card h2,.card h3").forEach(h=>{
    if(h.dataset.uiDecorated)return;
    const emoji=uiSectionEmoji(h.textContent);
    if(emoji){
      const span=document.createElement("span");
      span.className="ui-heading-icon";
      span.textContent=emoji;
      h.prepend(span);
    }
    h.dataset.uiDecorated="1";
  });

  root.querySelectorAll(".empty").forEach(el=>{
    if(el.dataset.uiEmptyDecorated)return;
    el.classList.add("manager-empty");
    el.dataset.uiIcon=uiEmptyEmoji(el.textContent);
    el.dataset.uiEmptyDecorated="1";
  });

  root.querySelectorAll(".list-item").forEach(el=>{
    el.classList.add("manager-record");
  });
}

let managerialUiObserver=null;
let managerialUiQueued=false;

function scheduleManagerialUIDecoration(){
  if(managerialUiQueued)return;
  managerialUiQueued=true;

  requestAnimationFrame(()=>{
    managerialUiQueued=false;
    decorateManagerialUI(document);
  });
}

function startManagerialUIDecorator(){
  decorateManagerialUI(document);

  if(managerialUiObserver)return;

  managerialUiObserver=new MutationObserver(()=>{
    scheduleManagerialUIDecoration();
  });

  managerialUiObserver.observe(document.body,{
    childList:true,
    subtree:true
  });
}

  if(event==="SIGNED_OUT"){resetTeamBranding();renderLogin()}

boot();
