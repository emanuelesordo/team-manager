      </div>

      <div class="field" style="margin-top:14px"><label>Note</label><textarea id="comp-notes">${esc(competition?.notes||"")}</textarea></div>
      <button class="btn btn-primary">Salva competizione</button>
    </form>
  `,root=>{
    root.closest(".modal").style.width="min(850px,100%)";

    const type=$("#comp-type",root);
    const formatBox=$("#comp-format-box",root);
    const format=$("#comp-format",root);
    const opponentsBox=$("#competition-opponents-box",root);
    const seasonSelect=$("#comp-season",root);
    const extraEnabled=$("#comp-extra-enabled",root);
    const extraBox=$("#comp-extra-box",root);

    const refreshType=()=>{
      const t=type.value;
      opponentsBox.classList.toggle("hidden",t==="friendly");

      if(t==="league"){
        formatBox.classList.remove("hidden");
        format.innerHTML=`
          <option value="league_home_away" ${competition?.competition_format==="league_home_away"?"selected":""}>Girone andata/ritorno</option>
          <option value="league_single_round" ${competition?.competition_format==="league_single_round"?"selected":""}>Girone solo andata</option>
        `;
      }else if(t==="cup"){
        formatBox.classList.remove("hidden");
        format.innerHTML=`
          <option value="cup_groups_knockout" ${competition?.competition_format==="cup_groups_knockout"?"selected":""}>Gironi + eliminazione diretta</option>
          <option value="cup_knockout" ${competition?.competition_format==="cup_knockout"?"selected":""}>Solo eliminazione diretta</option>
        `;
      }else{
        formatBox.classList.add("hidden");
        format.innerHTML=`<option value=""></option>`;
      }
    };

    const refreshExtra=()=>extraBox.classList.toggle("hidden",!extraEnabled.checked);

    seasonSelect.onchange=()=>{
      const selectedSeason=state.seasons.find(x=>x.id===seasonSelect.value);
      if(!selectedSeason)return;
      $("#comp-start",root).value=selectedSeason.start_date;
      $("#comp-end",root).value=selectedSeason.end_date;
    };

    type.onchange=refreshType;
    extraEnabled.onchange=refreshExtra;
    refreshType();
    refreshExtra();

    $("#competition-form",root).onsubmit=async e=>{
      e.preventDefault();
      try{
        const start=$("#comp-start",root).value;
        const end=$("#comp-end",root).value;
        if(end<start)throw new Error("La data di fine deve essere successiva all'inizio");

        const row={
          team_id:state.team.id,
          season_id:seasonSelect.value,
          name:$("#comp-name",root).value.trim(),
          competition_type:type.value,
          competition_format:["league","cup"].includes(type.value)?format.value:null,
          start_date:start,
          end_date:end,
          active:$("#comp-active",root).checked,
          default_start_time:$("#comp-default-time",root).value,
          regular_period_count:Number($("#comp-reg-count",root).value),
          regular_period_minutes:Number($("#comp-reg-min",root).value),
          extra_time_enabled:extraEnabled.checked,
          extra_period_count:Number($("#comp-extra-count",root).value)||2,
          extra_period_minutes:Number($("#comp-extra-min",root).value)||15,
          notes:$("#comp-notes",root).value.trim()||null,
          created_by:competition?.created_by||state.profile.id
        };

        let saved;
        if(competition){
          saved=await must(supabase.from("competitions").update(row).eq("id",competition.id).select("*").single());
        }else{
          saved=await must(supabase.from("competitions").insert(row).select("*").single());
        }

        await must(supabase.from("competition_opponents").delete().eq("competition_id",saved.id));

        if(type.value!=="friendly"){
          const selected=$$("[data-comp-opponent]",root)
            .filter(x=>x.checked)
            .map(x=>({competition_id:saved.id,opponent_id:x.dataset.compOpponent}));

          if(selected.length)await must(supabase.from("competition_opponents").insert(selected));
        }

        closeModal();
        toast("Competizione salvata","ok");
        pageCompetitions();
      }catch(err){
        toast(err.message,"error");
      }
    };
  });
}

async function openMatchSetup(){
  try{
    const setting=await must(
      supabase.from("match_settings")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
        .maybeSingle()
    );

    const total=Number(setting?.default_meeting_offset_minutes??90);
    const hours=Math.floor(total/60);
    const minutes=total%60;

    showModal("Setup partite",`
      <form id="match-setup-form">
        <div class="section-note">
          Imposta quante <strong>ore e minuti prima del calcio d'inizio</strong> è previsto il ritrovo al campo. Questo valore viene proposto automaticamente per ogni nuova partita e può poi essere corretto nelle convocazioni della singola gara.
        </div>
        <div style="height:12px"></div>
        <div class="form-grid">
          <div class="field"><label>Ore prima</label><input id="ms-hours" type="number" min="0" max="12" value="${hours}" required></div>
          <div class="field"><label>Minuti aggiuntivi</label><input id="ms-minutes" type="number" min="0" max="59" value="${minutes}" required></div>
        </div>
        <button class="btn btn-primary">Salva setup</button>
      </form>
    `,root=>{
      $("#match-setup-form",root).onsubmit=async e=>{
        e.preventDefault();
        try{
          const h=Math.max(0,Number($("#ms-hours",root).value)||0);
          const m=Math.max(0,Math.min(59,Number($("#ms-minutes",root).value)||0));
          const offset=h*60+m;

          await must(
            supabase.from("match_settings")
              .upsert({
                team_id:state.team.id,
                season_id:state.season.id,
                default_meeting_offset_minutes:offset,
                updated_by:state.profile.id
              },{onConflict:"team_id,season_id"})
          );

          closeModal();
          toast("Setup partite salvato","ok");
        }catch(err){
          toast(err.message,"error");
        }
      };
    });
  }catch(err){
    toast(err.message,"error");
  }
}

async function openMatchConfigurator(afterSave=null){
  try{
    const [venues,opponents,competitions,links,matchSetting]=await Promise.all([
      must(
        supabase.from("venues")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("is_opponent_venue",false)
          .order("name")
      ),
      must(
        supabase.from("opponent_teams")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("active",true)
          .order("name")
      ),
      must(
        supabase.from("competitions")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("season_id",state.season.id)
          .eq("active",true)
          .order("start_date")
      ),
      must(supabase.from("competition_opponents").select("*")),
      must(
        supabase.from("match_settings")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("season_id",state.season.id)
          .maybeSingle()
      )
    ]);

    if(!competitions.length){
      toast("Prima crea almeno una competizione","error");
      return pageCompetitions();
    }
    if(!opponents.length){
      toast("Prima censisci almeno una squadra avversaria","error");
      return pageOpponents();
    }

    const offset=Number(matchSetting?.default_meeting_offset_minutes??90);
    let mode="home";
    let timeTouched=false;
    let locationTouched=false;

    const firstCompetition=competitions[0];
    const firstTime=String(firstCompetition.default_start_time||"15:00").slice(0,5);

    showModal("Configura partita",`
      <form id="match-config-form" class="match-configurator">
        <div class="field">
          <label>Competizione</label>
          <select id="mc-competition">
            ${competitions.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(competitionTypeLabel(c.competition_type))}</option>`).join("")}
          </select>
        </div>

        <div class="home-away-selector">
          <button type="button" data-match-mode="home" class="active">🏠 Casa</button>
          <button type="button" data-match-mode="away">✈️ Trasferta</button>
          <button type="button" data-match-mode="neutral">◇ Neutro</button>
        </div>

        <div class="match-versus">
          <div class="match-team-slot" id="mc-home-slot"></div>
          <div class="match-vs">VS</div>
          <div class="match-team-slot" id="mc-away-slot"></div>
        </div>

        <div class="form-grid">
          <div class="field"><label>Data</label><input id="mc-date" type="date" value="${today()}" required></div>
          <div class="field"><label>Ora inizio</label><input id="mc-time" type="time" value="${firstTime}" required></div>
        </div>

        <div id="mc-friendly-periods" class="competition-rule-box hidden" style="margin-bottom:10px">
          <strong>Formato di questa amichevole</strong>
          <div class="form-grid" style="margin-top:7px">
            <div class="field">
              <label>Numero tempi</label>
              <input id="mc-friendly-count" type="number" min="1" max="8" value="${firstCompetition.regular_period_count||2}">
            </div>
            <div class="field">
              <label>Minuti per tempo</label>
              <input id="mc-friendly-minutes" type="number" min="1" max="90" value="${firstCompetition.regular_period_minutes||45}">
            </div>
          </div>
        </div>

        <div class="match-location-mode">
          <div class="field" id="mc-own-venue-box">
            <label>Campo di gioco</label>
            <select id="mc-venue"></select>
          </div>

          <div class="field hidden" id="mc-free-location-box">
            <label id="mc-free-location-label">Campo di gioco</label>
            <input id="mc-free-location" placeholder="Nome campo · indirizzo">
          </div>

          <div class="muted" id="mc-venue-note"></div>
        </div>

        <div class="field"><label>Giornata / turno</label><input id="mc-round" placeholder="es. 5ª giornata, semifinale…"></div>

        <div class="meeting-preview">
          <strong>Ritrovo previsto:</strong>
          <span id="mc-meeting-preview">—</span>
          <div class="muted">Setup partite: ${Math.floor(offset/60)}h ${offset%60}m prima del calcio d'inizio.</div>
        </div>

        <div class="field"><label>Note</label><textarea id="mc-notes"></textarea></div>
        <button class="btn btn-primary">Crea partita</button>
      </form>
    `,root=>{
      root.closest(".modal").style.width="min(940px,100%)";

      const compSel=$("#mc-competition",root);
      const dateInput=$("#mc-date",root);
      const timeInput=$("#mc-time",root);
      const venueSel=$("#mc-venue",root);
      const ownVenueBox=$("#mc-own-venue-box",root);
      const freeBox=$("#mc-free-location-box",root);
      const freeLocation=$("#mc-free-location",root);
      const freeLabel=$("#mc-free-location-label",root);
      const venueNote=$("#mc-venue-note",root);

      const currentCompetition=()=>competitions.find(c=>c.id===compSel.value);

      const allowedOpponents=()=>{
        const comp=currentCompetition();
        if(!comp)return [];
        if(comp.competition_type==="friendly")return opponents;

        const ids=new Set(
          links.filter(x=>x.competition_id===comp.id).map(x=>x.opponent_id)
        );
        return opponents.filter(o=>ids.has(o.id));
      };

      let selectedOpponentId=allowedOpponents()[0]?.id||null;
      const selectedOpponent=()=>opponents.find(o=>o.id===selectedOpponentId)||null;

      const teamCard=(isOwn,label)=>{
        if(isOwn){
          return `<div class="match-side-label">${label}</div>${ownLogoHtml()}<strong>${esc(ownTeamDisplayName())}</strong>`;
        }

        const list=allowedOpponents();
        const opp=selectedOpponent();

        return `
          <div class="match-side-label">${label}</div>
          <div id="mc-opponent-logo">${opponentLogoHtml(opp)}</div>
          <strong id="mc-opponent-name">${esc(opponentDisplayName(opp))}</strong>
          <select id="mc-opponent-select">
            ${list.map(o=>`<option value="${o.id}" ${o.id===selectedOpponentId?"selected":""}>${esc(o.name)}</option>`).join("")}
          </select>
        `;
      };

      const validVenues=()=>{
        const d=dateInput.value||today();
        return venues.filter(v=>venueIsValid(v,d));
      };

      const refreshOwnVenueOptions=()=>{
        const current=venueSel.value;
        const valid=validVenues();

        venueSel.innerHTML=`<option value="">Nessun campo / da definire</option>`+
          valid.map(v=>`<option value="${v.id}">${esc(v.name)}${venueAddress(v)?` · ${esc(venueAddress(v))}`:""}</option>`).join("");

        if(valid.some(v=>v.id===current)){
          venueSel.value=current;
        }else if(state.team.default_venue_id&&valid.some(v=>v.id===state.team.default_venue_id)){
          venueSel.value=state.team.default_venue_id;
        }
      };

      const applyLocationDefault=(force=false)=>{
        refreshOwnVenueOptions();

        if(mode==="home"){
          ownVenueBox.classList.remove("hidden");
          freeBox.classList.add("hidden");
          venueNote.textContent="Viene proposto il campo predefinito della tua squadra; puoi sceglierne un altro per questa partita.";
          return;
        }

        ownVenueBox.classList.add("hidden");
        freeBox.classList.remove("hidden");

        if(mode==="away"){
          const def=opponentVenueLocation(selectedOpponent());

          if(force||!locationTouched){
            freeLocation.value=def;
          }

          freeLabel.textContent="Campo della squadra di casa";
          venueNote.textContent=def
            ? "Richiamato dalla scheda dell'avversaria. Puoi modificarlo liberamente solo per questa partita."
            : "L'avversaria non ha ancora un campo di casa configurato: inseriscilo per questa partita.";
          return;
        }

        if(force||!locationTouched)freeLocation.value="";
        freeLabel.textContent="Campo neutro";
        venueNote.textContent="Campo neutro: nessuna struttura viene proposta automaticamente.";
      };

      const refreshMeeting=()=>{
        const start=new Date(`${dateInput.value}T${timeInput.value}`);
        const meeting=meetingFromStart(start,offset);

        $("#mc-meeting-preview",root).textContent=meeting
          ? new Intl.DateTimeFormat("it-IT",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}).format(meeting)
          : "—";
      };

      const renderSides=()=>{
        const left=$("#mc-home-slot",root);
        const right=$("#mc-away-slot",root);

        if(mode==="away"){
          left.innerHTML=teamCard(false,"Casa");
          right.innerHTML=teamCard(true,"Trasferta");
        }else{
          left.innerHTML=teamCard(true,mode==="neutral"?"Squadra":"Casa");
          right.innerHTML=teamCard(false,mode==="neutral"?"Avversaria":"Trasferta");
        }

        $("#mc-opponent-select",root)?.addEventListener("change",e=>{
          selectedOpponentId=e.target.value;
          const opp=selectedOpponent();
          $("#mc-opponent-logo",root).innerHTML=opponentLogoHtml(opp);
          $("#mc-opponent-name",root).textContent=opponentDisplayName(opp);
          locationTouched=false;
          applyLocationDefault(true);
        });
      };

      const refreshCompetition=()=>{
        const list=allowedOpponents();

        selectedOpponentId=list.some(o=>o.id===selectedOpponentId)
          ? selectedOpponentId
          : (list[0]?.id||null);

        if(!timeTouched){
          timeInput.value=String(currentCompetition()?.default_start_time||"15:00").slice(0,5);
        }

        const comp=currentCompetition();
        const friendlyBox=$("#mc-friendly-periods",root);
        friendlyBox.classList.toggle("hidden",comp?.competition_type!=="friendly");

        if(comp?.competition_type==="friendly"){
          $("#mc-friendly-count",root).value=comp.regular_period_count||2;
          $("#mc-friendly-minutes",root).value=comp.regular_period_minutes||45;
        }

        renderSides();
        locationTouched=false;
        applyLocationDefault(true);
        refreshMeeting();
      };

      $$("[data-match-mode]",root).forEach(b=>b.onclick=()=>{
        mode=b.dataset.matchMode;

        $$("[data-match-mode]",root).forEach(x=>{
          x.classList.toggle("active",x.dataset.matchMode===mode);
        });

        renderSides();
        locationTouched=false;
        applyLocationDefault(true);
      });

      compSel.onchange=refreshCompetition;

      dateInput.onchange=()=>{
        locationTouched=false;
        applyLocationDefault(true);
        refreshMeeting();
      };

      timeInput.oninput=()=>{
        timeTouched=true;
        refreshMeeting();
      };

      freeLocation.oninput=()=>locationTouched=true;

      refreshCompetition();

      $("#match-config-form",root).onsubmit=async e=>{
        e.preventDefault();

        try{
          const comp=currentCompetition();
          const opp=selectedOpponent();

          if(!comp)throw new Error("Seleziona la competizione");
          if(!opp)throw new Error("Seleziona l'avversaria");

          const allowed=allowedOpponents();
          if(!allowed.some(o=>o.id===opp.id)){
            throw new Error("L'avversaria non è prevista per questa competizione");
          }

          const startDate=new Date(`${dateInput.value}T${timeInput.value}`);
          if(Number.isNaN(startDate.getTime()))throw new Error("Data/ora partita non valida");

          const meeting=meetingFromStart(startDate,offset);

          let venue=null;
          let location=null;

          if(mode==="home"){
            venue=venues.find(v=>v.id===venueSel.value)||null;
            location=venue
              ? `${venue.name}${venueAddress(venue)?` · ${venueAddress(venue)}`:""}`
              : null;
          }else{
            location=freeLocation.value.trim()||null;
          }

          const own=ownTeamDisplayName();
          const other=opponentDisplayName(opp);
          const home=mode==="away"?other:own;
          const away=mode==="away"?own:other;
          const title=`${comp.name} · ${home} - ${away}`;

          const ev=await must(
            supabase.from("events")
              .insert({
                team_id:state.team.id,
                season_id:state.season.id,
                event_type:"match",
                title,
                start_at:startDate.toISOString(),
                end_at:null,
                venue_id:venue?.id||null,
                location,
                notes:$("#mc-notes",root).value.trim()||null,
                created_by:state.profile.id
              })
              .select("*")
              .single()
          );

          await must(
            supabase.from("matches")
              .insert({
                team_id:state.team.id,
                season_id:state.season.id,
                event_id:ev.id,
                competition_id:comp.id,
                opponent_id:opp.id,
                opponent_name:opp.name,
                home_away:mode,
                round_label:$("#mc-round",root).value.trim()||null,
                meeting_at:meeting?.toISOString()||null,
                regulation_period_count:comp.competition_type==="friendly"
                  ? Number($("#mc-friendly-count",root).value)||2
                  : (comp.regular_period_count||2),
                regulation_period_minutes:comp.competition_type==="friendly"
                  ? Number($("#mc-friendly-minutes",root).value)||45
                  : (comp.regular_period_minutes||45),
                extra_period_count:comp.competition_type==="friendly"
                  ? 0
                  : (comp.extra_time_enabled?(comp.extra_period_count||2):0),
                extra_period_minutes:comp.competition_type==="friendly"
                  ? 0
                  : (comp.extra_time_enabled?(comp.extra_period_minutes||15):0),
                created_by:state.profile.id
              })
          );

          closeModal();
          toast("Partita creata","ok");
          if(afterSave)await afterSave();
          else await pageMatches();

        }catch(err){
          toast(err.message,"error");
        }
      };
    });

  }catch(err){
    toast(err.message,"error");
  }
}

async function openNewEvent(defaultType=null,afterSave=null){
  if(defaultType==="match")return openMatchConfigurator(afterSave);
  try{
    const [
      venues,
      opponents,
      competitions,
      competitionLinks,
      trainingSetting
    ]=await Promise.all([
      must(
        supabase.from("venues")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("is_opponent_venue",false)
          .order("name")
      ),
      (can("matches.manage")||can("competitions.view"))
        ? must(supabase.from("opponent_teams").select("*").eq("team_id",state.team.id).eq("active",true).order("name"))
        : Promise.resolve([]),
      (can("matches.manage")||can("competitions.view"))
        ? must(
            supabase.from("competitions")
              .select("*")
              .eq("team_id",state.team.id)
              .eq("season_id",state.season.id)
              .eq("active",true)
              .order("start_date")
          )
        : Promise.resolve([]),
      (can("matches.manage")||can("competitions.view"))
        ? must(supabase.from("competition_opponents").select("*"))
        : Promise.resolve([]),
      (can("trainings.view")||can("trainings.manage")||can("trainings.setup"))
        ? must(
            supabase.from("training_settings")
              .select("*")
              .eq("team_id",state.team.id)
              .eq("season_id",state.season.id)
              .maybeSingle()
          )

    const initialType=defaultType
      || (can("trainings.manage")?"training":can("matches.manage")?"match":"meeting");
    const trainingStart=String(trainingSetting?.default_start_time||"20:30").slice(0,5);
    const trainingEnd=String(trainingSetting?.default_end_time||"22:00").slice(0,5);

    showModal(defaultType==="training"?"Nuovo allenamento":defaultType==="match"?"Nuova partita":"Nuovo evento",`

            ${can("trainings.manage")?`<option value="training" ${initialType==="training"?"selected":""}>Allenamento</option>`:""}

            <option value="meeting" ${initialType==="meeting"?"selected":""}>Riunione</option>

        </div>

        <div class="field">
          <label>Titolo</label>
          <input id="ev-title" required>
          <div class="muted" id="ev-title-note" style="font-size:.72rem;margin-top:5px"></div>
        </div>

        <div class="form-grid">
          <div class="field"><label>Inizio</label><input id="ev-start" type="datetime-local" required></div>
          <div class="field"><label>Fine</label><input id="ev-end" type="datetime-local"></div>
        </div>

        <div class="field">
          <label>Campo</label>
          <select id="ev-venue"><option value="">Nessun campo censito / altro luogo</option></select>
          <div class="muted" style="font-size:.72rem;margin-top:5px">Sono proposti solo i campi validi alla data dell'evento.</div>
        </div>

        <div class="field"><label>Luogo libero / integrazione</label><input id="ev-location" placeholder="Facoltativo"></div>
        <div class="field"><label>Note</label><textarea id="ev-notes"></textarea></div>

        <div id="match-extra" class="hidden">
          <h3>Dati partita</h3>

          <div class="field">
            <label>Competizione</label>
            <select id="ev-competition">
              <option value="">Seleziona competizione…</option>
            </select>
          </div>

          <div class="field">
            <label>Avversaria</label>
            <select id="ev-opponent-id">
              <option value="">Seleziona avversaria…</option>
            </select>
          </div>

          <div class="form-grid">
            <div class="field">
              <label>Casa/trasferta</label>
              <select id="ev-ha">
                <option value="home">Casa</option>
                <option value="away">Trasferta</option>
                <option value="neutral">Campo neutro</option>
              </select>
            </div>
            <div class="field"><label>Giornata/turno</label><input id="ev-round"></div>
          </div>
        </div>

        <button class="btn btn-primary">Salva</button>
      </form>
    `,root=>{
      const type=$("#ev-type",root);
      const title=$("#ev-title",root);
      const titleNote=$("#ev-title-note",root);
      const start=$("#ev-start",root);
      const end=$("#ev-end",root);
      const venueSelect=$("#ev-venue",root);
      const competitionSelect=$("#ev-competition",root);
      const opponentSelect=$("#ev-opponent-id",root);
      const ha=$("#ev-ha",root);

      let trainingDefaultsApplied=false;

      const dateKey=()=>start.value?start.value.slice(0,10):today();

      const validCompetitions=()=>{
        const d=dateKey();
        return competitions.filter(c=>
          (!c.start_date||c.start_date<=d)
          && (!c.end_date||c.end_date>=d)
        );
      };

      const refreshVenues=()=>{
        const d=dateKey();
        const current=venueSelect.value;
        const valid=venues.filter(v=>venueIsValid(v,d));

        venueSelect.innerHTML=`<option value="">Nessun campo censito / altro luogo</option>`+
          valid.map(v=>`<option value="${v.id}">${esc(v.name)}${venueAddress(v)?` · ${esc(venueAddress(v))}`:""}</option>`).join("");

        if(valid.some(v=>v.id===current)){
          venueSelect.value=current;
        }else if(type.value==="training" && trainingSetting?.default_venue_id && valid.some(v=>v.id===trainingSetting.default_venue_id)){
          venueSelect.value=trainingSetting.default_venue_id;
        }
      };

      const refreshCompetitions=()=>{
        const current=competitionSelect.value;
        const list=validCompetitions();

        competitionSelect.innerHTML=`<option value="">Seleziona competizione…</option>`+
          list.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(competitionTypeLabel(c.competition_type))}</option>`).join("");

        if(list.some(c=>c.id===current))competitionSelect.value=current;
      };

      const allowedOpponents=()=>{
        const c=competitions.find(x=>x.id===competitionSelect.value);
        if(!c)return [];

        if(c.competition_type==="friendly"){
          return opponents;
        }

        const ids=new Set(
          competitionLinks
            .filter(x=>x.competition_id===c.id)
            .map(x=>x.opponent_id)
        );

        return opponents.filter(o=>ids.has(o.id));
      };

      const refreshOpponents=()=>{
        const current=opponentSelect.value;
        const list=allowedOpponents();

        opponentSelect.innerHTML=`<option value="">Seleziona avversaria…</option>`+
          list.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("");

        if(list.some(o=>o.id===current))opponentSelect.value=current;
        updateMatchTitle();
      };

      const applyOpponentDefaultVenue=()=>{
        if(ha.value!=="away")return;
        const opp=opponents.find(o=>o.id===opponentSelect.value);
        if(opp?.default_venue_id && [...venueSelect.options].some(x=>x.value===opp.default_venue_id)){
          venueSelect.value=opp.default_venue_id;
        }
      };

      const updateMatchTitle=()=>{
        if(type.value!=="match")return;
        const comp=competitions.find(c=>c.id===competitionSelect.value);
        const opp=opponents.find(o=>o.id===opponentSelect.value);
        const our=state.team.short_name||state.team.name;
        const other=opp?.short_name||opp?.name||"Avversaria";

        const home=ha.value==="away"?other:our;
        const away=ha.value==="away"?our:other;
        title.value=comp?`${comp.name} · ${home} - ${away}`:`${home} - ${away}`;
      };

      const applyTrainingDefaults=()=>{
        if(type.value!=="training")return;

        title.value="Allenamento";
        title.readOnly=true;
        titleNote.textContent="Per gli allenamenti il titolo è sempre “Allenamento”.";

        if(!trainingDefaultsApplied || !start.value){
          start.value=isoLocalInput(today(),trainingStart);
          end.value=isoLocalInput(today(),trainingEnd);
          trainingDefaultsApplied=true;
        }
        refreshVenues();
      };

      const refreshType=()=>{
        const isTraining=type.value==="training";
        const isMatch=type.value==="match";

        $("#match-extra",root).classList.toggle("hidden",!isMatch);

        if(isTraining){
          applyTrainingDefaults();
        }else if(isMatch){
          title.readOnly=true;
          titleNote.textContent="Il titolo viene generato automaticamente da competizione e squadre.";
          refreshCompetitions();
          refreshOpponents();
          updateMatchTitle();
        }else{
          title.readOnly=false;
          titleNote.textContent="";
          if(title.value==="Allenamento" || title.value.includes(" · "))title.value="";
        }
      };

      start.onchange=()=>{
        const chosenDay=start.value?start.value.slice(0,10):today();
        refreshVenues();
        refreshCompetitions();
        refreshOpponents();

        if(type.value==="training" && trainingSetting){
          start.value=isoLocalInput(chosenDay,trainingStart);
          end.value=isoLocalInput(chosenDay,trainingEnd);
        }

        applyOpponentDefaultVenue();
      };

      competitionSelect.onchange=()=>{
        refreshOpponents();
        applyOpponentDefaultVenue();
        updateMatchTitle();
      };

      opponentSelect.onchange=()=>{
        applyOpponentDefaultVenue();
        updateMatchTitle();
      };

      ha.onchange=()=>{
        applyOpponentDefaultVenue();
        updateMatchTitle();
      };

      if(!defaultType)type.onchange=refreshType;

      refreshVenues();
      refreshCompetitions();
      refreshType();

      $("#event-form",root).onsubmit=async e=>{
        e.preventDefault();

        try{
          const eventType=type.value;
          const startIso=new Date(start.value).toISOString();
          const endIso=end.value?new Date(end.value).toISOString():null;
          const venue=venues.find(v=>v.id===venueSelect.value);
          const freeLocation=$("#ev-location",root).value.trim();

          const location=venue
            ? `${venue.name}${venueAddress(venue)?` · ${venueAddress(venue)}`:""}${freeLocation?` · ${freeLocation}`:""}`
            : (freeLocation||null);

          let finalTitle=title.value.trim();
          let comp=null;
          let opp=null;

          if(eventType==="training"){
            finalTitle="Allenamento";
          }

          if(eventType==="match"){
            comp=competitions.find(c=>c.id===competitionSelect.value);
            opp=opponents.find(o=>o.id===opponentSelect.value);

            if(!comp)throw new Error("Seleziona la competizione");
            if(!opp)throw new Error("Seleziona l'avversaria");

            const allowed=allowedOpponents();
            if(!allowed.some(o=>o.id===opp.id)){
              throw new Error("Questa avversaria non è prevista per la competizione selezionata");
            }

            const our=state.team.short_name||state.team.name;
            const other=opp.short_name||opp.name;
            const home=ha.value==="away"?other:our;
            const away=ha.value==="away"?our:other;
            finalTitle=`${comp.name} · ${home} - ${away}`;
          }

          if(!finalTitle)throw new Error("Inserisci il titolo dell'evento");

          const ev=await must(
            supabase.from("events")
              .insert({
                team_id:state.team.id,
                season_id:state.season.id,
                event_type:eventType,
                title:finalTitle,
                start_at:startIso,
                end_at:endIso,
                venue_id:venue?.id||null,
                location,
                notes:$("#ev-notes",root).value.trim()||null,
                created_by:state.profile.id
              })
              .select("*")
              .single()
          );

          if(eventType==="match"){
            await must(
              supabase.from("matches")
                .insert({
                  team_id:state.team.id,
                  season_id:state.season.id,
                  event_id:ev.id,
                  competition_id:comp.id,
                  opponent_id:opp.id,
                  opponent_name:opp.name,
                  home_away:ha.value,
                  round_label:$("#ev-round",root).value.trim()||null,
                  created_by:state.profile.id
                })
            );
          }

          closeModal();
          toast(eventType==="training"?"Allenamento creato":eventType==="match"?"Partita creata":"Evento creato","ok");

          if(afterSave)await afterSave();
          else await pageCalendar();

        }catch(err){
          toast(err.message,"error");
        }
      };
    });

  }catch(err){
    toast(err.message,"error");
  }
}

async function openEventEditModal(eventId,afterSave=null){
  try{
    const [ev,venues]=await Promise.all([
      must(supabase.from("events").select("*").eq("id",eventId).single()),
      must(
        supabase.from("venues")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("is_opponent_venue",false)
          .order("name")
      )
    ]);

    const start=new Date(ev.start_at);
    const end=ev.end_at?new Date(ev.end_at):null;

    showModal(ev.event_type==="training"?"Modifica allenamento":"Modifica evento",`
      <form id="event-edit-form">
        ${ev.event_type==="training"
          ? `<input id="eev-title" type="hidden" value="Allenamento">`
          : `<div class="field"><label>Titolo</label><input id="eev-title" value="${esc(ev.title||"")}" required></div>`
        }

        <div class="form-grid">
          <div class="field"><label>Data</label><input id="eev-date" type="date" value="${localDateKey(start)}" required></div>
          <div class="field"><label>Ora inizio</label><input id="eev-start" type="time" value="${localTimeValue(start)}" required></div>
        </div>

        <div class="field">
          <label>Ora fine</label>
          <input id="eev-end" type="time" value="${end?localTimeValue(end):""}">
        </div>

        <div class="field">
          <label>Campo</label>
          <select id="eev-venue">
            <option value="">Nessun campo predefinito</option>
            ${venues.map(v=>`<option value="${v.id}" ${v.id===ev.venue_id?"selected":""}>${esc(v.name)}</option>`).join("")}
          </select>
        </div>

        <div class="field">
          <label>Luogo visualizzato</label>
          <input id="eev-location" value="${esc(ev.location||"")}">
        </div>

        <div class="field"><label>Note</label><textarea id="eev-notes">${esc(ev.notes||"")}</textarea></div>

        <button class="btn btn-primary">Salva modifiche</button>
      </form>
    `,root=>{
      const venueSel=$("#eev-venue",root);
      venueSel.onchange=()=>{
        const venue=venues.find(v=>v.id===venueSel.value);
        if(venue){
          $("#eev-location",root).value=`${venue.name}${venueAddress(venue)?` · ${venueAddress(venue)}`:""}`;
        }
      };

      $("#event-edit-form",root).onsubmit=async e=>{
        e.preventDefault();
        try{
          const date=$("#eev-date",root).value;
          const startTime=$("#eev-start",root).value;
          const endTime=$("#eev-end",root).value;

          const startAt=new Date(`${date}T${startTime}`);
          let endAt=null;

          if(endTime){
            endAt=new Date(`${date}T${endTime}`);
            if(endAt<=startAt)throw new Error("L'orario di fine deve essere successivo all'inizio");
          }

          await must(
            supabase.from("events")
              .update({
                title:ev.event_type==="training"?"Allenamento":$("#eev-title",root).value.trim(),
                start_at:startAt.toISOString(),
                end_at:endAt?.toISOString()||null,
                venue_id:venueSel.value||null,
                location:$("#eev-location",root).value.trim()||null,
                notes:$("#eev-notes",root).value.trim()||null
              })
              .eq("id",eventId)
          );

          closeModal();
          toast("Evento aggiornato","ok");
          if(afterSave)await afterSave();
          else await pageCalendar();
        }catch(err){
          toast(err.message,"error");
        }
      };
    });
  }catch(err){
    toast(err.message,"error");
  }
}

async function openTrainingDetail(id){
  try{
    const [ev,roster,genericRows]=await Promise.all([
      must(supabase.from("events").select("*").eq("id",id).single()),
      must(supabase.rpc("get_training_attendance_roster",{p_event_id:id})),
      must(supabase.rpc("get_roster_generic_roles",{p_team_id:state.team.id,p_season_id:state.season.id}))
    ]);
    const genericMap=new Map(genericRows.map(x=>[x.player_id,x.generic_role_code||null]));

    const canManage=can("trainings.manage")||can("attendance.manage");

    const absenceLabel=row=>{
      if(row.absence_source==="injury")return `Infortunio${row.absence_reason?` · ${row.absence_reason}`:""}`;
      return `${absenceTypeLabel(row.absence_type)}${row.absence_reason?` · ${row.absence_reason}`:""}`;
    };

    const isAbsent=row=>row.planned_absent||row.attendance_status==="absent";

    const playerCard=(row,section)=>{
      const absent=isAbsent(row);
      const late=row.attendance_status==="late";

      return `<div class="attendance-player-card ${row.planned_absent?"absence-planned":""}"
        draggable="${canManage?"true":"false"}"
        data-training-player="${row.player_id}"
        data-current-section="${section}">
        <div class="attendance-player-main">
          <div class="attendance-player-name">
            ${playerListIdentity(row,genericMap.get(row.player_id))}
            <div class="muted">
              ${row.planned_absent
                ? `Prevista: ${esc(absenceLabel(row))}`
                : late
                  ? "Presente · in ritardo"
                  : row.attendance_status==="present"
                    ? "Presente"
                    : absent
                      ? "Assente"
                      : "Disponibile"
              }
            </div>
          </div>
        </div>

        ${canManage?`
          <div class="attendance-card-actions">
            ${section==="absent"
              ? `<button type="button" class="btn btn-sm btn-primary" data-training-present="${row.player_id}">Presente</button>`
              : `<button type="button" class="btn btn-sm" data-training-late="${row.player_id}">${late?"Puntuale":"Ritardo"}</button>
                 <button type="button" class="btn btn-sm btn-danger" data-training-absent="${row.player_id}">Assente</button>`
            }
          </div>
        `:""}
      </div>`;
    };

    const present=roster.filter(r=>!isAbsent(r));
    const absent=roster.filter(r=>isAbsent(r));

    showModal("Allenamento",`
      <div class="section-note">
        <div class="card-head">
          <div>
            <strong>${fmtDateTime(ev.start_at)}</strong> · ${esc(ev.location||"Luogo non indicato")}
            <div class="muted">Gli indisponibili previsti sono già collocati tra gli Assenti.</div>
          </div>
          ${can("trainings.manage")||can("calendar.manage")
            ? `<button class="btn btn-sm" id="edit-training-event">✎ Modifica allenamento</button>`
            : ""
          }
        </div>
      </div>

      <div style="height:14px"></div>

      <div class="attendance-board">
        <section class="attendance-zone" data-drop-status="present">
          <div class="attendance-zone-head">
            <h3 style="margin:0">Presenti</h3>
            <span class="badge green">${present.length}</span>
          </div>
          <div data-training-list="present">
            ${present.map(r=>playerCard(r,"present")).join("")||`<div class="attendance-empty">Nessun presente</div>`}
          </div>
        </section>

        <section class="attendance-zone" data-drop-status="absent">
          <div class="attendance-zone-head">
            <h3 style="margin:0">Assenti</h3>
            <span class="badge ${absent.length?"red":""}">${absent.length}</span>
          </div>
          <div data-training-list="absent">
            ${absent.map(r=>playerCard(r,"absent")).join("")||`<div class="attendance-empty">Nessun assente</div>`}
          </div>
        </section>
      </div>
    `,root=>{
      root.closest(".modal").style.width="min(1000px,100%)";
      const rowMap=new Map(roster.map(r=>[r.player_id,r]));

      $("#edit-training-event",root)?.addEventListener("click",()=>{
        closeModal();
        openEventEditModal(id,()=>openTrainingDetail(id));
      });

      const reload=async()=>{
        closeModal();
        await openTrainingDetail(id);
      };

      const setPresent=async(row,status="present")=>{
        if(row.planned_absent){
          const ok=confirm(
            `${row.first_name} ${row.last_name} risulta assente per "${absenceLabel(row)}". `+
            `Segnandolo presente, l'assenza attiva verrà cessata. Continuare?`
          );
          if(!ok)return;
        }

        try{
          await must(
            supabase.rpc("set_training_attendance",{
              p_event_id:id,
              p_player_id:row.player_id,
              p_status:status,
              p_absence_type:null,
              p_absence_reason:null,
              p_absence_until:null
            })
          );
          toast(status==="late"?"Ritardo registrato":"Presenza registrata","ok");
          await reload();
        }catch(err){
          toast(err.message,"error");
        }
      };

      const setAbsent=async row=>{
        if(row.planned_absent){
          try{
            await must(
              supabase.rpc("set_training_attendance",{
                p_event_id:id,
                p_player_id:row.player_id,
                p_status:"absent",
                p_absence_type:null,
                p_absence_reason:null,
                p_absence_until:null
              })
            );
            await reload();
          }catch(err){
            toast(err.message,"error");
          }
          return;
        }

        openUnexpectedTrainingAbsence(row,id,reload);
      };

      $$("[data-training-present]",root).forEach(b=>b.onclick=()=>setPresent(rowMap.get(b.dataset.trainingPresent),"present"));
      $$("[data-training-absent]",root).forEach(b=>b.onclick=()=>setAbsent(rowMap.get(b.dataset.trainingAbsent)));
      $$("[data-training-late]",root).forEach(b=>b.onclick=()=>{
        const row=rowMap.get(b.dataset.trainingLate);
        setPresent(row,row.attendance_status==="late"?"present":"late");
      });

      if(canManage){
        let draggedId=null;

        $$("[data-training-player]",root).forEach(card=>{
          card.addEventListener("dragstart",e=>{
            draggedId=card.dataset.trainingPlayer;
            e.dataTransfer.effectAllowed="move";
            e.dataTransfer.setData("text/plain",draggedId);
          });
          card.addEventListener("dragend",()=>{
            draggedId=null;
            $$("[data-drop-status]",root).forEach(z=>z.classList.remove("drag-over"));
          });
        });

        $$("[data-drop-status]",root).forEach(zone=>{
          zone.addEventListener("dragover",e=>{
            e.preventDefault();
            zone.classList.add("drag-over");
          });
          zone.addEventListener("dragleave",()=>zone.classList.remove("drag-over"));
          zone.addEventListener("drop",e=>{
            e.preventDefault();
            zone.classList.remove("drag-over");
            const pid=draggedId||e.dataTransfer.getData("text/plain");
            const row=rowMap.get(pid);
            if(!row)return;

            const target=zone.dataset.dropStatus;
            const current=isAbsent(row)?"absent":"present";
            if(target===current)return;

            if(target==="present")setPresent(row,"present");
            else setAbsent(row);
          });
        });
      }
    });

  }catch(err){
    toast(err.message,"error");
  }
}

async function openEventDetail(id){
  const ev=await must(supabase.from("events").select("*").eq("id",id).single());

  if(isFanAudience()&&ev.event_type!=="match"){
    toast("Questo evento è riservato alla squadra","error");
    return;
  }

  if(ev.event_type==="training")return openTrainingDetail(id);

  if(ev.event_type==="match"){
    const match=await must(supabase.from("matches").select("id").eq("event_id",id).maybeSingle());
    if(match?.id)return route(`match/${match.id}`);
  }

  const genericMap=await loadGenericRoleMap();
  const players=await must(
    supabase.rpc("get_active_roster",{
      p_team_id:state.team.id,
      p_season_id:state.season.id,
      p_at:ev.start_at.slice(0,10)
    })
  );
  const attendance=await must(
    supabase.from("event_attendance").select("*").eq("event_id",id)
  );
  const amap=new Map(attendance.map(a=>[a.player_id,a]));

  showModal(ev.title,`
    <div class="section-note">
      <div class="card-head">
        <div>${fmtDateTime(ev.start_at)} · ${esc(ev.location||"Luogo non indicato")}</div>
        ${can("calendar.manage")?`<button class="btn btn-sm" id="edit-generic-event">✎ Modifica</button>`:""}
      </div>
    </div>

    <div style="height:12px"></div>

    <div class="list">
      ${players.map(p=>{
        const a=amap.get(p.player_id);
        const own=p.profile_id===state.profile.id;
        const editable=can("attendance.manage")||(own&&can("attendance.edit_own"));

        return `<div class="list-item">
          <div>${playerListIdentity(p,genericMap.get(p.player_id))}</div>
          ${editable
            ? `<select data-att="${p.player_id}" style="width:165px">
                ${["unknown","present","absent","late","maybe","injured","excused"]
                  .map(x=>`<option value="${x}" ${a?.status===x?"selected":""}>${attendanceLabel(x)}</option>`)
                  .join("")}
              </select>`
            : `<span class="badge">${esc(attendanceLabel(a?.status||"unknown"))}</span>`
          }
        </div>`;
      }).join("")}
    </div>
  `,root=>{
    $("#edit-generic-event",root)?.addEventListener("click",()=>{
      closeModal();
      openEventEditModal(id,()=>openEventDetail(id));
    });

    $$("[data-att]",root).forEach(sel=>sel.onchange=async()=>{
      try{
        await must(
          supabase.from("event_attendance")
            .upsert({
              event_id:id,
              player_id:sel.dataset.att,
              status:sel.value,
              updated_by:state.profile.id
            },{onConflict:"event_id,player_id"})
        );
        toast("Presenza aggiornata","ok");
      }catch(err){
        toast(err.message,"error");
      }
    });
  });
}

async function pageMatches(){
  const matches=await must(
    supabase.from("matches")
      .select("*")
      .eq("team_id",state.team.id)
      .eq("season_id",state.season.id)
      .order("created_at",{ascending:false})
  );

  const eventIds=matches.map(m=>m.event_id).filter(Boolean);
  const events=eventIds.length
    ? await must(
        supabase.from("events")
          .select("id,start_at,title,location")
          .in("id",eventIds)
      )
    : [];

  const em=new Map(events.map(e=>[e.id,e]));

  const scores=await must(
    supabase.from("v_match_score")
      .select("*")
      .eq("team_id",state.team.id)
      .eq("season_id",state.season.id)
  );
  const sm=new Map(scores.map(x=>[x.match_id,x]));

  renderShell("Partite",`
    <div class="page-title">
      <div>
        <h1>Partite</h1>
        <p>Competizione, convocazioni, formazione, LIVE e post partita.</p>
      </div>
      <div class="actions">
        ${can("matches.setup")
          ? `<button class="btn btn-sm setup-button" id="match-setup">⚙ Setup partite</button>`
          : ""
        }
        ${can("matches.manage")
          ? `<button class="btn btn-primary" id="new-match">Nuova partita</button>`
          : ""
        }
      </div>
    </div>

    <div class="calendar-event-list">
      ${matches.map(m=>{
        const e=em.get(m.event_id);
        const score=sm.get(m.id);
        const fallbackTitle=m.home_away==="away"
          ? `${m.opponent_name} - ${state.team.short_name||state.team.name}`
          : `${state.team.short_name||state.team.name} - ${m.opponent_name}`;

        const title=e?.title||fallbackTitle;
        const d=e?calendarDateParts(e.start_at):{day:"--",month:"---",time:"--:--"};

        return `<div class="calendar-event-row" data-match="${m.id}">
          <div class="calendar-date-tile">
            <div class="calendar-date-day">${d.day}</div>
            <div class="calendar-date-month">${d.month}</div>
          </div>
          <div class="calendar-event-main">
            <div class="calendar-event-title">${esc(title)}</div>
            <div class="calendar-event-place">${esc(e?.location||"Luogo non indicato")}</div>
            <div class="attendance-summary">
              <span class="badge">${esc(m.status)}</span>
              ${score?`<span class="badge green">${score.goals_for}-${score.goals_against}</span>`:""}
            </div>
          </div>
          <div>
            <div class="calendar-event-time">${d.time}</div>
            <div class="actions" style="margin-top:6px">
              ${m.status==="live"||m.status==="paused"
                ? `<button class="btn btn-danger btn-sm" data-live="${m.id}">LIVE</button>`
                : ""
              }
            </div>
          </div>
        </div>`;
      }).join("")||`<div class="empty">Nessuna partita</div>`}
    </div>
  `);

  $("#match-setup")?.addEventListener("click",openMatchSetup);
  $("#new-match")?.addEventListener("click",()=>openMatchConfigurator(pageMatches));

  $$("[data-match]").forEach(el=>el.onclick=e=>{
    if(e.target.closest("[data-live]"))return;
    route(`match/${el.dataset.match}`);
  });

  $$("[data-live]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    route(`live/${b.dataset.live}`);
  });
}
async function openMatchEditModal(matchId,afterSave=null){
  try{
    const m=await must(supabase.from("matches").select("*").eq("id",matchId).single());
    const ev=await must(supabase.from("events").select("*").eq("id",m.event_id).single());

    const [venues,opponents,competitions,setting]=await Promise.all([
      must(
        supabase.from("venues")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("is_opponent_venue",false)
          .order("name")
      ),
      must(
        supabase.from("opponent_teams")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("active",true)
          .order("name")
      ),
      must(
        supabase.from("competitions")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("season_id",state.season.id)
          .order("name")
      ),
      must(
        supabase.from("match_settings")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("season_id",state.season.id)
          .maybeSingle()
      )
    ]);

    const start=new Date(ev.start_at);
    const offset=Number(setting?.default_meeting_offset_minutes??90);
    let mode=m.home_away||"home";

    showModal("Modifica partita",`
      <form id="match-edit-form">
        <div class="form-grid">
          <div class="field">
            <label>Competizione</label>
            <select id="mep-competition">
              ${competitions.map(c=>`<option value="${c.id}" ${c.id===m.competition_id?"selected":""}>${esc(c.name)}</option>`).join("")}
            </select>
          </div>

          <div class="field">
            <label>Avversaria</label>
            <select id="mep-opponent">
              ${opponents.map(o=>`<option value="${o.id}" ${o.id===m.opponent_id?"selected":""}>${esc(o.name)}</option>`).join("")}
            </select>
          </div>
        </div>

        <div class="home-away-selector">
          <button type="button" data-edit-match-mode="home" class="${mode==="home"?"active":""}">🏠 Casa</button>
          <button type="button" data-edit-match-mode="away" class="${mode==="away"?"active":""}">✈️ Trasferta</button>
          <button type="button" data-edit-match-mode="neutral" class="${mode==="neutral"?"active":""}">◇ Neutro</button>
        </div>

        <div class="form-grid">
          <div class="field"><label>Data</label><input id="mep-date" type="date" value="${localDateKey(start)}" required></div>
          <div class="field"><label>Ora</label><input id="mep-time" type="time" value="${localTimeValue(start)}" required></div>
        </div>

        <div id="mep-friendly-periods" class="competition-rule-box hidden">
          <strong>Formato amichevole</strong>
          <div class="form-grid" style="margin-top:7px">
            <div class="field"><label>Numero tempi</label><input id="mep-period-count" type="number" min="1" max="8" value="${m.regulation_period_count||2}"></div>
            <div class="field"><label>Minuti per tempo</label><input id="mep-period-minutes" type="number" min="1" max="90" value="${m.regulation_period_minutes||45}"></div>
          </div>
        </div>

        <div class="field" id="mep-home-venue-box">
          <label>Campo</label>
          <select id="mep-venue">
            <option value="">Nessun campo</option>
            ${venues.map(v=>`<option value="${v.id}" ${v.id===ev.venue_id?"selected":""}>${esc(v.name)}</option>`).join("")}
          </select>
        </div>

        <div class="field" id="mep-free-location-box">
          <label>Luogo partita</label>
          <input id="mep-location" value="${esc(ev.location||"")}">
          <div class="inherit-venue-row hidden" id="mep-inherit-row">
            <span class="muted" id="mep-inherit-preview"></span>
            <button class="btn btn-sm" type="button" id="mep-inherit-opponent-venue">↻ Eredita campo avversaria</button>
          </div>
        </div>

        <div class="field"><label>Giornata / turno</label><input id="mep-round" value="${esc(m.round_label||"")}"></div>
        <div class="field"><label>Note</label><textarea id="mep-notes">${esc(ev.notes||"")}</textarea></div>

        <button class="btn btn-primary">Salva modifiche</button>
      </form>
    `,root=>{
      root.closest(".modal").style.width="min(820px,100%)";

      const compSel=$("#mep-competition",root);
      const oppSel=$("#mep-opponent",root);
      const venueSel=$("#mep-venue",root);
      const location=$("#mep-location",root);
      const homeVenueBox=$("#mep-home-venue-box",root);
      const friendlyBox=$("#mep-friendly-periods",root);
      const inheritRow=$("#mep-inherit-row",root);
      const inheritPreview=$("#mep-inherit-preview",root);
      const inheritButton=$("#mep-inherit-opponent-venue",root);

      const currentComp=()=>competitions.find(c=>c.id===compSel.value);
      const currentOpp=()=>opponents.find(o=>o.id===oppSel.value);

      const refreshCompetition=()=>{
        friendlyBox.classList.toggle("hidden",currentComp()?.competition_type!=="friendly");
      };

      const refreshMode=(applyDefault=false)=>{
        $$("[data-edit-match-mode]",root).forEach(b=>{
          b.classList.toggle("active",b.dataset.editMatchMode===mode);
        });

        homeVenueBox.classList.toggle("hidden",mode!=="home");

        const inheritedOpponentLocation=opponentVenueLocation(currentOpp());
        const canInherit=mode==="away"&&!!inheritedOpponentLocation;
        inheritRow.classList.toggle("hidden",!canInherit);
        inheritPreview.textContent=canInherit?inheritedOpponentLocation:"";

        if(applyDefault&&mode==="away"){
          location.value=inheritedOpponentLocation;
        }else if(applyDefault&&mode==="neutral"){
          location.value="";
        }else if(applyDefault&&mode==="home"){
          const venue=venues.find(v=>v.id===venueSel.value)
            ||venues.find(v=>v.id===state.team.default_venue_id);
          if(venue){
            venueSel.value=venue.id;
            location.value=`${venue.name}${venueAddress(venue)?` · ${venueAddress(venue)}`:""}`;
          }
        }
      };

      $$("[data-edit-match-mode]",root).forEach(b=>b.onclick=()=>{
        mode=b.dataset.editMatchMode;
        refreshMode(true);
      });

      compSel.onchange=refreshCompetition;
      oppSel.onchange=()=>{ if(mode==="away")refreshMode(true); };

      inheritButton.onclick=()=>{
        const inherited=opponentVenueLocation(currentOpp());
        if(!inherited){
          toast("La squadra avversaria non ha ancora un campo configurato","error");
          return;
        }
        location.value=inherited;
        toast("Campo ereditato dalla scheda avversaria","ok");
      };

      venueSel.onchange=()=>{
        if(mode!=="home")return;
        const venue=venues.find(v=>v.id===venueSel.value);
        location.value=venue?`${venue.name}${venueAddress(venue)?` · ${venueAddress(venue)}`:""}`:"";
      };

      refreshCompetition();
      refreshMode(false);

      $("#match-edit-form",root).onsubmit=async e=>{
        e.preventDefault();
        try{
          const comp=currentComp();
          const opp=currentOpp();
          if(!comp||!opp)throw new Error("Competizione e avversaria sono obbligatorie");

          const startAt=new Date(`${$("#mep-date",root).value}T${$("#mep-time",root).value}`);
          const meetingAt=meetingFromStart(startAt,offset);

          const own=ownTeamDisplayName();
          const other=opponentDisplayName(opp);
          const home=mode==="away"?other:own;
          const away=mode==="away"?own:other;
          const title=`${comp.name} · ${home} - ${away}`;

          const venueId=mode==="home"?(venueSel.value||null):null;

          await must(
            supabase.from("events")
              .update({
                title,
                start_at:startAt.toISOString(),
                venue_id:venueId,
                location:location.value.trim()||null,
                notes:$("#mep-notes",root).value.trim()||null
              })
              .eq("id",ev.id)
          );

          await must(
            supabase.from("matches")
              .update({
                competition_id:comp.id,
                opponent_id:opp.id,
                opponent_name:opp.name,
                home_away:mode,
                round_label:$("#mep-round",root).value.trim()||null,
                meeting_at:meetingAt?.toISOString()||null,
                regulation_period_count:comp.competition_type==="friendly"
                  ? Number($("#mep-period-count",root).value)||2
                  : (comp.regular_period_count||2),
                regulation_period_minutes:comp.competition_type==="friendly"
                  ? Number($("#mep-period-minutes",root).value)||45
                  : (comp.regular_period_minutes||45),
                extra_period_count:comp.competition_type==="friendly"
                  ? 0
                  : (comp.extra_time_enabled?(comp.extra_period_count||2):0),
                extra_period_minutes:comp.competition_type==="friendly"
                  ? 0
                  : (comp.extra_time_enabled?(comp.extra_period_minutes||15):0)
              })
              .eq("id",matchId)
          );

          closeModal();
          toast("Partita aggiornata","ok");
          if(afterSave)await afterSave();
          else await pageMatches();
        }catch(err){
          toast(err.message,"error");
        }
      };
    });
  }catch(err){
    toast(err.message,"error");
  }
}

async function pageMatch(id){
  const m=await must(supabase.from("matches").select("*").eq("id",id).single());
  const ev=await must(supabase.from("events").select("*").eq("id",m.event_id).single());

  const [callupRoster,positions,scoreRows,opponents,competitions,genericRows]=await Promise.all([
    must(supabase.rpc("get_match_callup_roster",{p_match_id:id})),
    must(supabase.from("football_positions").select("*").eq("active",true).order("sort_order")),
    must(supabase.from("v_match_score").select("*").eq("match_id",id)),
    must(supabase.from("opponent_teams").select("*").eq("team_id",state.team.id)),
    must(supabase.from("competitions").select("*").eq("team_id",state.team.id)),
    must(supabase.rpc("get_roster_generic_roles",{p_team_id:state.team.id,p_season_id:state.season.id}))
  ]);
  const genericMap=new Map(genericRows.map(x=>[x.player_id,x.generic_role_code||null]));

  const score=scoreRows[0]||{goals_for:0,goals_against:0};
  const opponent=opponents.find(o=>o.id===m.opponent_id);
  const competition=competitions.find(c=>c.id===m.competition_id);

  const available=callupRoster.filter(p=>p.available);
  const unavailable=callupRoster.filter(p=>!p.available);
  const called=available.filter(p=>p.called_up);
  const pmMap=new Map(callupRoster.map(x=>[x.player_id,{...x}]));

  const meetingAt=m.meeting_at||ev.start_at;
  const callupsLocked=Date.now()>=new Date(meetingAt).getTime();

  const homeIsUs=m.home_away!=="away";
  const leftName=m.home_away==="away"?opponentDisplayName(opponent):ownTeamDisplayName();
  const rightName=m.home_away==="away"?ownTeamDisplayName():opponentDisplayName(opponent);
  const leftLogo=m.home_away==="away"?opponentLogoHtml(opponent):ownLogoHtml();
  const rightLogo=m.home_away==="away"?ownLogoHtml():opponentLogoHtml(opponent);

  renderShell("Dettaglio partita",`
    <div class="page-title">
      <div>
        <h1>${esc(ev.title)}</h1>
        <p>${fmtDateTime(ev.start_at)} · ${esc(ev.location||"Luogo non indicato")} · ${esc(m.status)}</p>
      </div>
      <div class="actions">
        ${can("matches.manage")?`<button class="btn" id="edit-match">✎ Modifica partita</button>`:""}
        ${can("live.view")?`<button class="btn btn-primary" id="open-live">Apri LIVE</button>`:""}
        ${m.status==="finished"&&can("matches.finalize")?`<button class="btn" id="finalize">Finalizza</button>`:""}
      </div>
    </div>

    <div class="card">
      <div class="match-scoreboard">
        <div class="match-score-team">
          ${leftLogo}
          <strong>${esc(leftName)}</strong>
        </div>
        <div>
          <div class="match-score-number">${m.home_away==="away"?`${score.goals_against}-${score.goals_for}`:`${score.goals_for}-${score.goals_against}`}</div>
          <div class="muted">
            ${esc(competition?.name||"Partita")} · ${matchLocationIcon(m.home_away)}
            · ${m.regulation_period_count||2}×${m.regulation_period_minutes||45}'
            ${m.extra_period_count?` + ${m.extra_period_count}×${m.extra_period_minutes||15}' suppl.`:""}
          </div>
        </div>
        <div class="match-score-team">
          ${rightLogo}
          <strong>${esc(rightName)}</strong>
        </div>
      </div>
    </div>

    <div style="height:14px"></div>

    <div class="card">
      <div class="card-head">
        <div>
          <h2>Convocazioni</h2>
          <div class="muted">
            ${callupsLocked
              ? `Convocazioni chiuse: orario di ritrovo raggiunto.`
              : `Modificabili fino all'orario di ritrovo.`
            }
          </div>
        </div>
        <span class="badge ${callupsLocked?"red":"green"}">${called.length} convocati</span>
      </div>

      <div class="meeting-line">
        <div class="field">
          <label>Orario di ritrovo</label>
          <input id="match-meeting-at" type="datetime-local" value="${toDatetimeLocal(meetingAt)}" ${can("callups.manage")?"":"disabled"}>
        </div>
        ${can("callups.manage")?`<button class="btn btn-sm" id="save-meeting-time">Salva ritrovo</button>`:""}
      </div>

      <div style="height:12px"></div>
      <h3>Convocabili</h3>
      <div class="callup-grid">
        ${available.map(p=>`
          <label class="callup-card">
            <div>
              ${playerListIdentity(p,genericMap.get(p.player_id))}
              <span class="muted">${p.shirt_number?` · #${p.shirt_number}`:""}</span>
            </div>
            <input type="checkbox" data-call="${p.player_id}" ${p.called_up?"checked":""} ${(can("callups.manage")&&!callupsLocked)?"":"disabled"}>
          </label>
        `).join("")||`<div class="empty">Nessun calciatore convocabile</div>`}
      </div>

      ${unavailable.length?`
        <div style="height:16px"></div>
        <h3>Non convocabili</h3>
        <div class="callup-grid">
          ${unavailable.map(p=>`
            <div class="callup-card callup-unavailable">
              <div>
                ${playerListIdentity(p,genericMap.get(p.player_id))}
                <div class="muted">${esc(
                  p.unavailable_kind==="suspension"
                    ? `Squalifica · ${p.unavailable_reason||""}`
                    : p.unavailable_kind==="injury"
                      ? `Infortunio · ${p.unavailable_reason||""}`
                      : `Indisponibile · ${p.unavailable_reason||""}`
                )}</div>
              </div>
            </div>
          `).join("")}
        </div>
      `:""}
    </div>

    <div style="height:14px"></div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-head"><h2>Formazione</h2></div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Convocato</th><th>Titolare</th><th>Ruolo iniziale</th></tr></thead>
            <tbody>
              ${called.map(p=>`
                <tr>
                  <td>${playerListIdentity(p,genericMap.get(p.player_id),{avatar:false})}</td>
                  <td><input type="checkbox" data-start="${p.player_id}" ${p.starter?"checked":""} ${can("lineup.manage")?"":"disabled"}></td>
                  <td>
                    <select data-pos="${p.player_id}" ${can("lineup.manage")?"":"disabled"}>
                      <option value="">—</option>
                      ${positions.map(x=>`<option value="${x.id}" ${p.starting_position_id===x.id?"selected":""}>${esc(x.code)}</option>`).join("")}
                    </select>
                  </td>
                </tr>
              `).join("")||`<tr><td colspan="3">Nessun convocato</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>Campo</h2>
        <div class="pitch">
          ${["forward","midfielder","defender","goalkeeper"].map(cat=>`
            <div class="pitch-row">
              ${called.filter(p=>{
                const pos=positions.find(x=>x.id===p.starting_position_id);
                return p.starter&&pos?.category===cat;
              }).map(p=>`
                <div class="pitch-player">
                  ${esc(p.last_name)}<br>
                  <span class="muted">${esc(positions.find(x=>x.id===p.starting_position_id)?.code||"")}</span>
                </div>
              `).join("")}
            </div>
          `).join("")}
        </div>
      </div>
    </div>

    ${m.status==="finished"||m.status==="finalized"
      ? `<div style="height:14px"></div><button class="btn btn-primary" id="rate-match">Vota la partita</button>`
      : ""
    }
  `);

  $("#edit-match")?.addEventListener("click",()=>openMatchEditModal(id,()=>pageMatch(id)));
  $("#open-live")?.addEventListener("click",()=>route(`live/${id}`));
  $("#rate-match")?.addEventListener("click",()=>openRatings(id));

  $("#finalize")?.addEventListener("click",async()=>{
    try{
      await edge("match-finalize",{match_id:id});
      toast("Partita finalizzata","ok");
      pageMatch(id);
    }catch(err){
      toast(err.message,"error");
    }
  });

  $("#save-meeting-time")?.addEventListener("click",async()=>{
    try{
      const value=$("#match-meeting-at").value;
      if(!value)throw new Error("Inserisci l'orario di ritrovo");
      await must(
        supabase.rpc("set_match_meeting_at",{
          p_match_id:id,
          p_meeting_at:new Date(value).toISOString()
        })
      );
      toast("Orario di ritrovo aggiornato","ok");
      pageMatch(id);
    }catch(err){
      toast(err.message,"error");
    }
  });

  $$("[data-call]").forEach(x=>x.onchange=async()=>{
    const previous=!x.checked;
    try{
      await must(
        supabase.rpc("set_match_callup",{
          p_match_id:id,
          p_player_id:x.dataset.call,
          p_called_up:x.checked
        })
      );
      await pageMatch(id);
    }catch(e){
      x.checked=previous;
      toast(e.message,"error");
    }
  });

  async function saveLineup(pid,patch){
    const cur=pmMap.get(pid);
    if(!cur)return;

    const row={
      match_id:id,
      player_id:pid,
      called_up:true,
      starter:patch.starter??cur.starter??false,
      starting_position_id:patch.starting_position_id!==undefined
        ? patch.starting_position_id
        : cur.starting_position_id,
      shirt_number:cur.shirt_number||null,
      captain:false
    };

    await must(
      supabase.from("match_players")

    );

    pmMap.set(pid,{...cur,...row});
  }

  $$("[data-start]").forEach(x=>x.onchange=async()=>{
    try{
      await saveLineup(x.dataset.start,{starter:x.checked});
      pageMatch(id);
    }catch(e){

    }
  });

  $$("[data-pos]").forEach(x=>x.onchange=async()=>{
    try{
      await saveLineup(x.dataset.pos,{starting_position_id:x.value||null});

    }
  });
}

async function pageLive(id){

async function loadLiveData(id){
  const m=await must(supabase.from("matches").select("*").eq("id",id).single());
  const ev=await must(supabase.from("events").select("*").eq("id",m.event_id).single());
  const official=await must(supabase.from("match_events").select("*").eq("match_id",id).order("match_second"));
  const pending=await must(supabase.rpc("get_live_pending_groups",{p_match_id:id}));
  const score=(await must(supabase.from("v_match_score").select("*").eq("match_id",id)))[0]||{goals_for:0,goals_against:0};
  const players=await must(supabase.from("players").select("id,first_name,last_name").eq("team_id",state.team.id));const pm=new Map(players.map(p=>[p.id,p]));
  const positions=await must(supabase.from("football_positions").select("*").eq("active",true));const posm=new Map(positions.map(p=>[p.id,p]));
  const clock=(await must(supabase.rpc("get_match_clock",{p_match_id:id})))[0]||{elapsed_seconds:0,clock_running:false};
  return {m,ev,official,pending,score,players,pm,positions,posm,clock};
}
function eventLabel(e,pm,posm){
  const p=pm.get(e.player_id),s=pm.get(e.secondary_player_id),pos=posm.get(e.position_id);
  const n=p?`${p.last_name} ${p.first_name}`:"";
  if(e.event_type==="goal"||e.event_type==="penalty_goal")return `⚽ ${n}${s?` · assist ${s.last_name}`:""}`;
  if(e.event_type==="own_goal")return `⚽ Autogol ${n}`;
  if(e.event_type==="substitution")return `🔄 ${n} entra${s?`, ${s.last_name} esce`:""}${pos?` · ${pos.code}`:""}`;
  if(e.event_type==="position_change")return `↔ ${n} → ${pos?.code||""}`;
  if(e.event_type==="yellow_card")return `🟨 ${n||"Cartellino"}`;
  if(e.event_type==="red_card"||e.event_type==="second_yellow")return `🟥 ${n||"Espulsione"}`;
  if(e.event_type==="injury")return `🩹 ${n||"Infortunio"}`;
  return `📝 ${esc(e.notes||e.event_type)}`;
}

function startClockTicker(){
  clearInterval(state.liveTimer);const el=$("#live-clock");if(!el)return;let base=Number(el.dataset.base||0),running=el.dataset.running==="true",started=Date.now();
  state.liveTimer=setInterval(()=>{if(running&&$("#live-clock"))$("#live-clock").textContent=clockText(base+Math.floor((Date.now()-started)/1000))},1000);
}
function stopLive(){clearInterval(state.liveTimer);state.liveTimer=null;if(state.liveChannel){supabase.removeChannel(state.liveChannel);state.liveChannel=null}}
function subscribeLive(id){
  if(state.liveChannel)supabase.removeChannel(state.liveChannel);
  const ch=supabase.channel(`match:${id}`,{config:{private:true}});
  ["INSERT","UPDATE","DELETE"].forEach(ev=>ch.on("broadcast",{event:ev},()=>{if(state.currentPage==="live")renderLiveView(id).catch(console.error)}));
  ch.subscribe();state.liveChannel=ch;
}

function venueAddress(v){

  return [v.address_line,[v.postal_code,v.city].filter(Boolean).join(" "),v.province,v.country]

}

function opponentVenueAddress(o){
  if(!o)return "";
  return [
    o.home_address_line,
    [o.home_postal_code,o.home_city].filter(Boolean).join(" "),
    o.home_province,
    o.home_country
  ].filter(Boolean).join(", ");
}

function opponentVenueLocation(o){

  return [name,address].filter(Boolean).join(" · ");
}

function medicalDaysToExpiry(date){
  if(!date)return null;
  return Math.ceil(
    (new Date(date+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000
  );
}

function medicalStatus(exam){
  if(!exam)return {label:"Mancante",cls:"red",icon:"☠️"};
  const days=medicalDaysToExpiry(exam.expires_on);
  if(days<0)return {label:"Scaduta",cls:"red",icon:"☠️"};
  if(days<=45)return {label:`Scade tra ${days} gg`,cls:"",icon:"🚨"};
  return {label:"Valida",cls:"green",icon:""};
}

let activeSignalPopover=null;

function hideSignalPopover(){
  activeSignalPopover?.remove();
  activeSignalPopover=null;
}

function showSignalPopover(el){
  hideSignalPopover();

  const label=el.dataset.signalLabel;
  if(!label)return;

  const pop=document.createElement("div");
  pop.className="signal-popover";
  pop.textContent=label;
  document.body.appendChild(pop);

  const rect=el.getBoundingClientRect();
  const pRect=pop.getBoundingClientRect();

  let left=rect.left+rect.width/2-pRect.width/2;
  left=Math.max(8,Math.min(left,window.innerWidth-pRect.width-8));

  let top=rect.top-pRect.height-7;
  if(top<8)top=rect.bottom+7;

  pop.style.left=`${left}px`;
  pop.style.top=`${top}px`;

  activeSignalPopover=pop;
  setTimeout(hideSignalPopover,2200);
}

function wireSignalPopovers(root=document){
  $$("[data-signal-label]",root).forEach(el=>{
    el.onclick=e=>{
      e.stopPropagation();
      showSignalPopover(el);
    };
    el.onkeydown=e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        showSignalPopover(el);
      }
    };
  });
}

function playerAge(birthDate,at=new Date()){
  if(!birthDate)return null;
  const birth=new Date(birthDate+"T00:00:00");
  if(Number.isNaN(birth.getTime()))return null;
  let age=at.getFullYear()-birth.getFullYear();
  const m=at.getMonth()-birth.getMonth();
  if(m<0||(m===0&&at.getDate()<birth.getDate()))age--;
  return age>=0?age:null;
}

function median(values){
  const arr=values.filter(v=>Number.isFinite(v)).sort((a,b)=>a-b);
  if(!arr.length)return null;
  const mid=Math.floor(arr.length/2);
  return arr.length%2?arr[mid]:(arr[mid-1]+arr[mid])/2;
}

function average(values){
  const arr=values.filter(v=>Number.isFinite(v));
  return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
}

function countBy(items,keyFn){
  const map=new Map();
  items.forEach(item=>{
    const key=keyFn(item);
    if(key===null||key===undefined||key==="")return;
    map.set(key,(map.get(key)||0)+1);
  });
  return [...map.entries()].sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0]),"it"));
}

function birthdayDistanceDays(birthDate){
  if(!birthDate)return null;
  const now=new Date(today()+"T00:00:00");
  const b=new Date(birthDate+"T00:00:00");
  let next=new Date(now.getFullYear(),b.getMonth(),b.getDate());
  if(next<now)next=new Date(now.getFullYear()+1,b.getMonth(),b.getDate());
  return Math.round((next-now)/86400000);
}
