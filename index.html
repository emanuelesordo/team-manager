async function pageDashboardStaff(){
  const now=new Date();
  const nowIso=now.toISOString();
  const todayKey=today();
  const in7Key=localDateKey(new Date(now.getTime()+7*86400000));

  const ctx=await dashboardRosterContext();

  const [teamRows,events,medicalRows,feeRows,absenceRows,injuryRows]=await Promise.all([
    must(
      supabase.from("v_team_season_stats")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
    ),
    must(
      supabase.from("events")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
        .gte("start_at",nowIso)
        .order("start_at")
        .limit(60)
    ),
    can("medical.view_all")
      ? must(
          supabase.from("medical_examinations")
            .select("*")
            .eq("team_id",state.team.id)
            .order("issued_date",{ascending:false})
        )
      : Promise.resolve([]),
    can("fees.view_all")||can("fees.manage")
      ? must(
          supabase.from("membership_fees")
            .select("*")
            .eq("team_id",state.team.id)
            .eq("season_id",state.season.id)
            .eq("status","pending")
            .lte("due_date",in7Key)
            .order("due_date")
        )
      : Promise.resolve([]),
    can("absences.view_all")
      ? must(
          supabase.from("player_unavailabilities")
            .select("*")
            .eq("team_id",state.team.id)
            .eq("season_id",state.season.id)
            .eq("status","active")
            .lte("start_date",in7Key)
            .order("start_date")
        )
      : Promise.resolve([]),
    can("injuries.view_all")
      ? must(
          supabase.from("injuries")
            .select("*")
            .eq("team_id",state.team.id)
            .eq("season_id",state.season.id)
            .in("status",["active","recovering"])
            .order("injury_date")
        )
      : Promise.resolve([])
  ]);

  const team=teamRows[0]||{};
  const latestMedical=new Map();

  medicalRows.forEach(x=>{
    if(!latestMedical.has(x.player_id))latestMedical.set(x.player_id,x);
  });

  const medicalAlerts=can("medical.view_all")
    ? ctx.roster.map(p=>{
        const exam=latestMedical.get(p.id);

        if(!exam)return {...p,kind:"missing",days:-999,expires_on:null};

        const days=medicalDaysToExpiry(exam.expires_on);
        if(days===null||days>45)return null;

        return {
          ...p,
          kind:days<0?"expired":"expiring",
          days,
          expires_on:exam.expires_on
        };
      }).filter(Boolean).sort((a,b)=>a.days-b.days)
    : [];

  const feeAlerts=feeRows.map(x=>({
    ...x,
    player:ctx.playerMap.get(x.player_id),
    overdue:x.due_date<todayKey
  }));

  const absences=[
    ...absenceRows.map(x=>({
      player_id:x.player_id,

                <span class="dashboard-health-icon">${x.icon}</span>

                  <strong>${esc(x.label)}</strong>

      <div class="card dashboard-panel dashboard-priority dashboard-span-2">

        </div>
        <div class="dashboard-panel-list">
          ${events.slice(0,14).map(e=>dashboardEventRecord(

            e.event_type==="match"?"⚽":

            p.kind==="expiring"?`<span class="badge yellow">${p.days} gg</span>`:`<span class="badge red">critica</span>`

      <div class="card dashboard-panel clickable-criticality" data-go="cash">

async function pageDashboardPlayer(){
  const now=new Date();
  const nowIso=now.toISOString();
  const todayKey=today();
  const in7Key=localDateKey(new Date(now.getTime()+7*86400000));

  if(!state.myPlayer){
    return pageDashboardFan();
  }

  const ctx=await dashboardRosterContext();
  const me=ctx.players.find(p=>p.id===state.myPlayer.id)||state.myPlayer;

  const [events,exams,fees,absences,injuries,statsRows]=await Promise.all([
    must(
      supabase.from("events")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
        .gte("start_at",nowIso)
        .order("start_at")
        .limit(30)
    ),
    can("medical.view_own")
      ? must(
          supabase.from("medical_examinations")
            .select("*")
            .eq("team_id",state.team.id)
            .eq("player_id",state.myPlayer.id)
            .order("issued_date",{ascending:false})
            .limit(1)
        )
      : Promise.resolve([]),
    can("fees.view_own")
      ? must(
          supabase.from("membership_fees")
            .select("*")
            .eq("team_id",state.team.id)
            .eq("season_id",state.season.id)
            .eq("player_id",state.myPlayer.id)
            .eq("status","pending")
            .order("due_date")
        )
      : Promise.resolve([]),
    can("absences.view_own")
      ? must(
          supabase.from("player_unavailabilities")
            .select("*")
            .eq("team_id",state.team.id)
            .eq("season_id",state.season.id)
            .eq("player_id",state.myPlayer.id)
            .eq("status","active")
            .lte("start_date",in7Key)
            .order("start_date")
        )
      : Promise.resolve([]),
    can("injuries.view_own")
      ? must(
          supabase.from("injuries")
            .select("*")
            .eq("team_id",state.team.id)
            .eq("season_id",state.season.id)
            .eq("player_id",state.myPlayer.id)
            .in("status",["active","recovering"])
        )
      : Promise.resolve([]),
    can("stats.view")
      ? must(
          supabase.from("v_player_season_stats")
            .select("*")
            .eq("team_id",state.team.id)
            .eq("season_id",state.season.id)
            .eq("player_id",state.myPlayer.id)
        )
      : Promise.resolve([])
  ]);

  const exam=exams[0]||null;
  const medicalDays=exam?medicalDaysToExpiry(exam.expires_on):null;
  const medicalCritical=!exam||medicalDays<0;
  const medicalWarning=!medicalCritical&&medicalDays!==null&&medicalDays<=45;

  const overdueFees=fees.filter(x=>x.due_date&&x.due_date<todayKey);
  const currentAbsence=absences.find(x=>x.start_date<=todayKey&&(!x.end_date||x.end_date>=todayKey))||null;
  const injury=injuries[0]||null;
  const stat=statsRows[0]||{};

  const ownCriticalCount=
    (medicalCritical?1:0)
    +(overdueFees.length?1:0)
    +(currentAbsence||injury?1:0);

  const birthdays=dashboardBirthdayRows(ctx.roster);

  const person=(p,meta,side="")=>`
    <div class="dashboard-mini-record">
      <div>
        <div class="dashboard-mini-title">${playerListIdentity(p,ctx.genericMap.get(p?.id),{avatar:false})}</div>
        <div class="muted dashboard-mini-meta">${esc(meta||"")}</div>
      </div>
      ${side?`<div class="dashboard-mini-side">${side}</div>`:""}
    </div>
  `;

  renderShell("Dashboard",`
    <div class="page-title">
      <div>
        <h1>Ciao ${esc(state.profile.first_name||state.profile.display_name||"")}</h1>
        <p>La tua situazione e i prossimi appuntamenti con la squadra.</p>
      </div>
    </div>

    <div class="dashboard-kpis">
      <div class="card ${ownCriticalCount?"dashboard-status-alert":"dashboard-status-ok"}">
        <div class="stat">${ownCriticalCount?`⚠️ ${ownCriticalCount}`:"✅ OK"}</div>
        <div class="stat-label">${ownCriticalCount?"Le tue criticità":"Sei regolarmente disponibile"}</div>
      </div>
      <div class="card"><div class="stat">${stat.appearances||0}</div><div class="stat-label">Presenze</div></div>
      <div class="card"><div class="stat">${stat.goals||0}</div><div class="stat-label">Gol</div></div>
      <div class="card"><div class="stat">${stat.assists||0}</div><div class="stat-label">Assist</div></div>
    </div>

    <div class="dashboard-ops-grid">
      <div class="card dashboard-panel dashboard-priority dashboard-span-2 ${ownCriticalCount?"dashboard-status-alert":"dashboard-status-ok"}">
        <div class="card-head">
          <h3>🧍 La mia situazione</h3>
          <span class="badge ${ownCriticalCount?"red":"green"}">${ownCriticalCount?"da controllare":"regolare"}</span>
        </div>

        <div class="dashboard-panel-list">
          <div class="dashboard-own-alert clickable-criticality ${medicalCritical?"danger":medicalWarning?"warn":"ok"}" data-go="medical">
            <strong>🩺 Visita medica</strong>
            <div class="muted">
              ${!exam
                ?"Visita valida non presente"
                : medicalDays<0
                  ?`Scaduta il ${fmtDate(exam.expires_on)}`
                  :`Valida fino al ${fmtDate(exam.expires_on)}`
              }
            </div>
          </div>

          <div class="dashboard-own-alert clickable-criticality ${overdueFees.length?"danger":fees.length?"warn":"ok"}" data-go="cash">
            <strong>💳 Quote</strong>
            <div class="muted">
              ${overdueFees.length
                ?`${overdueFees.length} pagamento/i scaduto/i`
                : fees.length
                  ?`Prossima scadenza ${fmtDate(fees[0].due_date)}`
                  :"Nessun pagamento aperto"
              }
            </div>
          </div>

          <div class="dashboard-own-alert clickable-criticality ${currentAbsence||injury?"danger":"ok"}" data-go="absences">
            <strong>🚑 Disponibilità</strong>
            <div class="muted">
              ${injury
                ?`Infortunio · ${injury.public_summary||""}`
                : currentAbsence
                  ?`${absenceTypeLabel(currentAbsence.absence_type)}${currentAbsence.reason?` · ${currentAbsence.reason}`:""}`
                  :"Nessuna indisponibilità attuale"
              }
            </div>
          </div>
        </div>
      </div>

      <div class="card dashboard-panel dashboard-priority dashboard-span-2">
        <div class="card-head"><h3>📅 I prossimi appuntamenti</h3><button class="btn btn-sm btn-ghost" data-go="calendar">Calendario</button></div>
        <div class="dashboard-panel-list">
          ${events.slice(0,14).map(e=>dashboardEventRecord(
            e,
            e.event_type==="match"?"⚽":
            e.event_type==="training"?"🏃":
            e.event_type==="meeting"?"🧑‍💼":
            e.event_type==="social"?"🎉":"📌"
          )).join("")||`<div class="empty">Nessun appuntamento programmato</div>`}
        </div>
      </div>

      <div class="card dashboard-panel">
        <div class="card-head"><h3>⚽ Prossime partite</h3><button class="btn btn-sm btn-ghost" data-go="matches">Apri</button></div>
        <div class="dashboard-panel-list">
          ${events.filter(e=>e.event_type==="match").slice(0,8).map(e=>dashboardEventRecord(e,"⚽")).join("")||`<div class="empty">Nessuna partita programmata</div>`}
        </div>
      </div>

      <div class="card dashboard-panel">
        <div class="card-head"><h3>🏃 Allenamenti</h3><button class="btn btn-sm btn-ghost" data-go="trainings">Apri</button></div>
        <div class="dashboard-panel-list">
          ${events.filter(e=>e.event_type==="training").slice(0,8).map(e=>dashboardEventRecord(e,"🏃")).join("")||`<div class="empty">Nessun allenamento programmato</div>`}
        </div>
      </div>

      <div class="card dashboard-panel">
        <div class="card-head"><h3>🎂 Compleanni</h3><span class="badge">${birthdays.length}</span></div>
        <div class="dashboard-panel-list">
          ${birthdays.slice(0,8).map(p=>person(
            p,
            p.birth_date?fmtDate(p.birth_date):"",
            p.days===0?"oggi":p.days===1?"domani":`+${p.days} gg`
          )).join("")||`<div class="empty">Nessun compleanno nei prossimi 30 giorni</div>`}
        </div>
      </div>

      <div class="card dashboard-panel">
        <div class="card-head"><h3>📊 La mia stagione</h3><button class="btn btn-sm btn-ghost" data-go="stats">Statistiche</button></div>
        <div class="dashboard-panel-list">
          <div class="stats-kv"><span>Presenze</span><strong>${stat.appearances||0}</strong></div>
          <div class="stats-kv"><span>Titolare</span><strong>${stat.starts||0}</strong></div>
          <div class="stats-kv"><span>Minuti</span><strong>${stat.minutes||0}</strong></div>
          <div class="stats-kv"><span>Gol</span><strong>${stat.goals||0}</strong></div>
          <div class="stats-kv"><span>Assist</span><strong>${stat.assists||0}</strong></div>
        </div>
      </div>
    </div>
  `);

  $(".shell")?.classList.add("dashboard-page");
  wireDashboardLinks();
}

function normalizeImportText(value){
  return String(value??"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g," ")
    .trim();
}

function importDateToIso(value){
  if(value===null || value===undefined || value==="")return null;

  if(value instanceof Date && !Number.isNaN(value.getTime())){
    const y=value.getFullYear();
    const m=String(value.getMonth()+1).padStart(2,"0");
    const d=String(value.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }

  if(typeof value==="number" && window.XLSX?.SSF?.parse_date_code){
    const parsed=window.XLSX.SSF.parse_date_code(value);
    if(parsed?.y && parsed?.m && parsed?.d){
      return `${parsed.y}-${String(parsed.m).padStart(2,"0")}-${String(parsed.d).padStart(2,"0")}`;
    }
  }

  const text=String(value).trim();
  if(!text)return null;

  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(text)){
    const [y,m,d]=text.split("-").map(Number);
    return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }

  const eu=text.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(eu){
    let [,d,m,y]=eu;
    if(y.length===2)y=Number(y)>=70?`19${y}`:`20${y}`;
    return `${y}-${String(Number(m)).padStart(2,"0")}-${String(Number(d)).padStart(2,"0")}`;
  }

  const parsed=new Date(text);
  if(!Number.isNaN(parsed.getTime())){
    return localDateKey(parsed);
  }

  return "__INVALID__";
}

function normalizeImportedFoot(value){
  const v=normalizeImportText(value);
  if(!v)return null;
  if(["d","dx","destro","destra","right"].includes(v))return "right";
  if(["s","sx","sinistro","sinistra","left"].includes(v))return "left";
  if(["a","ambi","ambidestro","ambidextra","entrambi","both"].includes(v))return "both";
  return "__INVALID__";
}

function importedFootLabel(value){
  return value==="right"?"Destro":value==="left"?"Sinistro":value==="both"?"Entrambi":"—";
}

function parseImportedShirtNumber(value){
  if(value===null || value===undefined || String(value).trim()==="")return null;
  const n=Number(String(value).replace(/[^\d]/g,""));
  return Number.isInteger(n)&&n>=1&&n<=99?n:"__INVALID__";
}

function splitImportedFullName(value,format="first_last"){
  const text=String(value??"").trim().replace(/\s+/g," ");
  if(!text)return {first_name:"",last_name:""};

  if(text.includes(",")){
    const [last,...rest]=text.split(",");
    return {
      first_name:rest.join(",").trim(),
      last_name:last.trim()
    };
  }

  const bits=text.split(" ").filter(Boolean);
  if(bits.length<2)return {first_name:"",last_name:text};

  if(format==="last_first"){
    return {
      last_name:bits[0],
      first_name:bits.slice(1).join(" ")
    };
  }

  return {
    first_name:bits[0],
    last_name:bits.slice(1).join(" ")
  };
}

          const birthRaw=cell(row,"birth_date");
          const birth=birthRaw!==null&&String(birthRaw).trim()!==""?importDateToIso(birthRaw):null;

          const nationality=countryCodeFromValue(cell(row,"nationality_code"));
          const favoriteTeam=String(cell(row,"favorite_team")??"").trim()||null;
          const genericRoleRaw=String(cell(row,"generic_role_manual")??"").trim().toUpperCase();
          const genericRole=genericRoleRaw
            ? ({PORTIERE:"P",DIFENSORE:"D",CENTROCAMPISTA:"C",ATTACCANTE:"A"}[genericRoleRaw]||genericRoleRaw)
            : null;
          const foot=normalizeImportedFoot(cell(row,"preferred_foot"));
          const shirt=parseImportedShirtNumber(cell(row,"shirt_number"));

          const startRaw=cell(row,"start_date");
          const endRaw=cell(row,"end_date");
          const start=startRaw!==null&&String(startRaw).trim()!==""?importDateToIso(startRaw):defaultStart;
          const end=endRaw!==null&&String(endRaw).trim()!==""?importDateToIso(endRaw):defaultEnd;

          const notes=String(cell(row,"notes")??"").trim()||null;

          const rec={
            sourceRow:headerRowIndex+2+index,
            first_name:first,
            last_name:last,
            birth_date:birth,
            nationality_code:nationality,
            favorite_team:favoriteTeam,
            generic_role_manual:genericRole,
            preferred_foot:foot,
            shirt_number:shirt,
            start_date:start,
            end_date:end,
            notes,
            action:"new",
            status:"ok",
            message:"Nuovo calciatore"
          };

          if(!first||!last){
            rec.status="error";
            rec.message="Nome/Cognome mancanti";
          }else if(birth==="__INVALID__"){
            rec.status="error";
            rec.message="Data nascita non valida";
          }else if(nationality==="__INVALID__"){
            rec.status="error";
            rec.message="Nazionalità non riconosciuta";
          }else if(genericRole && !["P","D","C","A"].includes(genericRole)){
            rec.status="error";
            rec.message="Ruolo generico non valido";
          }else if(foot==="__INVALID__"){
            rec.status="error";
            rec.message="Piede non riconosciuto";
          }else if(shirt==="__INVALID__"){
            rec.status="error";
            rec.message="Numero maglia non valido";
          }else if(start==="__INVALID__"||end==="__INVALID__"||!start||!end){
            rec.status="error";
            rec.message="Date permanenza non valide";
          }else if(end<start){
            rec.status="error";
            rec.message="Scadenza precedente all'ingresso";
          }

          const dedupeKey=`${normalizeImportText(first)}|${normalizeImportText(last)}|${birth||""}`;
          if(rec.status==="ok" && seen.has(dedupeKey)){
            rec.status="error";
            rec.message="Duplicato nel file";
          }
          seen.add(dedupeKey);

          if(rec.status==="ok"){
            const existing=resolveExisting(rec);

            if(existing.ambiguous){
              rec.status="error";
              rec.message="Omonimo ambiguo: aggiungi la data di nascita";
            }else if(existing.player){
              rec.existing_player_id=existing.player.id;

              const contract=currentContracts.find(c=>
                c.player_id===existing.player.id
                && c.status!=="cancelled"
              );

              if(contract){
                rec.action="skip";
                rec.status="skip";
                rec.message="Già nella stagione";
              }else{
                rec.action="reuse";
                rec.message="Riusa anagrafica storica";
              }
            }
          }

          importRows.push(rec);
        });

        // Avviso sui numeri maglia duplicati tra righe da importare.
        const numberCounts=new Map();
        importRows.filter(r=>["ok"].includes(r.status)&&typeof r.shirt_number==="number").forEach(r=>{
          numberCounts.set(r.shirt_number,(numberCounts.get(r.shirt_number)||0)+1);
        });
        importRows.forEach(r=>{
          if(r.status==="ok" && r.shirt_number && numberCounts.get(r.shirt_number)>1){
            r.warning=`Numero #${r.shirt_number} ripetuto nel file`;
          }
        });

        const valid=importRows.filter(r=>r.status==="ok").length;
        const reused=importRows.filter(r=>r.status==="ok"&&r.action==="reuse").length;
        const newRows=importRows.filter(r=>r.status==="ok"&&r.action==="new").length;
        const skipped=importRows.filter(r=>r.status==="skip").length;
        const errors=importRows.filter(r=>r.status==="error").length;

        summary.innerHTML=`
          <span class="badge green">${valid} da importare</span>
          <span class="badge">${newRows} nuovi</span>
          <span class="badge blue">${reused} storici da riutilizzare</span>
          ${skipped?`<span class="badge">${skipped} già presenti</span>`:""}
          ${errors?`<span class="badge red">${errors} con errori</span>`:""}
        `;

        preview.innerHTML=importRows.map(r=>{
          const cls=r.status==="error"
            ?"import-status-error"
            : r.status==="skip"
              ?"import-status-skip"
              : r.action==="reuse"
                ?"import-status-reused"
                :"import-status-created";

          return `<tr>
            <td>${r.sourceRow}</td>
            <td><strong>${esc(r.last_name)} ${esc(r.first_name)}</strong>${r.warning?`<div class="muted">${esc(r.warning)}</div>`:""}</td>
            <td>${r.birth_date&&r.birth_date!=="__INVALID__"?fmtDate(r.birth_date):"—"}</td>
            <td>${r.nationality_code&&r.nationality_code!=="__INVALID__"?`${countryFlag(r.nationality_code)} ${esc(r.nationality_code)}`:"—"}</td>
            <td>${esc(r.favorite_team||"—")}</td>
            <td>${esc(r.generic_role_manual||"—")}</td>
            <td>${r.preferred_foot!=="__INVALID__"?esc(importedFootLabel(r.preferred_foot)):"—"}</td>
            <td>${typeof r.shirt_number==="number"?r.shirt_number:"—"}</td>
            <td>${r.start_date!=="__INVALID__"&&r.end_date!=="__INVALID__"?`${fmtDate(r.start_date)} → ${fmtDate(r.end_date)}`:"—"}</td>
            <td class="${cls}"><strong>${esc(r.message)}</strong></td>
          </tr>`;
        }).join("")||`<tr><td colspan="10">Nessuna riga dati</td></tr>`;

        const mappingValid=hasSeparate||hasFull;
        importButton.disabled=!mappingValid||valid===0;
        importButton.textContent=valid?`Importa ${valid} righe`:"Nessuna riga importabile";
      };

      const loadSheet=()=>{
        if(!workbook||!sheetName)return;

        const sheet=workbook.Sheets[sheetName];
        const matrix=window.XLSX.utils.sheet_to_json(sheet,{
          header:1,
          raw:true,
          defval:"",
          blankrows:false
        });

        const nonEmpty=matrix
          .map((row,i)=>({row,i}))
          .filter(x=>x.row.some(v=>String(v??"").trim()!==""));

        if(!nonEmpty.length)throw new Error("Il foglio è vuoto");

        headerSelect.innerHTML=nonEmpty.slice(0,10).map(x=>
          `<option value="${x.i}">Riga ${x.i+1}: ${esc(x.row.slice(0,5).map(v=>String(v)).join(" · "))}</option>`
        ).join("");

        // Di default usa la prima riga non vuota come intestazione.
        headerRowIndex=nonEmpty[0].i;
        headerSelect.value=String(headerRowIndex);

        const applyHeaderRow=()=>{
          headerRowIndex=Number(headerSelect.value);
          const headerRow=matrix[headerRowIndex]||[];

          let lastIndex=headerRow.length-1;
          while(lastIndex>=0 && String(headerRow[lastIndex]??"").trim()==="")lastIndex--;

          headers=headerRow.slice(0,lastIndex+1).map((v,i)=>String(v??"").trim()||`Colonna ${i+1}`);
          sourceRows=matrix
            .slice(headerRowIndex+1)
            .map(row=>row.slice(0,headers.length))
            .filter(row=>row.some(v=>String(v??"").trim()!==""));

          autoMap();
          renderMapping();
          analyze();
        };

        headerSelect.onchange=applyHeaderRow;
        applyHeaderRow();
      };

      const openWorkbookFile=async file=>{
        if(!file)return;

        const ext=file.name.split(".").pop()?.toLowerCase();
        if(!["xlsx","xls","csv"].includes(ext)){
          throw new Error("Formato non supportato: usa XLSX, XLS o CSV");
        }

        const buffer=await file.arrayBuffer();
        workbook=window.XLSX.read(buffer,{
          type:"array",
          cellDates:true
        });

        if(!workbook.SheetNames?.length)throw new Error("Nessun foglio trovato nel file");

        sheetSelect.innerHTML=workbook.SheetNames.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join("");
        sheetName=workbook.SheetNames[0];
        sheetSelect.value=sheetName;
        sheetSelect.onchange=()=>{
          sheetName=sheetSelect.value;
          loadSheet();
        };

        config.classList.remove("hidden");
        resultBox.textContent=`File: ${file.name}`;
        loadSheet();
      };

      $("#choose-roster-file",root).onclick=()=>fileInput.click();
      $("#download-roster-template",root).onclick=downloadRosterImportTemplate;
      fileInput.onchange=async()=>{
        try{
          await openWorkbookFile(fileInput.files?.[0]);
        }catch(err){
          toast(err.message,"error");
        }
      };

      drop.addEventListener("dragover",e=>{
        e.preventDefault();
        drop.classList.add("drag-over");
      });
      drop.addEventListener("dragleave",()=>drop.classList.remove("drag-over"));
      drop.addEventListener("drop",async e=>{
        e.preventDefault();
        drop.classList.remove("drag-over");
        try{
          await openWorkbookFile(e.dataTransfer.files?.[0]);
        }catch(err){
          toast(err.message,"error");
        }
      });

      $("#full-name-format",root).onchange=analyze;
      $("#import-default-start",root).onchange=analyze;
      $("#import-default-end",root).onchange=analyze;

      importButton.onclick=async()=>{
        const rows=importRows.filter(r=>r.status==="ok");
        if(!rows.length)return;

        if(!confirm(`Importare ${rows.length} calciatori nella rosa ${state.season.name}?`))return;

        importButton.disabled=true;
        progress.classList.remove("hidden");
        progressBar.style.width="0%";

        const results=[];
        let done=0;

        for(const row of rows){
          try{
            const response=await must(
              supabase.rpc("import_roster_player_extended_v2",{
                p_team_id:state.team.id,
                p_season_id:state.season.id,
                p_first_name:row.first_name,
                p_last_name:row.last_name,
                p_birth_date:row.birth_date||null,
                p_preferred_foot:row.preferred_foot||null,
                p_start_date:row.start_date,
                p_end_date:row.end_date,
                p_shirt_number:typeof row.shirt_number==="number"?row.shirt_number:null,
                p_notes:row.notes,
                p_nationality_code:row.nationality_code||null,
                p_favorite_team:row.favorite_team||null,
                p_generic_role_manual:row.generic_role_manual||null
              })
            );

            const result=Array.isArray(response)?response[0]:response;
            results.push({
              row,
              ok:true,
              code:result?.result_code||"imported"
            });
          }catch(err){
            results.push({
              row,
              ok:false,
              error:err.message
            });
          }

          done++;
          progressBar.style.width=`${Math.round(done/rows.length*100)}%`;
          resultBox.textContent=`Importazione ${done}/${rows.length}…`;
        }

        const ok=results.filter(x=>x.ok).length;
        const failed=results.filter(x=>!x.ok);

        resultBox.innerHTML=`
          <strong>${ok} righe elaborate correttamente.</strong>
          ${failed.length
            ? `<div class="danger" style="margin-top:6px">${failed.length} errori: ${failed.slice(0,5).map(x=>`riga ${x.row.sourceRow}: ${esc(x.error)}`).join(" · ")}</div>`
            : ""
          }
        `;

        if(ok){
          toast(`Import rosa completato: ${ok} righe`,"ok");
        }
        if(failed.length){
          toast(`${failed.length} righe non importate`,"error");
        }

        importButton.textContent="Aggiorna Rosa";
        importButton.disabled=false;
        importButton.onclick=()=>{
          closeModal();
          pageRoster();
        };
      };
    });

  }catch(err){
    toast(err.message,"error");
  }
}

/* =========================================================
   ROSA / CALCIATORI / CONTRATTI
========================================================= */
async function pageRoster(){
  await syncMedicalAbsencesSafe();
  const settings=await getRosterSettings();

  const [
    players,
    rosterHistory,
    affinities,
    genericRoles,
    statusIndicators,
    nextSeasonRows,
    myLinkRequests
  ]=await Promise.all([
    must(supabase.from("players").select("*").eq("team_id",state.team.id).order("last_name")),
    must(supabase.rpc("get_season_roster_history",{p_team_id:state.team.id,p_season_id:state.season.id})),
    must(supabase.rpc("get_roster_position_affinities",{p_team_id:state.team.id,p_season_id:state.season.id})),
    must(supabase.rpc("get_roster_generic_roles",{p_team_id:state.team.id,p_season_id:state.season.id})),
    must(supabase.rpc("get_roster_status_indicators",{p_team_id:state.team.id,p_season_id:state.season.id,p_at:today()})),
    must(supabase.rpc("get_roster_next_season_status",{p_team_id:state.team.id,p_season_id:state.season.id})),
    must(supabase.from("player_link_requests").select("*").eq("team_id",state.team.id).eq("profile_id",state.profile.id).order("requested_at",{ascending:false}))
  ]);

  const linkedSelf=players.find(p=>p.profile_id===state.profile.id)||null;
  const previousLinkedPlayerId=state.myPlayer?.id||null;
  if(previousLinkedPlayerId!==(linkedSelf?.id||null)){
    state.myPlayer=linkedSelf;
    state.roles=(await must(supabase.rpc("get_my_effective_roles",{p_team_id:state.team.id}))).map(x=>x.role_code);
    state.permissions=new Set((await must(supabase.rpc("get_my_permissions",{p_team_id:state.team.id}))).map(x=>x.permission_key));
    if(!previousLinkedPlayerId&&linkedSelf&&hasRole("player")){
      setTimeout(()=>runPlayerOnboarding(),0);
    }
  }

  const fanOnly=!state.isSuperAdmin
    && state.roles.length>0
    && state.roles.every(r=>r==="fan");

  const pendingLink=myLinkRequests.find(r=>r.status==="pending")||null;
  const pendingPlayer=pendingLink?players.find(p=>p.id===pendingLink.player_id):null;

  const amap=new Map();
  affinities.forEach(a=>{
    if(!amap.has(a.player_id))amap.set(a.player_id,[]);
    amap.get(a.player_id).push(a);
  });

  const gmap=new Map(genericRoles.map(x=>[x.player_id,x]));
  const simap=new Map(statusIndicators.map(x=>[x.player_id,x]));
  const nextMap=new Map();
  nextSeasonRows.forEach(row=>{
    if(!nextMap.has(row.player_id))nextMap.set(row.player_id,row);
  });

  const canSeeMedicalFor=p=>
    !fanOnly
    && (can("medical.view_all")||(can("medical.view_own")&&p.profile_id===state.profile.id));

  const makeSignals=(p,indicator,next)=>{
    const signals=[];
    let severity=0;

    if(fanOnly){
      if(indicator?.generic_unavailable){
        signals.push(signalHtml("❌","Indisponibile"));
        severity=50;
      }
      return {html:signals.length?signals.join(""):`<span class="muted">—</span>`,severity};
    }

    if(indicator?.injury_active){
      signals.push(signalHtml("✚","Infortunato","injury"));
      severity+=50;
    }

    const absence=absenceSignal(indicator?.absence_type);
    if(absence){
      signals.push(signalHtml(absence.icon,absence.label));
      severity+=40;
    }

    if(indicator?.financial_pending && indicator?.absence_type!=="fee_overdue"){
      signals.push(signalHtml("💰","Multa o pagamento scaduto"));
      severity+=30;
    }

    if(canSeeMedicalFor(p)){
      const days=medicalDaysToExpiry(indicator?.medical_expires_on);
      if(!indicator?.medical_expires_on||days<0){
        signals.push(signalHtml("☠️",indicator?.medical_expires_on?"Visita medica scaduta":"Visita medica mancante"));
        severity+=20;
      }else if(days<=45){
        signals.push(signalHtml("🚨",`Visita medica in scadenza tra ${days} giorni`));
        severity+=10;
      }
    }

    if(next?.next_season_confirmed){
      signals.push(signalHtml("✅","Confermato anche per la prossima stagione"));
    }

    return {html:signals.length?signals.join(""):`<span class="muted">—</span>`,severity};
  };

  const data=players.map(p=>{
    const pcs=rosterHistory.filter(c=>c.player_id===p.id);
    if(!pcs.length)return null;

    const active=pcs.some(c=>
      c.roster_status==="active"
      && today()>=c.start_date
      && today()<=(c.actual_end_date||c.planned_end_date)
    );

    const last=pcs[pcs.length-1];
    const roles=amap.get(p.id)||[];
    const generic=gmap.get(p.id)||{};
    const indicator=simap.get(p.id)||{};
    const next=nextMap.get(p.id)||{};
    const signals=makeSignals(p,indicator,next);
    const medicalExpiry=canSeeMedicalFor(p)?indicator.medical_expires_on:null;
    const age=playerAge(p.birth_date);

    let associationAction="";
    if(state.myPlayer?.id===p.id){
      associationAction=`<span class="badge green" title="Account associato">Io</span>`;
    }else if(!state.myPlayer&&can("player_link.request")&&!p.profile_id){
      if(pendingLink?.player_id===p.id){
        associationAction=`<span class="badge" title="Richiesta in attesa">…</span>`;
      }else if(!pendingLink){
        associationAction=`<button class="btn btn-sm roster-action-btn" data-claim-player="${p.id}" title="Sono io">👤</button>`;
      }
    }

    return {
      p,last,active,roles,generic,indicator,next,signals,associationAction,medicalExpiry,age,
      sort:{
        generic:generic.generic_role_code||"Z",
        name:`${p.last_name} ${p.first_name}`,
        age:age??999,
        shirt:last.shirt_number??999,
        birth:p.birth_date||"9999-12-31",
        nationality:countryName(p.nationality_code)||"ZZZ",
        favorite:p.favorite_team||"ZZZ",
        roles:roles[0]?.position_code||"ZZZ",
        medical:medicalExpiry||"9999-12-31",
        signals:signals.severity,
        permanence:last.start_date||"9999-12-31",
        next:next.next_season_confirmed?1:0
      }
    };
  }).filter(Boolean);

  const sort=state.rosterSort||{key:"generic",dir:"asc"};
  data.sort((a,b)=>{
    const result=compareRosterValues(a,b,sort.key);
    if(result!==0)return sort.dir==="asc"?result:-result;
    return a.sort.name.localeCompare(b.sort.name,"it",{sensitivity:"base"});
  });

  const showNextColumn=!settings.show_contract_period&&(can("contracts.view")||can("contracts.manage"));
  const showPreferred=!fanOnly;

  const rows=data.map(row=>{
    const {p,last,active,roles,generic,next,signals,associationAction,medicalExpiry,age}=row;
    const genericCode=generic.generic_role_code||"—";
    const genericTitle=generic.generic_role_code
      ? `${genericRoleLabel(generic.generic_role_code)}${generic.source==="manual"?" · generico manuale":" · predominante"}`
      : "Ruolo generico non impostato";

    return `<tr class="${active?"":"roster-row-inactive"}">
      <td class="roster-col-role">
        <span class="roster-generic-role ${genericCode!=="—"?`role-${genericCode}`:"role-empty"}" title="${esc(genericTitle)}">${esc(genericCode)}</span>
      </td>

      <td class="roster-col-name roster-name-cell">
        <div class="roster-player-link" data-player="${p.id}" role="button" tabindex="0">
          <span class="avatar">${p.photo_url?`<img src="${esc(p.photo_url)}">`:initials(p.first_name,p.last_name)}</span>
          <span>
            <span class="roster-surname">${esc(p.last_name)}</span>
            <span class="roster-firstname"> ${esc(p.first_name)}</span>
          </span>
        </div>
      </td>

      <td class="roster-col-age roster-age">${age??"—"}</td>

      ${settings.show_shirt_numbers?`<td class="roster-mobile-hide roster-col-shirt">${last.shirt_number||"—"}</td>`:""}
      <td class="roster-mobile-hide roster-col-birth">${p.birth_date?shortDate(p.birth_date):"—"}</td>

      <td class="roster-col-nation">
        ${p.nationality_code
          ? `<span class="roster-flag" title="${esc(countryName(p.nationality_code))}">${countryFlag(p.nationality_code)}</span>`
          : "—"
        }
      </td>

      <td class="roster-mobile-hide roster-col-favorite"><span class="roster-favorite" title="${esc(p.favorite_team||"")}">${esc(p.favorite_team||"—")}</span></td>

      ${showPreferred?`
        <td class="roster-mobile-hide roster-preferred-cell roster-col-preferred">
          ${roles.length
            ? roles.map(r=>`<span class="badge ${r.role_rank===1?"green":""}">${esc(r.position_code)} ${r.affinity_percent}%</span>`).join(" ")
            : `<span class="roster-role-empty">—</span>`
          }
        </td>
      `:""}

      <td class="roster-mobile-hide roster-col-medical">${medicalExpiry?shortDate(medicalExpiry):"—"}</td>
      <td class="roster-col-signals"><div class="roster-signals">${signals.html}</div></td>

      ${settings.show_contract_period
        ? `<td class="roster-mobile-hide roster-col-permanence">
            <span class="roster-period">${shortDate(last.start_date)}–${shortDate(last.actual_end_date||last.planned_end_date)}</span>
            ${active?"":`<span class="badge red">${esc(last.roster_status)}</span>`}
          </td>`
        : ""
      }

      ${showNextColumn
        ? `<td class="roster-mobile-hide roster-col-next">${next.next_season_confirmed
            ? `<span class="next-season-confirmed">✅ Confermato</span>`
            : "—"
          }</td>`
        : ""
      }

      <td class="roster-col-actions">
        <div class="roster-row-actions">
          ${associationAction}
          ${can("roster.manage")
            ? `<button class="btn btn-sm roster-action-btn" data-edit-player="${p.id}" title="Modifica">✎</button>`
            : ""
          }
          ${can("affinity.evaluate_players")&&!fanOnly
            ? `<button class="btn btn-sm roster-action-btn" data-eval="${p.id}" title="Valuta ruoli">◎</button>`
            : ""
          }
        </div>
      </td>
    </tr>`;
  }).join("");

  const pendingNotice=pendingLink
    ? `<div class="section-note" style="margin-bottom:8px;padding:7px 10px">
        Richiesta associazione: <strong>${esc(pendingPlayer?`${pendingPlayer.last_name} ${pendingPlayer.first_name}`:"calciatore")}</strong> · in attesa
        <button class="btn btn-sm btn-ghost" id="cancel-player-link" style="margin-left:8px">Annulla</button>
      </div>`
    : "";

  const headers=[
    rosterSortHeader("Ruolo","generic","roster-col-role"),
    rosterSortHeader("Calciatore","name","roster-col-name"),
    rosterSortHeader("Età","age","roster-col-age"),
    settings.show_shirt_numbers?rosterSortHeader("#","shirt","roster-mobile-hide roster-col-shirt"):"",
    rosterSortHeader("Nascita","birth","roster-mobile-hide roster-col-birth"),
    rosterSortHeader("Naz.","nationality","roster-col-nation"),
    rosterSortHeader("Tifata","favorite","roster-mobile-hide roster-col-favorite"),
    showPreferred?rosterSortHeader("Ruoli","roles","roster-mobile-hide roster-col-preferred"):"",
    rosterSortHeader("Visita","medical","roster-mobile-hide roster-col-medical"),
    rosterSortHeader("Segn.","signals","roster-col-signals"),
    settings.show_contract_period?rosterSortHeader("Permanenza","permanence","roster-mobile-hide roster-col-permanence"):"",
    showNextColumn?rosterSortHeader("Pross.","next","roster-mobile-hide roster-col-next"):"",
    `<th class="roster-col-actions">Azioni</th>`
  ].join("");

  const columnCount=headers.split("<th").length-1;

  renderShell("Rosa",`
    <div class="page-title">
      <div><h1>Rosa ${esc(state.season.name)}</h1></div>
      <div class="actions">
        ${can("roster.setup")?`<button class="btn" id="roster-setup">⚙ Setup Rosa</button>`:""}
        ${can("roster.manage")&&can("contracts.manage")?`<button class="btn" id="import-roster">⇧ Import</button>`:""}
        ${can("roster.manage")?`<button class="btn btn-primary" id="new-player">Nuovo calciatore</button>`:""}
        ${state.myPlayer&&can("affinity.evaluate_self")&&!fanOnly?`<button class="btn" id="my-affinity">I miei ruoli</button>`:""}
      </div>
    </div>

    ${pendingNotice}

    <div class="roster-table-wrap">
      <table class="table roster-table">
        <thead><tr>${headers}</tr></thead>
        <tbody>${rows||`<tr><td colspan="${columnCount}">Nessun calciatore in questa stagione</td></tr>`}</tbody>
      </table>
    </div>
  `);

  $(".shell")?.classList.add("roster-page");
  wireSignalPopovers($(".roster-table-wrap"));

  $$("[data-roster-sort]").forEach(th=>th.onclick=()=>{
    const key=th.dataset.rosterSort;
    if(state.rosterSort?.key===key){
      state.rosterSort.dir=state.rosterSort.dir==="asc"?"desc":"asc";
    }else{
      state.rosterSort={key,dir:"asc"};
    }
    pageRoster();
  });

  $$("[data-player]").forEach(b=>{
    b.onclick=()=>route(`player/${b.dataset.player}`);
    b.onkeydown=e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        route(`player/${b.dataset.player}`);
      }
    };
  });

  $("#roster-setup")?.addEventListener("click",openRosterSetup);
  $("#my-affinity")?.addEventListener("click",()=>openAffinityAssessment(state.myPlayer,"self"));

  $$("[data-edit-player]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    openEditRosterPlayer(b.dataset.editPlayer);
  });

  $$("[data-claim-player]").forEach(b=>b.onclick=async()=>{
    const player=players.find(p=>p.id===b.dataset.claimPlayer);
    if(!player)return;
    if(!confirm(`Confermi di essere ${player.first_name} ${player.last_name}?`))return;

    try{
      await must(supabase.rpc("request_player_link",{p_team_id:state.team.id,p_player_id:player.id}));
      toast("Richiesta inviata","ok");
      pageRoster();
    }catch(err){toast(err.message,"error")}
  });

  $("#cancel-player-link")?.addEventListener("click",async()=>{
    if(!pendingLink)return;
    try{
      await must(supabase.rpc("cancel_player_link_request",{p_request_id:pendingLink.id}));
      toast("Richiesta annullata","ok");
      pageRoster();
    }catch(err){toast(err.message,"error")}
  });

  $$("[data-eval]").forEach(b=>b.onclick=async()=>{
    const p=players.find(x=>x.id===b.dataset.eval);
    let kind=hasRole("coach")?"coach":hasRole("assistant_coach")?"assistant_coach":null;
    if(hasRole("coach")&&hasRole("assistant_coach")){
      kind=prompt("Valutare come 'coach' o 'assistant_coach'?","coach");
    }
    if(kind)openAffinityAssessment(p,kind);
  });

  $("#import-roster")?.addEventListener("click",openRosterImport);
  $("#new-player")?.addEventListener("click",()=>openNewPlayer());
}

async function openEditRosterPlayer(playerId){
  try{
    const settings=await getRosterSettings();
    const favoriteClubs=await loadFavoriteClubs();

    const [player,contacts,contracts,exams,medicalAppointments]=await Promise.all([
      must(supabase.from("players").select("*").eq("id",playerId).eq("team_id",state.team.id).single()),
      ((can("roster.manage")&&settings.show_contact_options)||can("medical.manage"))
        ? must(supabase.from("player_contacts").select("*").eq("player_id",playerId).maybeSingle())
        : Promise.resolve(null),
      can("contracts.manage")
        ? must(supabase.from("player_contracts").select("*").eq("player_id",playerId).eq("season_id",state.season.id).order("start_date",{ascending:false}))
        : Promise.resolve([]),
      (can("medical.view_all")||can("medical.manage"))
        ? must(supabase.from("medical_examinations").select("*").eq("team_id",state.team.id).eq("player_id",playerId).lte("issued_date",today()).order("issued_date",{ascending:false}).limit(1))
        : Promise.resolve([]),
      can("medical.manage")
        ? must(
            supabase.from("medical_appointments")
              .select("*")
              .eq("team_id",state.team.id)
              .eq("player_id",playerId)
              .eq("status","scheduled")
              .order("scheduled_for",{ascending:true})
              .limit(1)
          )
        : Promise.resolve([])
    ]);

    const currentContract=contracts.find(c=>c.status!=="cancelled")||contracts[0]||null;
    const latestExam=exams[0]||null;
    const scheduledExam=medicalAppointments[0]||null;

    showModal(`Modifica · ${player.first_name} ${player.last_name}`,`
      <form id="edit-roster-player-form">
        <h3>Anagrafica</h3>

        <div class="form-grid">
          <div class="field"><label>Nome</label><input id="erp-first" value="${esc(player.first_name)}" required></div>
          <div class="field"><label>Cognome</label><input id="erp-last" value="${esc(player.last_name)}" required></div>
        </div>

        <div class="form-grid">
          <div class="field"><label>Data di nascita</label><input id="erp-birth" type="date" value="${player.birth_date||""}"></div>
          <div class="field"><label>Nazionalità</label><select id="erp-nationality">${countryOptions(player.nationality_code)}</select></div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Piede</label>
            <select id="erp-foot">
              <option value="">—</option>
              <option value="right" ${player.preferred_foot==="right"?"selected":""}>Destro</option>
              <option value="left" ${player.preferred_foot==="left"?"selected":""}>Sinistro</option>
              <option value="both" ${player.preferred_foot==="both"?"selected":""}>Entrambi</option>
            </select>
          </div>
          <div class="field">
            <label>Squadra tifata</label>
            <input id="erp-favorite" list="erp-favorite-clubs" value="${esc(player.favorite_team||"")}" placeholder="es. Padova">
            ${favoriteClubsDatalist(favoriteClubs,"erp-favorite-clubs")}
          </div>
        </div>

        <div class="field">
          <label>Ruolo generico</label>
          <select id="erp-generic-role">${genericRoleOptions(player.generic_role_manual||"")}</select>
          <div class="muted" style="margin-top:5px">Usato finché non esiste un ruolo preferenziale calcolato oltre il 50%.</div>
        </div>
        <div class="field">
          <label>Altezza (cm)</label>
          <input id="erp-height" type="number" min="100" max="250" value="${player.height_cm||""}">
        </div>

        ${settings.show_contact_options?`
          <div class="field"><label>Telefono</label><input id="erp-phone" type="tel" value="${esc(contacts?.phone||"")}" placeholder="+39 ..."></div>
        `:""}

        ${currentContract&&can("contracts.manage")?`
          <h3>Permanenza ${esc(state.season.name)}</h3>

          <div class="form-grid">
            <div class="field"><label>Data ingresso</label><input id="erp-start" type="date" value="${currentContract.start_date}" required></div>
            <div class="field"><label>Scadenza</label><input id="erp-end" type="date" value="${currentContract.actual_end_date||currentContract.planned_end_date}" required></div>
          </div>

          <div class="field"><label>Numero maglia</label><input id="erp-shirt" type="number" min="1" max="99" value="${currentContract.shirt_number||""}"></div>

          <label class="check">
            <input id="erp-next-season" type="checkbox" ${currentContract.next_season_confirmed?"checked":""}>
            Presente anche la prossima stagione
          </label>
          <div class="muted" style="margin:5px 0 12px">
            Conferma gestionale; la permanenza della nuova stagione verrà creata separatamente.
          </div>
        `:""}

        ${can("medical.manage")?`
          <h3>Visita medica</h3>
          <div class="form-grid">
            <div class="field">
              <label>Scadenza ultimo certificato</label>
              <input value="${latestExam?.expires_on?fmtDate(latestExam.expires_on):"Nessun certificato valido registrato"}" disabled>
            </div>
            <div class="field">
              <label>Prossima visita programmata</label>
              <input id="erp-medical-scheduled" type="date" value="${scheduledExam?.scheduled_for||""}">
            </div>
          </div>
          <div class="muted" style="margin-top:-6px;margin-bottom:8px">
            La data programmata non abilita il calciatore: deve essere confermata come svolta nel menu Visite mediche.
          </div>

          <div class="field">
            <label>Scadenza dichiarata dal calciatore</label>
            <input value="${contacts?.self_reported_medical_expires_on?fmtDate(contacts.self_reported_medical_expires_on):"—"}" disabled>
          </div>
        `:""}

        <button class="btn btn-primary">Salva modifiche</button>
      </form>
    `,root=>{
      root.closest(".modal").style.width="min(780px,100%)";

      const medicalScheduled=$("#erp-medical-scheduled",root);

      $("#edit-roster-player-form",root).onsubmit=async e=>{
        e.preventDefault();
        try{
          await must(
            supabase.rpc("update_player_details",{
              p_team_id:state.team.id,
              p_player_id:playerId,
              p_first_name:$("#erp-first",root).value,
              p_last_name:$("#erp-last",root).value,
              p_birth_date:$("#erp-birth",root).value||null,
              p_preferred_foot:$("#erp-foot",root).value||null,
              p_phone:settings.show_contact_options?($("#erp-phone",root)?.value.trim()||null):null,
              p_nationality_code:$("#erp-nationality",root).value||null,
              p_favorite_team:$("#erp-favorite",root).value.trim()||null,
              p_generic_role_manual:$("#erp-generic-role",root).value||null,
              p_height_cm:Number($("#erp-height",root).value)||null
            })
          );

          if(currentContract&&can("contracts.manage")){
            await must(
              supabase.rpc("update_player_contract_details",{
                p_contract_id:currentContract.id,
                p_start_date:$("#erp-start",root).value,
                p_end_date:$("#erp-end",root).value,
                p_shirt_number:Number($("#erp-shirt",root).value)||null
              })
            );

            const nextChecked=$("#erp-next-season",root).checked;
            if(nextChecked!==!!currentContract.next_season_confirmed){
              await must(
                supabase.rpc("set_player_next_season_confirmation",{
                  p_contract_id:currentContract.id,
                  p_confirmed:nextChecked
                })
              );
            }
          }

          if(can("medical.manage")&&medicalScheduled){
            const newDate=medicalScheduled.value||null;
            const oldDate=scheduledExam?.scheduled_for||null;

            if(newDate!==oldDate){
              if(newDate){
                await must(
                  supabase.rpc("schedule_medical_appointment",{
                    p_team_id:state.team.id,
                    p_season_id:state.season.id,
                    p_player_id:playerId,
                    p_scheduled_for:newDate,
                    p_examination_type:scheduledExam?.examination_type||"competitive",
                    p_provider:scheduledExam?.provider||null,
                    p_notes:scheduledExam?.notes||null
                  })
                );
              }else if(scheduledExam){
                await must(
                  supabase.rpc("resolve_medical_appointment",{
                    p_appointment_id:scheduledExam.id,
                    p_result:"cancelled",
                    p_actual_date:null,
                    p_provider:null,
                    p_certificate_number:null,
                    p_notes:"Programmazione rimossa dalla scheda calciatore"
                  })
                );
              }
            }
          }

          closeModal();
          toast("Calciatore aggiornato","ok");
          pageRoster();
        }catch(err){
          toast(err.message,"error");
        }
      };
    });
  }catch(err){
    toast(err.message,"error");
  }
}

async function pagePlayer(id){
  const settings=await getRosterSettings();
  const p=await must(supabase.from("players").select("*").eq("id",id).single());
  const fanOnly=!state.isSuperAdmin&&state.roles.length>0&&state.roles.every(r=>r==="fan");

  const [contracts,statsRows,pos,affinity,genericRows,contacts,exams]=await Promise.all([
    must(supabase.from("player_contracts").select("*").eq("player_id",id).order("start_date",{ascending:false})),
    must(supabase.from("v_player_season_stats").select("*").eq("player_id",id).eq("season_id",state.season.id)),
    must(supabase.from("v_player_position_minutes").select("*").eq("player_id",id).eq("season_id",state.season.id).order("minutes",{ascending:false})),
    must(supabase.rpc("get_roster_position_affinities",{p_team_id:state.team.id,p_season_id:state.season.id})),
    must(supabase.rpc("get_roster_generic_roles",{p_team_id:state.team.id,p_season_id:state.season.id})),
    can("roster.manage")&&settings.show_contact_options&&!fanOnly
      ? must(supabase.from("player_contacts").select("*").eq("player_id",id).maybeSingle())
      : Promise.resolve(null),
    (!fanOnly&&(can("medical.view_all")||(can("medical.view_own")&&p.profile_id===state.profile.id)))
      ? must(supabase.from("medical_examinations").select("*").eq("team_id",state.team.id).eq("player_id",id).lte("issued_date",today()).order("issued_date",{ascending:false}).limit(1))
      : Promise.resolve([])
  ]);

  const stats=statsRows[0]||{};
  const roles=affinity.filter(a=>a.player_id===id);
  const generic=genericRows.find(x=>x.player_id===id)||{};
  const exam=exams[0]||null;

  const metaCards=[
    `<div class="card"><div class="stat-label">Nascita</div><strong>${p.birth_date?fmtDate(p.birth_date):"—"}</strong></div>`,
    `<div class="card"><div class="stat-label">Nazionalità</div><strong>${p.nationality_code?`${countryFlag(p.nationality_code)} ${esc(countryName(p.nationality_code))}`:"—"}</strong></div>`,
    `<div class="card"><div class="stat-label">Squadra tifata</div><strong>${esc(p.favorite_team||"—")}</strong></div>`,
    `<div class="card"><div class="stat-label">Piede</div><strong>${esc(playerFootLabel(p.preferred_foot))}</strong></div>`,
    `<div class="card"><div class="stat-label">Altezza</div><strong>${p.height_cm?`${p.height_cm} cm`:"—"}</strong></div>`,
    settings.show_contact_options
      ? `<div class="card"><div class="stat-label">Telefono</div><strong>${esc(contacts?.phone||"—")}</strong></div>`
      : "",
    !fanOnly
      ? `<div class="card"><div class="stat-label">Visita medica</div><strong>${exam?`${fmtDate(exam.issued_date)} → ${fmtDate(exam.expires_on)}`:"—"}</strong></div>`
      : ""
  ].filter(Boolean).join("");

  renderShell(`${p.first_name} ${p.last_name}`,`
    <div class="page-title">
      <div>
        <h1>${esc(p.first_name)} ${esc(p.last_name)}</h1>
        <div class="actions">
          ${fanOnly
            ? (generic.generic_role_code?`<span class="badge green">${esc(generic.generic_role_code)} · ${esc(genericRoleLabel(generic.generic_role_code))}</span>`:"")
            : roles.map(r=>`<span class="badge green">${esc(r.position_code)} ${r.affinity_percent}%</span>`).join("")
          }
        </div>
      </div>
      <div class="actions">
        ${can("roster.manage")?`<button class="btn" id="edit-player-detail">✎ Modifica</button>`:""}
        <button class="btn" data-back>← Rosa</button>
      </div>
    </div>

    <div class="player-detail-meta">${metaCards}</div>

    <div style="height:14px"></div>

    <div class="grid grid-4">
      <div class="card"><div class="stat">${stats.appearances||0}</div><div class="stat-label">Presenze</div></div>
      <div class="card"><div class="stat">${stats.minutes||0}</div><div class="stat-label">Minuti</div></div>
      <div class="card"><div class="stat">${stats.goals||0}</div><div class="stat-label">Gol</div></div>
      <div class="card"><div class="stat">${stats.assists||0}</div><div class="stat-label">Assist</div></div>
    </div>

    <div style="height:14px"></div>

    <div class="grid grid-2">
      <div class="card">
        <h2>Permanenze</h2>
        <div class="list">
          ${contracts.map(c=>`<div class="list-item">
            <div>
              ${fmtDate(c.start_date)} → ${fmtDate(c.actual_end_date||c.planned_end_date)}
              <div class="muted">${esc(c.status)} · #${c.shirt_number||"—"} ${c.next_season_confirmed?"· ✅ prossima stagione":""}</div>
            </div>
            ${can("contracts.manage")&&c.status==="active"?`<button class="btn btn-sm btn-danger" data-term="${c.id}">Termina</button>`:""}
          </div>`).join("")||`<div class="empty">Nessuna permanenza</div>`}
        </div>
      </div>

      <div class="card">
        <h2>Minuti per ruolo</h2>
        <div class="list">
          ${pos.map(x=>`<div class="list-item"><strong>${esc(x.position_code)}</strong><span>${x.minutes} min</span></div>`).join("")||`<div class="empty">Nessun dato</div>`}
        </div>
      </div>
    </div>
  `);

  $("[data-back]").onclick=()=>route("roster");
  $("#edit-player-detail")?.addEventListener("click",()=>openEditRosterPlayer(id));

  $$("[data-term]").forEach(b=>b.onclick=async()=>{
    const d=prompt("Data uscita (AAAA-MM-GG)",today());
    if(!d)return;
    try{
      await must(
        supabase.rpc("terminate_player_contract",{
          p_contract_id:b.dataset.term,
          p_actual_end_date:d,
          p_notes:null
        })
      );
      toast("Permanenza terminata","ok");
      pagePlayer(id);
    }catch(err){
      toast(err.message,"error");
    }
  });
}

async function saveCalendarView(view){
  state.preferences={...(state.preferences||{}),profile_id:state.profile.id,calendar_view:view};
  try{
    await must(
      supabase.from("user_preferences")
        .upsert({
          profile_id:state.profile.id,
          calendar_view:view
        },{onConflict:"profile_id"})
    );
  }catch(err){
    console.warn("Impossibile salvare preferenza calendario",err);
  }
}

function calendarEventRow(event,extra=""){
  const d=calendarDateParts(event.start_at);
  return `<div class="calendar-event-row" data-event="${event.id}">
    <div class="calendar-date-tile">
      <div class="calendar-date-day">${d.day}</div>
      <div class="calendar-date-month">${d.month}</div>
    </div>
    <div class="calendar-event-main">
      <div class="calendar-event-title">${esc(event.title)}</div>
      <div class="calendar-event-place">${esc(event.location||"Luogo non indicato")}</div>
      ${extra}
    </div>
    <div>
      <div class="calendar-event-time">${d.time}</div>
      <div class="calendar-event-type">${esc(eventTypeLabel(event.event_type))}</div>
    </div>
  </div>`;
}

async function pageCalendar(){
  const fanView=isFanAudience();

  const [events,matches,opponents]=await Promise.all([
    must(
      supabase.from("events")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
        .order("start_at")
    ),
    must(
      supabase.from("matches")
        .select("id,event_id,opponent_id,opponent_name,home_away")
        .eq("team_id",state.team.id)
        .eq("season_id",state.season.id)
    ),
    must(
      supabase.from("opponent_teams")
        .select("id,name,short_name,logo_url")
        .eq("team_id",state.team.id)
    )
  ]);

  const visibleEvents=fanView
    ? events.filter(e=>e.event_type==="match")
    : events;

  const matchByEvent=new Map(matches.map(m=>[m.event_id,m]));
  const opponentMap=new Map(opponents.map(o=>[o.id,o]));

  let view=state.preferences?.calendar_view||"list";
  let showAllPast=false;

  const typeOptions=fanView
    ? [["match","Partite"]]
    : [
        ["training","Allenamenti"],
        ["match","Partite"],
        ["meeting","Riunioni"],
        ["social","Sociali"],
        ["other","Altro"]
      ];

  if(!state.calendarMonth){
    const nowKey=monthKey();
    const startMonth=state.season.start_date.slice(0,7);
    const endMonth=state.season.end_date.slice(0,7);
    state.calendarMonth=(nowKey>=startMonth&&nowKey<=endMonth)?nowKey:startMonth;
  }

  renderShell("Calendario",`
    <div class="page-title">
      <div>
        <h1>Calendario</h1>
        <p>${fanView?"Calendario delle partite della squadra.":"Allenamenti, partite e altri eventi della squadra."}</p>
      </div>
      ${!fanView&&can("calendar.manage")?`<button class="btn btn-primary" id="new-event">Nuovo evento</button>`:""}
    </div>

    <div class="calendar-controls-row">
      <div class="calendar-view-toggle">
        <button type="button" id="cal-view-list" class="${view==="list"?"active":""}">☷ Lista</button>
        <button type="button" id="cal-view-month" class="${view==="month"?"active":""}">▦ Mese</button>
      </div>

      <div class="calendar-search-compact">
        <input id="calendar-search" type="search" placeholder="Cerca titolo, luogo o note…" value="${esc(state.calendarFilters?.query||"")}">
      </div>

      ${fanView?"":`
        <div class="calendar-type-filters">
          ${typeOptions.map(([value,label])=>`
            <label class="filter-chip">
              <input type="checkbox" data-cal-type="${value}" ${(state.calendarFilters?.types||[]).includes(value)?"checked":""}>
              ${label}
            </label>
          `).join("")}
        </div>
      `}
    </div>

    <div id="calendar-content"></div>
  `);

  $(".shell")?.classList.add("calendar-page");
  const content=$("#calendar-content");

  const filteredEvents=()=>{
    const q=(state.calendarFilters?.query||"").trim().toLowerCase();
    const types=state.calendarFilters?.types||[];

    return visibleEvents.filter(e=>{
      if(!fanView&&types.length&&!types.includes(e.event_type))return false;
      if(!q)return true;

      return `${e.title||""} ${e.location||""} ${e.notes||""} ${eventTypeLabel(e.event_type)}`
        .toLowerCase()
        .includes(q);
    });
  };

  const wireEventButtons=()=>{
    $$("[data-event]",content).forEach(el=>{
      el.onclick=()=>openEventDetail(el.dataset.event);
    });
  };

  const renderList=()=>{
    const rows=filteredEvents();
    const now=Date.now();

    const future=rows
      .filter(e=>new Date(e.start_at).getTime()>=now)
      .sort((a,b)=>a.start_at.localeCompare(b.start_at));

    const past=rows
      .filter(e=>new Date(e.start_at).getTime()<now)
      .sort((a,b)=>b.start_at.localeCompare(a.start_at));

    if(showAllPast){
      content.innerHTML=`
        <div class="calendar-list-section-head">
          <h3>Eventi passati</h3>
          <button class="btn btn-sm" id="calendar-back-upcoming">← Prossimi eventi</button>
        </div>

        <div class="calendar-event-list calendar-past-all">
          ${past.map(e=>`<div class="calendar-past-event">${calendarEventRow(e)}</div>`).join("")
            ||`<div class="empty">Nessun evento passato con i filtri selezionati</div>`
          }
        </div>
      `;

      $("#calendar-back-upcoming").onclick=()=>{
        showAllPast=false;
        renderList();
      };
      wireEventButtons();
      return;
    }

    const recentPast=past.slice(0,3);

    content.innerHTML=`
      ${recentPast.length?`
        <div class="calendar-list-section-head">
          <h3>Ultimi eventi</h3>
          <button class="btn btn-sm btn-ghost" id="calendar-all-past">Vedi tutti i passati</button>
        </div>

        <div class="calendar-event-list">
          ${recentPast.map(e=>`<div class="calendar-past-event">${calendarEventRow(e)}</div>`).join("")}
        </div>

        <div style="height:10px"></div>
      `:""}

      <div class="calendar-list-section-head">
        <h3>Prossimi eventi</h3>
        ${!recentPast.length&&past.length
          ? `<button class="btn btn-sm btn-ghost" id="calendar-all-past">Vedi tutti i passati</button>`
          : ""
        }
      </div>

      <div class="calendar-event-list">
        ${future.map(e=>calendarEventRow(e)).join("")
          ||`<div class="empty">Nessun prossimo evento con i filtri selezionati</div>`
        }
      </div>
    `;

    $("#calendar-all-past")?.addEventListener("click",()=>{
      showAllPast=true;
      renderList();
    });

    wireEventButtons();
  };

  const renderMonth=()=>{
    const rows=filteredEvents();
    const [year,month]=state.calendarMonth.split("-").map(Number);
    const first=new Date(year,month-1,1);
    const last=new Date(year,month,0);
    const startOffset=(first.getDay()+6)%7;
    const totalCells=Math.ceil((startOffset+last.getDate())/7)*7;

    const cells=[];

    for(let i=0;i<totalCells;i++){
      const date=new Date(year,month-1,1-startOffset+i);
      const key=localDateKey(date);
      const dayEvents=rows.filter(e=>localDateKey(e.start_at)===key);
      const outside=date.getMonth()!==month-1;
      const isToday=key===today();

      cells.push(`<div class="month-day ${outside?"outside":""} ${isToday?"today":""}">
        <div class="month-day-number">${date.getDate()}</div>

        <div class="month-day-events">
          ${dayEvents.slice(0,3).map(e=>{
            const p=calendarDateParts(e.start_at);
            const match=matchByEvent.get(e.id);

            if(match){
              const opponent=opponentMap.get(match.opponent_id);

              return `<button type="button" class="month-event match-mini" data-event="${e.id}" title="${esc(e.title)}">
                <span class="time">${p.time}</span>
                <span class="month-ha-icon">${matchLocationIcon(match.home_away)}</span>
                ${opponentLogoHtml(opponent,"month-match-logo")}
                <span class="month-event-text">${esc(opponentDisplayName(opponent)||match.opponent_name)}</span>
              </button>`;
            }

            return `<button type="button" class="month-event" data-event="${e.id}" title="${esc(e.title)}">
              <span class="time">${p.time}</span>
              <span class="month-event-text">${esc(e.event_type==="training"?"ALL":e.title)}</span>
            </button>`;
          }).join("")}

          ${dayEvents.length>3?`<div class="muted" style="font-size:.55rem">+${dayEvents.length-3}</div>`:""}
        </div>
      </div>`);
    }

    content.innerHTML=`
      <div class="month-nav">
        <button class="btn btn-sm" id="month-prev">←</button>
        <div class="month-title">${esc(calendarMonthLabel(state.calendarMonth))}</div>
        <button class="btn btn-sm" id="month-next">→</button>
      </div>

      <div class="month-calendar-wrap">
        <div class="month-calendar">
          <div class="month-calendar-head">
            ${["Lun","Mar","Mer","Gio","Ven","Sab","Dom"].map(x=>`<div>${x}</div>`).join("")}
          </div>
          <div class="month-calendar-grid">${cells.join("")}</div>
        </div>
      </div>
    `;

    $("#month-prev").onclick=()=>{
      const [y,m]=state.calendarMonth.split("-").map(Number);
      state.calendarMonth=monthKey(new Date(y,m-2,1));
      renderMonth();
    };

    $("#month-next").onclick=()=>{
      const [y,m]=state.calendarMonth.split("-").map(Number);
      state.calendarMonth=monthKey(new Date(y,m,1));
      renderMonth();
    };

    wireEventButtons();
  };

  const renderCurrent=()=>view==="month"?renderMonth():renderList();

  $("#cal-view-list").onclick=async()=>{
    view="list";
    showAllPast=false;
    $("#cal-view-list").classList.add("active");
    $("#cal-view-month").classList.remove("active");
    await saveCalendarView(view);
    renderList();
  };

  $("#cal-view-month").onclick=async()=>{
    view="month";
    $("#cal-view-month").classList.add("active");
    $("#cal-view-list").classList.remove("active");
    await saveCalendarView(view);
    renderMonth();
  };

  $("#calendar-search").oninput=e=>{
    state.calendarFilters={...(state.calendarFilters||{}),query:e.target.value};
    renderCurrent();
  };

  $$("[data-cal-type]").forEach(cb=>cb.onchange=()=>{
    const selected=$$("[data-cal-type]")
      .filter(x=>x.checked)
      .map(x=>x.dataset.calType);

    state.calendarFilters={
      ...(state.calendarFilters||{}),
      types:selected
    };

    renderCurrent();
  });

  $("#new-event")?.addEventListener("click",()=>openCalendarCreateChooser());
  renderCurrent();
}

async function pageTrainings(){
  const events=await must(
    supabase.from("events")
      .select("*")
      .eq("team_id",state.team.id)
      .eq("season_id",state.season.id)
      .eq("event_type","training")
      .order("start_at",{ascending:false})
  );

  const ids=events.map(e=>e.id);
  const attendance=ids.length
    ? await must(supabase.from("event_attendance").select("*").in("event_id",ids))
    : [];

  const summaryFor=id=>{
    const rows=attendance.filter(a=>a.event_id===id);
    const count=status=>rows.filter(a=>a.status===status).length;
    return {
      present:count("present"),
      absent:count("absent"),
      late:count("late"),
      injured:count("injured"),
      excused:count("excused")
    };
  };

  renderShell("Allenamenti",`
    <div class="page-title">
      <div>
        <h1>Allenamenti</h1>
        <p>Programmazione e gestione presenze, assenze e ritardi.</p>
      </div>
      <div class="actions">
        ${can("trainings.setup")?`<button class="btn btn-sm setup-button" id="training-setup">⚙ Setup</button>`:""}
        ${can("trainings.manage")?`<button class="btn btn-primary" id="new-training">Nuovo allenamento</button>`:""}
      </div>
    </div>

    <div class="calendar-event-list">
      ${events.map(e=>{
        const a=summaryFor(e.id);
        return calendarEventRow(e,`
          <div class="attendance-summary">
            <span class="badge green">Presenti ${a.present}</span>
            <span class="badge">Ritardi ${a.late}</span>
            <span class="badge ${a.absent?"red":""}">Assenti ${a.absent}</span>
            ${a.injured?`<span class="badge red">Infortunati ${a.injured}</span>`:""}
            ${a.excused?`<span class="badge">Giustificati ${a.excused}</span>`:""}
          </div>
        `);
      }).join("")||`<div class="empty">Nessun allenamento programmato</div>`}
    </div>
  `);

  $$("[data-event]").forEach(el=>el.onclick=()=>openTrainingDetail(el.dataset.event));
  $("#new-training")?.addEventListener("click",()=>openNewEvent("training",pageTrainings));
  $("#training-setup")?.addEventListener("click",openTrainingSetup);
}

async function openTrainingSetup(){
  try{
    const [venues,setting]=await Promise.all([
      must(
        supabase.from("venues")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("is_opponent_venue",false)
          .order("name")
      ),
      must(
        supabase.from("training_settings")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("season_id",state.season.id)
          .maybeSingle()
      )
    ]);

    showModal("Setup allenamenti",`
      <form id="training-setup-form">
        <div class="section-note">
          Questi valori vengono proposti automaticamente quando crei un nuovo allenamento.
        </div>
        <div style="height:12px"></div>

        <div class="field">
          <label>Campo predefinito</label>
          <select id="training-default-venue">
            <option value="">Nessun campo predefinito</option>
            ${venues.map(v=>`<option value="${v.id}" ${setting?.default_venue_id===v.id?"selected":""}>${esc(v.name)}${venueAddress(v)?` · ${esc(venueAddress(v))}`:""}</option>`).join("")}
          </select>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Ora inizio</label>
            <input id="training-default-start" type="time" value="${String(setting?.default_start_time||"20:30").slice(0,5)}" required>
          </div>
          <div class="field">
            <label>Ora fine</label>
            <input id="training-default-end" type="time" value="${String(setting?.default_end_time||"22:00").slice(0,5)}" required>
          </div>
        </div>

        <button class="btn btn-primary">Salva setup</button>
      </form>
    `,root=>{
      $("#training-setup-form",root).onsubmit=async e=>{
        e.preventDefault();
        try{
          const start=$("#training-default-start",root).value;
          const end=$("#training-default-end",root).value;
          if(end<=start)throw new Error("L'orario di fine deve essere successivo all'inizio");

          await must(
            supabase.from("training_settings")
              .upsert({
                team_id:state.team.id,
                season_id:state.season.id,
                default_venue_id:$("#training-default-venue",root).value||null,
                default_start_time:start,
                default_end_time:end,
                updated_by:state.profile.id
              },{onConflict:"team_id,season_id"})
          );

          closeModal();
          toast("Setup allenamenti salvato","ok");
        }catch(err){
          toast(err.message,"error");
        }
      };
    });
  }catch(err){
    toast(err.message,"error");
  }
}

async function pageCompetitions(){
  const [competitions,seasons,opponents,links]=await Promise.all([
    must(supabase.from("competitions").select("*").eq("team_id",state.team.id).order("start_date",{ascending:false})),
    Promise.resolve(state.seasons),
    (can("opponents.view")||can("opponents.manage")||can("matches.manage"))
      ? must(supabase.from("opponent_teams").select("*").eq("team_id",state.team.id).order("name"))
      : Promise.resolve([]),
    must(supabase.from("competition_opponents").select("*"))
  ]);

  const sm=new Map(seasons.map(x=>[x.id,x]));
  const om=new Map(opponents.map(x=>[x.id,x]));

  renderShell("Competizioni",`
    <div class="page-title">
      <div>
        <h1>Competizioni</h1>
        <p>Formato, avversarie e durata dei tempi per ciascuna competizione.</p>
      </div>
      ${can("competitions.manage")?`<button class="btn btn-primary" id="new-competition">Nuova competizione</button>`:""}
    </div>

    <div class="grid grid-2">
      ${competitions.map(c=>{
        const participants=links.filter(x=>x.competition_id===c.id).map(x=>om.get(x.opponent_id)).filter(Boolean);
        const season=sm.get(c.season_id);
        const format=competitionFormatLabel(c);
        const regular=`${c.regular_period_count||2} × ${c.regular_period_minutes||45}'`;
        const extra=c.extra_time_enabled?` · supplementari ${c.extra_period_count||2} × ${c.extra_period_minutes||15}'`:"";

        return `<div class="card competition-card">
          <div class="card-head">
            <div>
              <h3 style="margin:0">${esc(c.name)}</h3>
              <div class="muted">${esc(competitionTypeLabel(c.competition_type))}${format?` · ${esc(format)}`:""} · ${esc(season?.name||"")}</div>
            </div>
            <span class="badge ${c.active?"green":"red"}">${c.active?"attiva":"archiviata"}</span>
          </div>

          <div class="muted">
            ${c.start_date?fmtDate(c.start_date):"Data inizio non indicata"} → ${c.end_date?fmtDate(c.end_date):"senza fine"}
            · ore ${String(c.default_start_time||"15:00").slice(0,5)}
          </div>

          <div class="section-note" style="margin-top:9px">
            Tempi regolamentari: <strong>${regular}</strong>${extra}
            ${c.competition_type==="friendly"?`<br>Le singole amichevoli possono sovrascrivere numero e durata dei tempi.`:""}
          </div>

          ${c.competition_type==="friendly"
            ? `<div class="section-note" style="margin-top:8px">Nelle amichevoli sono disponibili tutte le avversarie attive censite.</div>`
            : `<div class="competition-opponents">
                ${participants.length
                  ? participants.map(o=>`<span class="badge">${esc(o.short_name||o.name)}</span>`).join("")
                  : `<span class="muted">Nessuna avversaria configurata</span>`
                }
              </div>`
          }

          ${c.notes?`<p>${esc(c.notes)}</p>`:""}

          ${can("competitions.manage")
            ? `<div class="actions" style="margin-top:12px"><button class="btn btn-sm" data-edit-competition="${c.id}">Modifica</button></div>`
            : ""
          }
        </div>`;
      }).join("")||`<div class="empty">Nessuna competizione configurata</div>`}
    </div>
  `);

  $("#new-competition")?.addEventListener("click",()=>openCompetitionModal(null,opponents,[]));
  $$("[data-edit-competition]").forEach(b=>{
    const c=competitions.find(x=>x.id===b.dataset.editCompetition);
    const selected=links.filter(x=>x.competition_id===c.id).map(x=>x.opponent_id);
    b.onclick=()=>openCompetitionModal(c,opponents,selected);
  });
}
