<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Team Manager</title>
  <style>
    :root{
      /* Palette UI: primario=dettagli, secondario=sfondo, terzo=testi */
      --team-primary:#22c55e;
      --team-secondary:#0b1220;
      --team-tertiary:#f3f4f6;
      --team-accent:#22c55e;

      --bg:#0b1220;
      --panel:#111827;
      --panel2:#172033;
      --input-bg:#0d1626;
      --topbar-bg:rgba(11,18,32,.94);

      --text:#f3f4f6;
      --muted:#94a3b8;
      --line:#263246;

      --accent:#22c55e;
      --accent2:#22c55e;
      --accent-contrast:#07120a;

      --team-primary-soft:rgba(243,244,246,.10);
      --team-primary-line:rgba(34,197,94,.42);
      --team-secondary-soft:rgba(11,18,32,.12);
      --team-accent-soft:rgba(34,197,94,.16);

      --danger:#ef4444;
      --warn:#f59e0b;
      --info:#3b82f6;
      --success:#22c55e;

      --radius:14px;
      --shadow:0 8px 30px rgba(0,0,0,.22);
      --ui-font-size:.84rem;
    }
    *{box-sizing:border-box} html{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;background:var(--bg)} button,input,select,textarea{font:inherit}
    button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.danger{color:var(--danger)}
    .app{min-height:100vh}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}
    .auth-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand-mark{width:44px;height:44px;border-radius:13px;background:var(--accent);display:grid;place-items:center;color:var(--accent-contrast,#07120a);font-weight:900;font-size:.78rem;letter-spacing:.025em;overflow:hidden}.brand-mark img{width:100%;height:100%;object-fit:cover}
    h1,h2,h3{margin:0 0 12px}h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1rem}
    label{display:block;font-size:.84rem;color:var(--muted);margin:0 0 6px}.field{margin-bottom:14px}
    input,select,textarea{width:100%;border:1px solid var(--line);background:var(--input-bg);color:var(--text);border-radius:11px;padding:11px 12px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:90px;resize:vertical}
    .btn{border:0;border-radius:11px;padding:10px 14px;background:var(--panel2);color:var(--text);font-weight:700;border:1px solid transparent}
    .btn:hover{filter:brightness(1.08)}.btn-primary{background:var(--accent);color:var(--accent-contrast,#07120a);border-color:var(--accent)}.btn-danger{background:#7f1d1d}.btn-warn{background:#78350f}.btn-ghost{background:transparent;border:1px solid var(--line)}
    .btn-sm{padding:7px 10px;font-size:.82rem}.btn-block{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
    .sidebar .brand{margin-bottom:18px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--muted);padding:10px 11px;border-radius:10px;text-align:left}
    .nav button.active,.nav button:hover{background:var(--team-accent-soft);color:var(--text);box-shadow:inset 3px 0 var(--team-accent)}.nav .section{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#64748b;padding:15px 10px 4px}
    .main{min-width:0}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--topbar-bg);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
    .topbar-left{min-width:0}.topbar-title{font-weight:800}.topbar-sub{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .content{padding:22px;max-width:1450px;margin:auto}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
    .stat{font-size:1.65rem;font-weight:900}.stat-label{font-size:.78rem;color:var(--muted)}
    .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;background:var(--team-secondary-soft);color:var(--text);border:1px solid var(--team-primary-line);font-size:.74rem;font-weight:800}
    .badge.green{background:#123b28;color:#86efac}.badge.red{background:#4b1d25;color:#fca5a5}.badge.yellow{background:#4b3514;color:#fcd34d}.badge.blue{background:#172d4d;color:#93c5fd}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:640px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:.85rem;vertical-align:middle}
    .table th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--panel2);position:sticky;top:0}.table tr:last-child td{border-bottom:0}
    .player-name{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:#334155;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}
    .tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 12px;white-space:nowrap}.tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast,#07120a);font-weight:800}
    .list{display:grid;gap:8px}.list-item{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--panel2)}
    .empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
    .page-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.page-title p{margin:3px 0 0;color:var(--muted);font-size:.86rem}
    .bottom-nav{display:none}.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:1000;display:grid;gap:8px}.toast{background:var(--panel);border:1px solid var(--line);padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:340px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:grid;place-items:center;padding:16px}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
    .modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.close{border:0;background:transparent;color:var(--muted);font-size:1.4rem}
    .affinity-row{display:grid;grid-template-columns:70px 1fr 50px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.affinity-row input[type=range]{padding:0}
    .live-score{text-align:center;padding:10px}.live-score .score{font-size:2.6rem;font-weight:1000;letter-spacing:-.04em}.live-clock{font-variant-numeric:tabular-nums;font-size:1.1rem;color:#d1fae5}
    .timeline{display:grid;gap:8px}.timeline-item{border-left:3px solid #334155;padding:8px 11px;background:#0f192a;border-radius:0 10px 10px 0}.timeline-item.pending{border-left-color:var(--warn);background:#241b0d}
    .live-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.live-actions .btn{min-height:58px}
    .pitch{background:linear-gradient(90deg,#155e36,#166534);border:2px solid rgba(255,255,255,.5);border-radius:14px;min-height:360px;position:relative;padding:18px;display:grid;grid-template-rows:repeat(4,1fr);gap:10px}
    .pitch-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}.pitch-player{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);padding:7px 9px;border-radius:10px;font-size:.75rem;text-align:center;min-width:82px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}
    .perm-matrix th:first-child,.perm-matrix td:first-child{position:sticky;left:0;background:var(--panel);z-index:2}.perm-matrix input{width:18px;height:18px}
    .section-note{font-size:.8rem;color:var(--muted);padding:10px 12px;background:var(--team-accent-soft);border-radius:10px;border:1px solid var(--team-primary-line)}
    .team-logo-settings{display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:start}
    .team-logo-preview{width:130px;height:130px;border-radius:18px;border:1px solid var(--team-primary-line);background:var(--team-accent-soft);display:grid;place-items:center;overflow:hidden;font-weight:900;font-size:1.25rem}
    .team-logo-preview img{width:100%;height:100%;object-fit:contain;padding:8px}
    .color-field input[type=color]{height:56px;padding:4px;cursor:pointer}
    .color-value{font-size:.76rem;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
    .palette-proposal{display:none;margin-top:12px;padding:12px;border:1px solid var(--team-primary-line);border-radius:12px;background:var(--team-accent-soft)}
    .palette-proposal.show{display:block}
    .palette-swatches{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}
    .palette-swatch{width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
    .team-theme-preview{
      border:1px solid var(--preview-detail,var(--line));
      border-radius:14px;
      padding:14px;
      background:var(--preview-bg,var(--panel));
      color:var(--preview-text,var(--text));
      margin:14px 0
    }
    .team-theme-preview .muted{color:var(--preview-muted,var(--muted))}
    .team-theme-preview .preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--preview-line,var(--line))}
    .team-theme-preview .preview-nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
    .team-theme-preview .preview-tab{padding:7px 10px;border-radius:999px;background:var(--preview-surface);border:1px solid var(--preview-line)}
    .team-theme-preview .preview-cta{border:1px solid var(--preview-detail);border-radius:9px;padding:8px 11px;font-weight:800;background:var(--preview-detail);color:var(--preview-detail-contrast)}
    .team-theme-preview .preview-badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--preview-surface);border:1px solid var(--preview-line)}
    .team-theme-preview .preview-accent{height:5px;border-radius:999px;background:var(--preview-detail);margin-top:12px}

    /* Navigazione mobile */
    .mobile-appbar,.mobile-drawer-backdrop,.mobile-drawer{display:none}
    .mobile-menu-btn{
      width:44px;height:44px;border-radius:13px;border:1px solid var(--line);
      background:var(--panel);color:var(--text);font-size:1.25rem;
      display:grid;place-items:center;flex:none
    }
    .mobile-appbar-brand{
      width:42px;height:42px;border-radius:13px;background:var(--accent);
      color:var(--accent-contrast);display:grid;place-items:center;overflow:hidden;
      font-weight:900;font-size:.72rem;letter-spacing:.025em;flex:none
    }
    .mobile-appbar-brand img{width:100%;height:100%;object-fit:cover}
    .mobile-appbar-copy{min-width:0;flex:1}
    .mobile-appbar-title{font-size:.98rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mobile-appbar-sub{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mobile-drawer-backdrop{
      position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.54);
      backdrop-filter:blur(2px)
    }
    .mobile-drawer{
      position:fixed;top:0;right:0;bottom:0;z-index:80;
      width:min(88vw,370px);background:var(--panel);
      border-left:1px solid var(--line);box-shadow:-18px 0 55px rgba(0,0,0,.32);
      padding:calc(14px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
      overflow:auto;transform:translateX(102%);transition:transform .22s ease
    }
    .mobile-drawer-backdrop.open{display:block}
    .mobile-drawer.open{display:block;transform:translateX(0)}
    .mobile-drawer-head{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:4px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:12px
    }
    .mobile-drawer-brand{display:flex;align-items:center;gap:11px;min-width:0}
    .mobile-drawer .nav{gap:7px}
    .mobile-drawer .nav button{
      min-height:48px;padding:12px 13px;border-radius:13px;font-size:.94rem;
      border:1px solid transparent
    }
    .mobile-drawer .nav button.active{
      background:var(--team-accent-soft);border-color:var(--line);
      box-shadow:inset 4px 0 var(--team-accent)
    }
    .mobile-drawer-context{
      display:grid;gap:10px;padding:12px 2px;border-top:1px solid var(--line);margin-top:12px
    }
    .mobile-drawer-context label{margin:0 0 5px}
    .mobile-drawer-account{
      display:grid;gap:8px;padding:12px 2px 2px;border-top:1px solid var(--line);margin-top:12px
    }
    .mobile-drawer-account .btn{min-height:46px;text-align:left}
    body.mobile-menu-open{overflow:hidden}

    @media(max-width:900px){
      .shell{display:block}
      .sidebar,.topbar,.bottom-nav{display:none!important}
      .main{min-width:0}
      .mobile-appbar{
        display:flex;align-items:center;gap:10px;
        position:sticky;top:0;z-index:45;
        padding:calc(9px + env(safe-area-inset-top)) 12px 9px;
        background:var(--topbar-bg);border-bottom:1px solid var(--line);
        backdrop-filter:blur(14px)
      }
      .mobile-drawer{display:block}
      .content{padding:16px 12px 28px}
      .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
      .page-title{align-items:flex-start;flex-direction:column}
      .form-grid{grid-template-columns:1fr}
      .live-actions{grid-template-columns:repeat(2,1fr)}
      .tabs{scrollbar-width:none}
      .tabs::-webkit-scrollbar{display:none}
      .toast-wrap{left:12px;right:12px;bottom:12px}
      .toast{max-width:none;width:100%}
    }
    @media(max-width:480px){
      .auth-card{padding:18px}
      .card{padding:13px}
      .live-score .score{font-size:2rem}
      .affinity-row{grid-template-columns:58px 1fr 44px}
      .team-logo-settings{grid-template-columns:1fr}
      .team-logo-preview{width:110px;height:110px}
      .mobile-drawer{width:min(92vw,355px)}
      .mobile-appbar{padding-left:10px;padding-right:10px}
    }

    .calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .calendar-view-toggle{display:flex;gap:6px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
    .calendar-view-toggle button{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:9px;font-weight:800}
    .calendar-view-toggle button.active{background:var(--team-accent-soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
    .calendar-filterbar{display:grid;grid-template-columns:minmax(190px,1fr) auto;gap:12px;align-items:start;margin-bottom:16px}
    .calendar-type-filters{display:flex;gap:7px;flex-wrap:wrap}
    .filter-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:.78rem;font-weight:800;cursor:pointer}
    .filter-chip input{width:auto;margin:0}
    .calendar-event-list{display:grid;gap:9px}
    .calendar-event-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:13px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer}
    .calendar-event-row:hover{background:var(--panel2)}
    .calendar-date-tile{width:58px;min-height:58px;border:1px solid var(--line);border-radius:12px;background:var(--team-accent-soft);display:grid;place-items:center;align-content:center;line-height:1}
    .calendar-date-day{font-size:1.28rem;font-weight:950}
    .calendar-date-month{font-size:.68rem;font-weight:900;letter-spacing:.08em;color:var(--muted);margin-top:4px}
    .calendar-event-main{min-width:0}
    .calendar-event-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .calendar-event-place{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
    .calendar-event-time{font-size:.9rem;font-weight:900;white-space:nowrap;text-align:right}
    .calendar-event-type{font-size:.67rem;color:var(--muted);margin-top:4px;text-align:right}
    .month-calendar-wrap{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel);width:100%}
    .month-calendar{width:100%;min-width:0}
    .month-calendar-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
    .month-calendar-head div{padding:9px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:900;text-transform:uppercase}
    .month-calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}
    .month-day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-width:0;overflow:hidden}
    .month-day:nth-child(7n){border-right:0}
    .month-day.outside{opacity:.35;background:var(--panel2)}
    .month-day.today{box-shadow:inset 0 0 0 2px var(--team-accent)}
    .month-day-number{font-size:.78rem;font-weight:900;margin-bottom:6px}
    .month-day-events{display:grid;gap:4px}
    .month-event{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--team-accent-soft);color:var(--text);font-size:.68rem;line-height:1.18;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .month-event .time{color:var(--muted);font-weight:800;margin-right:3px}
    .month-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 14px}
    .month-title{min-width:180px;text-align:center;font-weight:950;text-transform:capitalize}
    .attendance-summary{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
    .setup-button{display:inline-flex;align-items:center;gap:6px}
    .competition-card .card-head{align-items:flex-start}
    .competition-opponents{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .competition-opponent-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:260px;overflow:auto;padding:4px}
    .competition-opponent-check{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px}
    .competition-opponent-check input{width:auto}
    @media(max-width:700px){
      .calendar-filterbar{grid-template-columns:1fr}
      .calendar-event-row{grid-template-columns:58px minmax(0,1fr) auto;gap:9px;padding:9px}
      .calendar-date-tile{width:54px;min-height:54px}
      .calendar-event-time{font-size:.82rem}
      .competition-opponent-checks{grid-template-columns:1fr}
    }


    .month-event.match-mini{display:flex;align-items:center;gap:4px;justify-content:flex-start;padding:4px}
    .month-match-logo{width:16px;height:16px;border-radius:4px;object-fit:contain;background:#fff;flex:none}
    .month-match-fallback{width:16px;height:16px;border-radius:4px;background:var(--team-accent-soft);border:1px solid var(--line);display:grid;place-items:center;font-size:.48rem;font-weight:900;flex:none}
    .month-ha-icon{font-size:.68rem;line-height:1;flex:none}
    .month-event-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

    .attendance-board{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .attendance-zone{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px;min-height:220px}
    .attendance-zone.drag-over{box-shadow:inset 0 0 0 2px var(--team-accent);background:var(--team-accent-soft)}
    .attendance-zone-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .attendance-player-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px;cursor:grab}
    .attendance-player-card:active{cursor:grabbing}
    .attendance-player-main{display:flex;align-items:center;gap:9px;min-width:0}
    .attendance-player-main .avatar{flex:none}
    .attendance-player-name{min-width:0}
    .attendance-player-name strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .attendance-card-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

    /* =====================================================
       MANAGERIAL UI SYSTEM
       Stile coerente per tutto l'impianto
    ===================================================== */
    :root{
      --ui-card-radius:12px;
      --ui-record-radius:10px;
      --ui-gap:10px;
      --ui-shadow-soft:0 4px 16px rgba(0,0,0,.13);
      --ui-shadow-hover:0 9px 26px rgba(0,0,0,.20);
      --ui-record-bg:color-mix(in srgb,var(--panel) 91%,var(--team-accent) 9%);
      --ui-record-hover:color-mix(in srgb,var(--panel2) 88%,var(--team-accent) 12%);
      --ui-line-soft:color-mix(in srgb,var(--line) 80%,transparent);
    }

    body{
      background:
        linear-gradient(180deg,rgba(255,255,255,.012),transparent 240px),
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 88px,
          color-mix(in srgb,var(--team-accent) 2.8%,transparent) 88px,
          color-mix(in srgb,var(--team-accent) 2.8%,transparent) 176px
        ),
        var(--bg);
    }

    .content{
      max-width:1500px;
      padding:18px 20px 28px;
    }

    /* --- Gerarchia pagina --- */
    .page-title{
      position:relative;
      align-items:center;
      min-height:46px;
      margin-bottom:14px;
      padding:2px 0 2px 13px;
      border-left:3px solid var(--team-accent);
    }
    .page-title h1{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:3px;
      font-size:1.42rem;
      letter-spacing:-.025em;
    }
    .page-title p{
      margin-top:1px;
      line-height:1.25;
      max-width:900px;
    }
    .ui-title-icon{
      width:30px;
      height:30px;
      display:inline-grid;
      place-items:center;
      flex:none;
      border-radius:9px;
      background:var(--team-accent-soft);
      border:1px solid var(--team-primary-line);
      font-size:16px!important;
      box-shadow:inset 0 1px rgba(255,255,255,.05);
    }
    .ui-heading-icon{
      display:inline-grid;
      place-items:center;
      margin-right:6px;
      font-size:.95em!important;
      vertical-align:-.03em;
    }
    .topbar-section-icon{
      display:inline-block;
      margin-right:7px;
      filter:saturate(.9);
    }

    /* --- Sidebar / navigazione --- */
    .sidebar{
      padding:14px 12px;
      background:
        linear-gradient(180deg,color-mix(in srgb,var(--team-accent) 5%,var(--panel)),var(--panel) 180px);
      box-shadow:4px 0 18px rgba(0,0,0,.08);
      scrollbar-width:thin;
    }
    .sidebar::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:3px;
      background:var(--team-accent);
    }
    .sidebar .brand{
      margin:3px 5px 13px;
      padding:8px 6px 10px;
      border-bottom:1px solid var(--ui-line-soft);
    }
    .nav{gap:2px}
    .nav button{
      min-height:36px;
      gap:8px;
      padding:6px 8px;
      border-radius:8px;
      font-weight:650;
      transition:background .16s ease,color .16s ease,transform .16s ease;
    }
    .nav button>span:first-child{
      width:25px;
      height:25px;
      min-width:25px;
      display:grid;
      place-items:center;
      border-radius:7px;
      background:color-mix(in srgb,var(--panel2) 85%,transparent);
      font-size:13px!important;
      line-height:1;
    }
    .nav button.active{
      background:var(--team-accent-soft);
      color:var(--text);
      box-shadow:inset 3px 0 var(--team-accent);
      font-weight:800;
    }
    .nav button.active>span:first-child{
      background:var(--team-accent);
      color:var(--accent-contrast);
      box-shadow:0 3px 10px color-mix(in srgb,var(--team-accent) 28%,transparent);
    }
    .nav button:hover{transform:translateX(1px)}
    .nav .section{
      padding:11px 8px 3px;
      font-size:.62rem!important;
      opacity:.7;
    }

    /* --- Topbar --- */
    .topbar{
      min-height:58px;
      padding:10px 18px;
      border-bottom:1px solid var(--ui-line-soft);
      box-shadow:0 5px 20px rgba(0,0,0,.07);
    }
    .topbar-title{
      display:flex;
      align-items:center;
      font-weight:850;
      letter-spacing:-.01em;
    }
    .mobile-appbar-title{
      display:flex;
      align-items:center;
      font-weight:850;
    }

    /* --- Card / tile unificate --- */
    .card,
    .attendance-zone,
    .match-team-slot,
    .competition-rule-box,
    .opponent-field-box,
    .roster-setup-option{
      position:relative;
      border:1px solid var(--ui-line-soft)!important;
      border-radius:var(--ui-card-radius)!important;
      background:
        linear-gradient(
          145deg,
          color-mix(in srgb,var(--panel) 97%,white 3%),
          var(--panel)
        )!important;
      box-shadow:var(--ui-shadow-soft);
    }
    .card{
      padding:13px;
      transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
    }
    button.card:hover,
    .card[data-platform-go]:hover{
      transform:translateY(-1px);
      border-color:var(--team-primary-line)!important;
      box-shadow:var(--ui-shadow-hover);
    }
    .card-head{
      margin-bottom:9px;
      padding-bottom:8px;
      border-bottom:1px solid var(--ui-line-soft);
    }
    .card h2,.card h3{
      letter-spacing:-.015em;
    }

    /* KPI / dashboard tiles */
    .manager-kpi-card{
      overflow:hidden;
      min-height:86px;
      padding-right:52px!important;
    }
    .manager-kpi-card::before{
      content:attr(data-ui-icon);
      position:absolute;
      top:11px;
      right:11px;
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:10px;
      background:var(--team-accent-soft);
      border:1px solid var(--team-primary-line);
      font-size:17px!important;
      opacity:.92;
    }
    .manager-kpi-card::after{
      content:"";
      position:absolute;
      left:0;
      bottom:0;
      width:100%;
      height:2px;
      background:linear-gradient(90deg,var(--team-accent),transparent 65%);
      opacity:.65;
    }
    .stat{
      font-size:1.52rem!important;
      line-height:1.05;
      letter-spacing:-.04em;
    }
    .stat-label{
      margin-top:5px;
      line-height:1.15;
    }

    /* --- Record unificato --- */
    .list{gap:5px}
    .list-item,
    .calendar-event-row,
    .callup-card,
    .timeline-item{
      border:1px solid var(--ui-line-soft)!important;
      border-radius:var(--ui-record-radius)!important;
      background:var(--ui-record-bg)!important;
      box-shadow:0 1px 5px rgba(0,0,0,.08);
      transition:background .14s ease,border-color .14s ease,transform .14s ease;
    }
    .list-item{
      min-height:42px;
      padding:7px 9px;
    }
    .calendar-event-row{
      padding:7px 9px;
    }
    .callup-card{
      min-height:40px;
      padding:6px 8px;
    }
    .list-item:hover,
    .calendar-event-row:hover,
    .callup-card:hover{
      background:var(--ui-record-hover)!important;
      border-color:var(--team-primary-line)!important;
    }

    /* Record persona */
    .player-list-identity{
      gap:5px;
    }
    .player-list-identity .avatar{
      width:25px!important;
      height:25px!important;
      min-width:25px!important;
      border:1px solid var(--ui-line-soft);
      box-shadow:0 2px 7px rgba(0,0,0,.12);
    }
    .player-list-role{
      border:1px solid rgba(255,255,255,.06);
      box-shadow:inset 0 1px rgba(255,255,255,.05);
    }

    /* --- Tabelle come record manageriale --- */
    .table-wrap{
      overflow:auto;
      border:0!important;
      border-radius:0!important;
      background:transparent!important;
      scrollbar-width:thin;
    }
    .table{
      border-collapse:separate!important;
      border-spacing:0 4px!important;
      min-width:0;
    }
    .table thead th{
      z-index:7;
      top:0;
      padding:6px 8px!important;
      border:0!important;
      background:color-mix(in srgb,var(--panel2) 96%,transparent)!important;
      box-shadow:0 1px 0 var(--line);
      font-size:.67rem!important;
      letter-spacing:.055em;
    }
    .table tbody td{
      padding:6px 8px!important;
      background:var(--ui-record-bg);
      border-top:1px solid var(--ui-line-soft)!important;
      border-bottom:1px solid var(--ui-line-soft)!important;
      transition:background .14s ease,border-color .14s ease;
    }
    .table tbody td:first-child{
      border-left:1px solid var(--ui-line-soft)!important;
      border-radius:var(--ui-record-radius) 0 0 var(--ui-record-radius);
    }
    .table tbody td:last-child{
      border-right:1px solid var(--ui-line-soft)!important;
      border-radius:0 var(--ui-record-radius) var(--ui-record-radius) 0;
    }
    .table tbody tr:hover td{
      background:var(--ui-record-hover);
      border-color:var(--team-primary-line)!important;
    }
    .table tbody tr.roster-row-inactive td{
      opacity:.58;
    }

    /* Rosa resta ultra-compatta */
    .roster-table{
      border-spacing:0 2px!important;
    }
    .roster-table tbody tr{height:31px!important}
    .roster-table th,.roster-table td{padding-top:3px!important;padding-bottom:3px!important}

    /* --- Badge / status --- */
    .badge{
      min-height:20px;
      padding:2px 7px;
      border-radius:7px;
      font-weight:800;
      background:color-mix(in srgb,var(--panel2) 82%,var(--team-accent) 18%);
      border-color:var(--ui-line-soft);
      box-shadow:inset 0 1px rgba(255,255,255,.035);
    }
    .badge.green{background:rgba(34,197,94,.13);border-color:rgba(34,197,94,.28);color:#86efac}
    .badge.red{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.28);color:#fca5a5}
    .badge.yellow{background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.28);color:#fcd34d}
    .badge.blue{background:rgba(59,130,246,.13);border-color:rgba(59,130,246,.28);color:#93c5fd}

    /* --- Buttons --- */
    .btn{
      border-radius:8px!important;
      min-height:34px;
      padding:7px 11px;
      border:1px solid var(--ui-line-soft);
      background:color-mix(in srgb,var(--panel2) 96%,white 4%);
      font-weight:750;
      box-shadow:0 2px 7px rgba(0,0,0,.08);
      transition:transform .14s ease,filter .14s ease,border-color .14s ease;
    }
    .btn:hover{
      transform:translateY(-1px);
      border-color:var(--team-primary-line);
    }
    .btn-primary{
      background:linear-gradient(
        180deg,
        color-mix(in srgb,var(--team-accent) 88%,white 12%),
        var(--team-accent)
      )!important;
      border-color:var(--team-accent)!important;
      color:var(--accent-contrast)!important;
      box-shadow:0 4px 12px color-mix(in srgb,var(--team-accent) 22%,transparent);
    }
    .btn-danger{
      background:rgba(127,29,29,.72)!important;
      border-color:rgba(239,68,68,.28)!important;
    }
    .btn-ghost{
      background:transparent!important;
      box-shadow:none;
    }
    .btn-sm{
      min-height:29px;
      padding:5px 8px!important;
    }

    /* --- Forms --- */
    input,select,textarea{
      border-radius:8px!important;
      border-color:var(--ui-line-soft);
      background:color-mix(in srgb,var(--input-bg) 96%,white 4%);
      min-height:38px;
      padding:8px 10px;
      transition:border-color .14s ease,box-shadow .14s ease,background .14s ease;
    }
    input:focus,select:focus,textarea:focus{
      border-color:var(--team-accent)!important;
      box-shadow:0 0 0 3px color-mix(in srgb,var(--team-accent) 13%,transparent);
    }
    label{
      margin-bottom:4px;
      font-weight:650;
    }
    .field{margin-bottom:10px}
    .form-grid{gap:9px}

    /* --- Tabs / setup selectors --- */
    .tabs,.cash-tabs{
      gap:4px;
      padding:3px;
      border:1px solid var(--ui-line-soft);
      border-radius:10px;
      background:color-mix(in srgb,var(--panel) 92%,transparent);
      width:max-content;
      max-width:100%;
    }
    .tab,.cash-tabs button{
      border-radius:7px!important;
      padding:6px 9px!important;
      min-height:31px;
    }
    .tab.active,.cash-tabs button.active{
      background:var(--team-accent-soft)!important;
      color:var(--text)!important;
      border-color:var(--team-primary-line)!important;
    }

    /* --- Notes / empty --- */
    .section-note{
      border-radius:9px!important;
      border:1px solid var(--team-primary-line);
      border-left:3px solid var(--team-accent);
      background:color-mix(in srgb,var(--team-accent-soft) 70%,var(--panel) 30%);
      padding:8px 10px;
      line-height:1.28;
    }
    .empty{
      border-radius:10px;
      padding:20px;
      background:color-mix(in srgb,var(--panel) 96%,var(--team-accent) 4%);
      border-color:var(--ui-line-soft);
    }
    .empty.manager-empty::before{
      content:attr(data-ui-icon);
      display:block;
      font-size:1.45rem!important;
      margin-bottom:5px;
      filter:saturate(.85);
    }

    /* --- Calendario --- */
    .calendar-controls-row{
      border:1px solid var(--ui-line-soft);
      border-radius:10px;
      background:var(--panel);
      box-shadow:var(--ui-shadow-soft);
      padding:6px;
      margin-bottom:9px;
    }
    .calendar-date-tile{
      width:52px!important;
      min-height:50px!important;
      border-radius:9px!important;
      border-color:var(--team-primary-line)!important;
      background:var(--team-accent-soft)!important;
    }
    .calendar-date-day{font-size:1.18rem!important}
    .calendar-event-title{font-weight:800}
    .calendar-past-event{opacity:.50}
    .month-calendar-wrap{
      border:1px solid var(--ui-line-soft);
      border-radius:10px;
      overflow:hidden;
      background:var(--panel);
      box-shadow:var(--ui-shadow-soft);
    }
    .month-day{
      border-color:var(--ui-line-soft)!important;
      background:color-mix(in srgb,var(--panel) 97%,transparent);
    }
    .month-day.today{
      box-shadow:inset 0 0 0 2px var(--team-accent);
    }
    .month-event{
      border-radius:5px!important;
      border-color:var(--ui-line-soft)!important;
      background:var(--team-accent-soft)!important;
    }

    /* --- Allenamenti / presenze --- */
    .attendance-zone{
      padding:10px!important;
      min-height:190px;
    }
    .attendance-zone-head{
      margin-bottom:7px;
      padding-bottom:7px;
      border-bottom:1px solid var(--ui-line-soft);
    }
    .attendance-zone.drag-over{
      box-shadow:inset 0 0 0 2px var(--team-accent),var(--ui-shadow-soft)!important;
    }
    .attendance-summary{
      gap:7px!important;
    }

    /* --- Partite / FIFA-like --- */
    .home-away-selector{
      gap:3px;
      padding:3px;
      border-radius:10px!important;
      border-color:var(--ui-line-soft)!important;
      background:var(--panel)!important;
    }
    .home-away-selector button{
      min-height:34px;
      padding:6px 8px!important;
      border-radius:7px!important;
    }
    .home-away-selector button.active{
      background:var(--team-accent-soft)!important;
      border-color:var(--team-primary-line)!important;
      box-shadow:inset 0 -2px var(--team-accent);
    }
    .match-team-slot{
      min-height:150px;
      padding:11px!important;
    }
    .match-scoreboard{
      padding:13px;
      border:1px solid var(--ui-line-soft);
      border-radius:13px;
      background:
        radial-gradient(circle at 50% -50%,var(--team-accent-soft),transparent 55%),
        var(--panel);
      box-shadow:var(--ui-shadow-soft);
    }
    .match-score-number{
      font-size:2.15rem!important;
      letter-spacing:-.05em;
    }
    .match-score-team img,
    .match-score-team .fallback{
      width:54px!important;
      height:54px!important;
      border-radius:10px!important;
    }
    .callup-grid{gap:7px!important}
    .pitch{
      border-radius:12px!important;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),var(--ui-shadow-soft);
      background:
        repeating-linear-gradient(
          90deg,
          #155e36 0,
          #155e36 12.5%,
          #166534 12.5%,
          #166534 25%
        )!important;
    }
    .pitch-player{
      border-radius:8px!important;
      box-shadow:0 3px 9px rgba(0,0,0,.2);
    }

    /* --- LIVE --- */
    .live-score{
      border:1px solid var(--ui-line-soft);
      border-radius:12px;
      background:
        radial-gradient(circle at 50% 0,var(--team-accent-soft),transparent 60%),
        var(--panel);
      box-shadow:var(--ui-shadow-soft);
    }
    .live-score .score{font-size:2.35rem!important}
    .timeline{gap:5px}
    .timeline-item{
      padding:7px 9px!important;
      border-left:3px solid var(--team-accent)!important;
    }
    .timeline-item.pending{
      border-left-color:var(--warn)!important;
      background:rgba(245,158,11,.08)!important;
    }
    .live-actions{gap:6px}
    .live-actions .btn{
      min-height:48px;
      font-size:.82rem!important;
    }

    /* --- Cassa / competizioni --- */
    .fine-rule-row{
      min-height:40px;
      padding:5px 0!important;
    }
    .fee-installment-row{
      padding:7px!important;
      border-radius:9px!important;
      background:var(--ui-record-bg)!important;
      border-color:var(--ui-line-soft)!important;
    }
    .competition-card{
      overflow:hidden;
    }
    .competition-card::after{
      content:"🏆";
      position:absolute;
      right:10px;
      bottom:7px;
      font-size:22px!important;
      opacity:.055;
    }
    .competition-opponents{
      margin-top:8px;
      display:flex;
      gap:4px;
      flex-wrap:wrap;
    }

    /* --- Modal --- */
    .modal-backdrop{
      background:rgba(2,6,23,.72);
      backdrop-filter:blur(5px);
    }
    .modal{
      border-radius:14px!important;
      border-color:var(--ui-line-soft)!important;
      padding:14px!important;
      box-shadow:0 22px 70px rgba(0,0,0,.40);
    }
    .modal-head{
      margin:-2px -2px 11px;
      padding:2px 2px 9px;
      border-bottom:1px solid var(--ui-line-soft);
    }
    .modal-head h2{
      display:flex;
      align-items:center;
      gap:7px;
      margin:0;
    }

    /* --- Scrollbars --- */
    *{
      scrollbar-width:thin;
      scrollbar-color:color-mix(in srgb,var(--team-accent) 35%,var(--line)) transparent;
    }
    *::-webkit-scrollbar{width:7px;height:7px}
    *::-webkit-scrollbar-track{background:transparent}
    *::-webkit-scrollbar-thumb{
      background:color-mix(in srgb,var(--team-accent) 30%,var(--line));
      border-radius:99px;
    }

    /* --- Responsive --- */
    @media(max-width:900px){
      .content{
        padding:9px 7px 18px!important;
      }
      .mobile-appbar{
        min-height:52px;
        padding:6px 8px!important;
        border-bottom:1px solid var(--ui-line-soft);
        box-shadow:0 5px 17px rgba(0,0,0,.10);
      }
      .mobile-appbar-brand{
        width:36px!important;
        height:36px!important;
        border-radius:9px!important;
      }
      .mobile-menu-btn{
        width:36px!important;
        height:36px!important;
        border-radius:9px!important;
      }

      .mobile-drawer{
        width:min(90vw,330px)!important;
        padding:calc(7px + env(safe-area-inset-top)) 7px calc(7px + env(safe-area-inset-bottom))!important;
        background:
          linear-gradient(180deg,color-mix(in srgb,var(--team-accent) 5%,var(--panel)),var(--panel) 180px)!important;
      }
      .mobile-drawer-head{
        padding:0 1px 6px!important;
        margin-bottom:4px!important;
      }
      .mobile-drawer .nav{
        grid-template-columns:1fr!important;
        gap:0!important;
        padding:0!important;
      }
      .mobile-drawer .nav button{
        min-height:28px!important;
        padding:3px 6px!important;
        border-radius:6px!important;
        font-size:11.5px!important;
        line-height:1!important;
      }
      .mobile-drawer .nav button>span:first-child{
        width:22px!important;
        height:22px!important;
        min-width:22px!important;
        border-radius:6px!important;
        font-size:11px!important;
      }
      .mobile-drawer-context{
        padding:4px 0!important;
        gap:3px!important;
      }
      .mobile-drawer-context select{
        min-height:30px!important;
        padding:4px 6px!important;
        font-size:10.5px!important;
      }
      .mobile-drawer-account{
        gap:3px!important;
        padding-top:4px!important;
      }
      .mobile-drawer-account .btn{
        min-height:29px!important;
        padding:4px 5px!important;
        font-size:10px!important;
      }

      .page-title{
        min-height:auto;
        padding-left:9px;
        margin-bottom:9px;
        border-left-width:2px;
      }
      .page-title h1{
        font-size:1.25rem!important;
      }
      .ui-title-icon{
        width:26px;height:26px;font-size:14px!important;
      }
      .page-title .actions{
        gap:4px!important;
      }
      .page-title .actions .btn{
        min-height:31px!important;
        padding:5px 8px!important;
      }

      .grid{gap:7px!important}
      .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))!important}
      .card{
        padding:9px!important;
        border-radius:10px!important;
      }
      .manager-kpi-card{
        min-height:72px;
        padding-right:39px!important;
      }
      .manager-kpi-card::before{
        width:29px;height:29px;top:8px;right:8px;font-size:14px!important;
      }
      .stat{font-size:1.3rem!important}
      .stat-label{font-size:10.5px!important}

      .list{gap:3px}
      .list-item,.calendar-event-row,.callup-card{
        min-height:35px;
        padding:5px 6px!important;
        border-radius:8px!important;
      }

      .table{
        border-spacing:0 3px!important;
      }
      .table thead th{
        padding:5px 5px!important;
      }
      .table tbody td{
        padding:5px 5px!important;
      }

      .btn{min-height:31px;padding:5px 8px!important}
      input,select,textarea{
        min-height:35px;
        padding:7px 8px;
      }

      .section-note{
        padding:6px 8px;
      }
      .modal{
        padding:11px!important;
      }
      .modal-head{
        padding-bottom:7px;
      }

      .match-team-slot{
        min-height:132px!important;
        padding:8px!important;
      }
      .live-actions .btn{
        min-height:43px!important;
      }
    }

    @media(max-width:520px){
      .grid-3,.grid-2{
        grid-template-columns:1fr!important;
      }
      .grid-4{
        grid-template-columns:repeat(2,minmax(0,1fr))!important;
      }

      .calendar-controls-row{
        padding:4px!important;
      }
      .calendar-event-row{
        grid-template-columns:48px minmax(0,1fr) auto!important;
        gap:6px!important;
      }
      .calendar-date-tile{
        width:44px!important;
        min-height:43px!important;
      }

      .match-scoreboard{
        gap:7px!important;
        padding:9px!important;
      }
      .match-score-team img,
      .match-score-team .fallback{
        width:44px!important;
        height:44px!important;
      }
      .match-score-number{font-size:1.72rem!important}

      .player-list-identity .avatar{
        width:22px!important;
        height:22px!important;
        min-width:22px!important;
      }
    }


    /* =====================================================
       032 — LAPTOP-FIRST RESPONSIVE LAYOUT
       13"/15": niente scroll del documento su desktop.
       Lo scroll vive nel contenuto o nei container record.
       ===================================================== */
    @media(min-width:901px){
      html,body,#root{
        width:100%;
        height:100%;
        min-height:0;
        overflow:hidden!important;
      }

      .shell,
      .shell:not(.calendar-page){
        width:100%;
        height:100dvh!important;
        min-height:0!important;
        overflow:hidden!important;
      }

      .main,
      .shell:not(.calendar-page) .main{
        height:100dvh!important;
        min-height:0!important;
        overflow:hidden!important;
        display:flex;
        flex-direction:column;
      }

      .topbar{
        flex:none;
        min-height:58px!important;
        padding:8px 16px!important;
      }

      .content,
      .shell:not(.calendar-page) .content{
        flex:1;
        height:auto!important;
        min-height:0!important;
        max-width:none!important;
        width:100%;
        padding:12px 14px 13px!important;
        overflow:auto!important;
        overscroll-behavior:contain;
      }

      .sidebar,
      .shell:not(.calendar-page) .sidebar{
        height:100dvh!important;
        max-height:100dvh!important;
        overflow:hidden!important;
        padding-top:10px!important;
      }

      .page-title{
        margin-bottom:9px!important;
        min-height:38px!important;
      }
      .page-title h1{
        font-size:clamp(1.15rem,1.35vw,1.38rem)!important;
      }
      .page-title p{
        font-size:clamp(.7rem,.76vw,.8rem)!important;
      }

      /* Tabelle desktop: occupano la larghezza, mai scrollbar orizzontale. */
      .table-wrap{
        width:100%!important;
        max-width:100%!important;
        overflow-x:hidden!important;
        overflow-y:auto;
      }
      .table{
        width:100%!important;
        min-width:0!important;
        max-width:100%!important;
        table-layout:auto;
      }
      .table th,
      .table td{
        max-width:220px;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
        font-size:clamp(.66rem,.73vw,.78rem)!important;
        padding-left:clamp(3px,.45vw,7px)!important;
        padding-right:clamp(3px,.45vw,7px)!important;
      }
      .table th{
        font-size:clamp(.59rem,.64vw,.69rem)!important;
      }

      /* Tabelle dense (Rosa/Statistiche/Cassa) comprimono ulteriormente. */
      .roster-table th,.roster-table td,
      .stats-table th,.stats-table td,
      .cash-table th,.cash-table td{
        font-size:clamp(.61rem,.69vw,.74rem)!important;
        padding-left:3px!important;
        padding-right:3px!important;
      }

      .grid{gap:8px!important}
      .card{padding:10px!important}
      .list{min-height:0}
      .list-item{padding:5px 7px!important;min-height:34px!important}

      /* Dashboard: usa tutto il viewport e scrolla solo i singoli box. */
      .dashboard-page .content{
        overflow:hidden!important;
        display:flex;
        flex-direction:column;
      }
      .dashboard-page .page-title{
        flex:none;
      }
      .dashboard-kpis{
        flex:none;
        display:grid;
        grid-template-columns:repeat(4,minmax(0,1fr));
        gap:7px;
        margin-bottom:8px;
      }
      .dashboard-kpis .card{
        min-height:64px!important;
      }
      .dashboard-ops-grid{
        flex:1;
        min-height:0;
        display:grid;
        grid-template-columns:repeat(4,minmax(0,1fr));
        grid-template-rows:repeat(2,minmax(0,1fr));
        gap:8px;
      }
      .dashboard-panel{
        min-height:0;
        display:flex;
        flex-direction:column;
        overflow:hidden;
      }
      .dashboard-panel .card-head{
        flex:none;
        margin-bottom:5px!important;
        padding-bottom:5px!important;
      }
      .dashboard-panel .card-head h3{
        font-size:clamp(.78rem,.88vw,.94rem)!important;
      }
      .dashboard-panel-list{
        flex:1;
        min-height:0;
        overflow-y:auto;
        overflow-x:hidden;
        padding-right:2px;
      }
      .dashboard-mini-record{
        display:grid;
        grid-template-columns:minmax(0,1fr) auto;
        gap:7px;
        align-items:center;
        padding:5px 2px;
        border-bottom:1px solid var(--ui-line-soft);
      }
      .dashboard-mini-record:last-child{border-bottom:0}
      .dashboard-mini-title{
        min-width:0;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
        font-weight:750;
      }
      .dashboard-mini-meta{
        margin-top:2px;
        font-size:clamp(.58rem,.64vw,.68rem)!important;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
      }
      .dashboard-mini-side{
        white-space:nowrap;
        font-size:clamp(.62rem,.68vw,.72rem)!important;
      }

      .opponents-page .content{
        overflow:hidden!important;
        display:flex;
        flex-direction:column;
      }
      .opponents-page .page-title{flex:none}
      .opponent-tiles{
        flex:1;
        min-height:0;
        overflow:auto;
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
        grid-auto-rows:118px;
        gap:8px;
        align-content:start;
        padding-right:2px;
      }
      .opponent-tile{
        min-width:0;
        height:118px;
      }

      /* Record-heavy pages: tables may use most of remaining viewport. */
      .content > .table-wrap:last-child,
      .content > .card:last-child > .table-wrap{
        max-height:calc(100dvh - 165px);
      }
    }

    @media(min-width:901px) and (max-height:800px){
      .content,
      .shell:not(.calendar-page) .content{
        padding-top:8px!important;
        padding-bottom:8px!important;
      }
      .dashboard-kpis{
        gap:5px;
        margin-bottom:6px;
      }
      .dashboard-kpis .card{
        min-height:56px!important;
        padding:7px!important;
      }
      .dashboard-ops-grid{gap:6px}
      .dashboard-panel{padding:7px!important}
      .dashboard-mini-record{padding:3px 1px}
      .stat{font-size:1.15rem!important}
      .stat-label{font-size:.62rem!important}
    }

    @media(min-width:901px) and (max-width:1380px){
      .content,
      .shell:not(.calendar-page) .content{
        padding-left:10px!important;

const isHex = value => /^#[0-9a-f]{6}$/i.test(String(value||""));

function contrastColor(hex){
  if(!isHex(hex)) return "#07120a";
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return ((r*299+g*587+b*114)/1000)>150 ? "#07120a" : "#ffffff";
}

function hexToRgb(hex){
  if(!isHex(hex)) return {r:0,g:0,b:0};
  const n=parseInt(hex.slice(1),16);
  return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}

function rgbToHex(r,g,b){
  const c=n=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,"0");
  return `#${c(r)}${c(g)}${c(b)}`.toUpperCase();
}

function rgbaFromHex(hex,alpha){
  const {r,g,b}=hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

function mixHex(a,b,t){
  const x=hexToRgb(a),y=hexToRgb(b);
  return rgbToHex(
    x.r+(y.r-x.r)*t,
    x.g+(y.g-x.g)*t,
    x.b+(y.b-x.b)*t
  );
}

function perceivedBrightness(hex){
  const {r,g,b}=hexToRgb(hex);
  return (r*299+g*587+b*114)/1000;
}

function surfaceFromBackground(background,amount=.07){
  const toward=perceivedBrightness(background)<145?"#FFFFFF":"#000000";
  return mixHex(background,toward,amount);
}

function mutedFromText(text,background){

function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h=0,s=0;
  const l=(max+min)/2;
  const d=max-min;
  if(d){
    s=d/(1-Math.abs(2*l-1));
    switch(max){
      case r:h=((g-b)/d)%6;break;
      case g:h=(b-r)/d+2;break;
      default:h=(r-g)/d+4;
    }
    h*=60;if(h<0)h+=360;
  }
  return {h,s,l};
}

function colorDistance(a,b){
  const x=hexToRgb(a),y=hexToRgb(b);
  const dr=x.r-y.r,dg=x.g-y.g,db=x.b-y.b;
  return Math.sqrt(dr*dr+dg*dg+db*db);
}

function derivePalette(colors){
  const clean=[...new Set(colors.filter(isHex).map(x=>x.toUpperCase()))];
  const primary=clean[0]||"#22C55E";

  if(clean.length<2){
    const {r,g,b}=hexToRgb(primary);
    const light=(r*299+g*587+b*114)/1000;
    clean.push(light>150 ? mixHex(primary,"#000000",.72) : mixHex(primary,"#FFFFFF",.82));
  }

  if(clean.length<3){
    const base=clean[1];
    clean.push(
      colorDistance(primary,base)>120
        ? mixHex(primary,base,.48)
        : mixHex(primary,contrastColor(primary)==="#ffffff"?"#FFFFFF":"#000000",.42)
    );
  }

  return clean.slice(0,3);
}

async function loadImageFile(file){
  return await new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Immagine non leggibile"))};
    img.src=url;
  });
}

async function extractLogoPalette(file){
  const img=await loadImageFile(file);
  const maxSide=170;
  const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*scale));
  const h=Math.max(1,Math.round(img.naturalHeight*scale));

  const canvas=document.createElement("canvas");
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);

  const data=ctx.getImageData(0,0,w,h).data;
  const bins=new Map();
  const step=24;

  for(let i=0;i<data.length;i+=4){
    const a=data[i+3];
    if(a<70) continue;

    const r=data[i],g=data[i+1],b=data[i+2];
    const qr=Math.min(255,Math.round(r/step)*step);
    const qg=Math.min(255,Math.round(g/step)*step);
    const qb=Math.min(255,Math.round(b/step)*step);
    const key=`${qr},${qg},${qb}`;

    const row=bins.get(key)||{count:0,r:0,g:0,b:0};
    row.count++;
    row.r+=r;row.g+=g;row.b+=b;
    bins.set(key,row);
  }

  const candidates=[...bins.values()]
    .filter(x=>x.count>=2)
    .map(x=>{
      const r=x.r/x.count,g=x.g/x.count,b=x.b/x.count;
      const hex=rgbToHex(r,g,b);
      const {s,l}=rgbToHsl(r,g,b);
      const extreme=l<.06||l>.96;
      const neutral=s<.10;
      const score=x.count*(.55+s*.95)*(extreme?.16:1)*(neutral?.45:1);
      return {hex,count:x.count,s,l,score};
    });

  const vivid=[...candidates].sort((a,b)=>b.score-a.score);
  const byCount=[...candidates].sort((a,b)=>b.count-a.count);
  const picked=[];

  const tryPick=(arr,minDistance)=>{
    for(const c of arr){
      if(picked.length>=3) break;
      if(!picked.some(x=>x===c.hex) && picked.every(x=>colorDistance(x,c.hex)>=minDistance)){
        picked.push(c.hex);
      }
    }
  };

  tryPick(vivid,72);
  tryPick(byCount,55);
  tryPick(byCount,30);

  return derivePalette(picked);
}

async function normalizeLogoToPng(file){
  const img=await loadImageFile(file);
  const maxSide=1024;
  const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*scale));
  const h=Math.max(1,Math.round(img.naturalHeight*scale));

  const canvas=document.createElement("canvas");
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);

  return await new Promise((resolve,reject)=>{
    canvas.toBlob(
      blob=>blob?resolve(blob):reject(new Error("Impossibile preparare lo stemma")),
      "image/png"
    );
  });
}

async function edge(name, body, authenticated=true){
  const headers={"Content-Type":"application/json","apikey":CONFIG.SUPABASE_PUBLISHABLE_KEY};
  if(authenticated){
    const {data:{session}}=await supabase.auth.getSession();
    if(session?.access_token) headers.Authorization=`Bearer ${session.access_token}`;
  }
  const r=await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${name}`,{method:"POST",headers,body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok || data.ok===false) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}
async function must(dataPromise){
  const {data,error}=await dataPromise;
  if(error) throw error;
  return data;
}

async function openRegistrationPlayerLink(){
  if(!state.team?.id||!state.season?.id||state.myPlayer)return;

  try{
    const [players,history,requests]=await Promise.all([
      must(
        supabase.from("players")
          .select("id,first_name,last_name,photo_url,profile_id")
          .eq("team_id",state.team.id)
          .order("last_name")
      ),
      must(
        supabase.rpc("get_season_roster_history",{
          p_team_id:state.team.id,
          p_season_id:state.season.id
        })
      ),
      must(
        supabase.from("player_link_requests")
          .select("*")
          .eq("team_id",state.team.id)
          .eq("profile_id",state.profile.id)
          .eq("status","pending")
      )
    ]);

    if(requests.length){
      toast("Hai già una richiesta di associazione in attesa","ok");
      return;
    }

    const activeIds=new Set(
      history
        .filter(x=>
          x.roster_status==="active"
          && today()>=x.start_date
          && today()<=(x.actual_end_date||x.planned_end_date)
        )
        .map(x=>x.player_id)
    );

    const candidates=players.filter(p=>
      activeIds.has(p.id)
      && !p.profile_id
    );

    showModal("Associa il tuo profilo",`
      <div class="section-note">
        ⚽ Seleziona il tuo nome. L'associazione non è immediata: dovrà essere approvata dalla squadra.
      </div>

      <div style="height:10px"></div>

      <div class="onboarding-player-list">
        ${candidates.map(p=>`
          <div class="onboarding-player-choice">
            <div class="player-list-identity">
              <span class="avatar">${p.photo_url?`<img src="${esc(p.photo_url)}">`:initials(p.first_name,p.last_name)}</span>
              <span>
                <span class="player-list-surname">${esc(p.last_name)}</span>
                <span class="player-list-firstname"> ${esc(p.first_name)}</span>
              </span>
            </div>
            <button class="btn btn-sm btn-primary" type="button" data-register-link-player="${p.id}">Sono io</button>
          </div>
        `).join("")||`<div class="empty">Nessun calciatore libero da associare nella Rosa attuale.</div>`}
      </div>

      <div style="height:10px"></div>

      <div class="actions">
        <button class="btn btn-ghost" type="button" id="registration-link-later">Lo farò più tardi</button>
      </div>
    `,root=>{
      root.closest(".modal").style.width="min(620px,100%)";

      $("#registration-link-later",root).onclick=closeModal;

      $$("[data-register-link-player]",root).forEach(b=>b.onclick=async()=>{
        try{
          await must(
            supabase.rpc("request_player_link",{
              p_team_id:state.team.id,
              p_player_id:b.dataset.registerLinkPlayer
            })
          );

          closeModal();
          toast("Richiesta di associazione inviata","ok");
        }catch(err){
          toast(err.message,"error");
        }
      });
    });

  }catch(err){
    toast(err.message,"error");
  }
}

async function loadPlatformAccess(){
  state.platformRoles=(await must(
    supabase.rpc("get_my_platform_roles")
  )).map(x=>x.role_code);

  state.isSuperAdmin=state.platformRoles.includes("platform_super_admin");
  state.canCreateTeam=state.isSuperAdmin || state.platformRoles.includes("team_creator");
}

async function loadAccountTeams(){
  const memberships=await must(
    supabase.from("team_members")
      .select("*")
      .eq("profile_id",state.profile.id)
      .eq("is_active",true)
  );

  state.teamMemberships=memberships;

  if(state.isSuperAdmin){
    const allTeams=await must(
      supabase.from("teams")
        .select("*")
        .order("name")
    );

    state.teams=allTeams.map(team=>({
      ...team,
      membership:memberships.find(m=>m.team_id===team.id)||{
        team_id:team.id,
        profile_id:state.profile.id,
        is_owner:false,
        is_active:true,
        is_hidden:false,
        platform_access:true
      }
    }));
  }else if(!memberships.length){
    state.teams=[];
  }else{
    const teamRows=await must(
      supabase.from("teams")
        .select("*")
        .in("id",memberships.map(m=>m.team_id))
        .order("name")
    );

    state.teams=teamRows.map(team=>({
      ...team,
      membership:memberships.find(m=>m.team_id===team.id)
    }));
  }

  if(state.teams.length){
    const organizationIds=[...new Set(state.teams.map(t=>t.organization_id).filter(Boolean))];
    const organizations=organizationIds.length
      ? await must(
          supabase.from("organizations")
            .select("*")
            .in("id",organizationIds)
        )
      : [];
    const organizationMap=new Map(organizations.map(o=>[o.id,o]));
    state.teams=state.teams.map(t=>({
      ...t,
      organization:organizationMap.get(t.organization_id)||null
    }));
  }

  const prefs=await must(
    supabase.from("user_preferences")
      .select("*")
      .eq("profile_id",state.profile.id)
      .maybeSingle()
  );

  state.preferences=prefs||{
    profile_id:state.profile.id,
    last_team_id:null,
    last_context:state.isSuperAdmin?"platform":"team"
  };
}

function visibleTeams(){
  if(state.isSuperAdmin)return state.teams;
  return state.teams.filter(t=>t.membership?.is_active && !t.membership?.is_hidden);
}

async function enterTeam(teamId,{persist=true,targetPath="dashboard"}={}){
  const team=state.teams.find(t=>
    t.id===teamId
    && (state.isSuperAdmin || t.membership?.is_active)
  );

  if(!team)throw new Error("Squadra non disponibile");

  stopLive();
  state.currentContext="team";
  state.team=team;
  state.membership=team.membership;
  state.organization=team.organization||null;
  state.rosterSettings=null;

  if(!state.organization && team.organization_id){
    state.organization=await must(
      supabase.from("organizations")
        .select("*")
        .eq("id",team.organization_id)
        .single()
    );
    state.team={...state.team,organization:state.organization};
  }

  applyTeamBranding(state.team,state.organization);

  state.seasons=await must(
    supabase.from("seasons")
      .select("*")
      .eq("team_id",team.id)
      .order("start_date",{ascending:false})
  );

  state.season=state.seasons.find(s=>s.status==="active")||state.seasons[0]||null;

  const teamRoles=(await must(
    supabase.rpc("get_my_effective_roles",{p_team_id:team.id})
  )).map(x=>x.role_code);

  state.roles=state.isSuperAdmin
    ? ["platform_super_admin",...teamRoles]
    : teamRoles;

  state.permissions=new Set((await must(
    supabase.rpc("get_my_permissions",{p_team_id:team.id})
  )).map(x=>x.permission_key));

  const myPlayers=await must(
    supabase.from("players")
      .select("*")
      .eq("team_id",team.id)
      .eq("profile_id",state.profile.id)
  );
  state.myPlayer=myPlayers[0]||null;

  if(persist){
    await must(supabase.rpc("set_last_team",{p_team_id:team.id}));
    state.preferences={
      ...(state.preferences||{}),
      profile_id:state.profile.id,
      last_team_id:team.id,
      last_context:"team"
    };
  }

  if(state.profile.must_change_password){
    return changePasswordPage();
  }

  await route(targetPath,false);

  if(state.myPlayer&&state.season&&hasRole("player")){
    await runPlayerOnboarding();
  }
}

async function chooseFallbackTeam(){
  const visible=visibleTeams();

  if(state.isSuperAdmin && !visible.length){
    return platformRoute("dashboard",false);
  }

  if(!visible.length){
    state.team=null;
    state.membership=null;
    state.organization=null;
    state.season=null;
    state.seasons=[];
    state.roles=[];
    state.permissions=new Set();
    state.myPlayer=null;
    resetTeamBranding();
    return renderTeamChooser();
  }

  if(visible.length===1 && !state.isSuperAdmin){
    return enterTeam(visible[0].id,{persist:true,targetPath:"dashboard"});
  }

  return renderTeamChooser();
}

async function boot(){
  if(!configReady())return renderLogin();

  const {data:{session}}=await supabase.auth.getSession();
  if(!session)return renderLogin();

  state.session=session;

  try{
    state.profile=await must(
      supabase.from("profiles")
        .select("*")
        .eq("id",session.user.id)
        .single()
    );

    await loadPlatformAccess();

    if(!state.isSuperAdmin){
      const setupData=await must(supabase.rpc("platform_setup_status"));
      const setupRow=Array.isArray(setupData)?setupData[0]:setupData;

      if(setupRow && !setupRow.super_admin_exists){
        return renderExistingAccountSuperAdminClaim();
      }
    }

    await loadAccountTeams();

    if(state.profile.must_change_password){
      state.team=null;
      state.currentContext=state.isSuperAdmin?"platform":"team";
      return changePasswordPage();
    }

    if(state.isSuperAdmin && state.preferences?.last_context==="platform"){
      return platformRoute("dashboard",false);
    }

    const visible=visibleTeams();
    const preferred=visible.find(t=>t.id===state.preferences?.last_team_id);

    if(preferred){
      const hash=location.hash.replace(/^#\/?/,"")||"dashboard";
      if(hash.startsWith("platform") && state.isSuperAdmin){
        return platformRoute(hash.split("/")[1]||"dashboard",false);
      }
      return enterTeam(preferred.id,{persist:false,targetPath:hash});
    }

    if(state.isSuperAdmin){
      return platformRoute("dashboard",false);
    }

    if(visible.length===1){
      return enterTeam(visible[0].id,{persist:true,targetPath:"dashboard"});
    }

    return renderTeamChooser();

  }catch(err){
    console.error(err);
    toast(err.message,"error");
  }
}

    <div class="brand">

async function refreshTeamsAfterMembershipChange(){
  const previous=state.team?.id||null;
  await loadAccountTeams();

  const current=previous
    ? state.teams.find(t=>t.id===previous && t.membership?.is_active && !t.membership?.is_hidden)
    : null;

  if(current){
    state.team=current;
    state.membership=current.membership;
    applyTeamBranding(current);
    return true;
  }

  closeModal();
  await chooseFallbackTeam();
  return false;
}

async function openManageTeams(){
  if(state.isSuperAdmin){
    return platformRoute("teams");
  }

  try{
    await loadAccountTeams();

    const directory=await must(
      supabase.from("teams")
        .select("id,name,short_name,slug,logo_url,primary_color,secondary_color,accent_color,is_discoverable,allow_fan_follow")
        .eq("is_discoverable",true)
        .order("name")
    );

    const activeMap=new Map(state.teams.map(t=>[t.id,t]));
    const combinedMap=new Map(directory.map(t=>[t.id,t]));
    state.teams.forEach(t=>{
      if(!combinedMap.has(t.id)) combinedMap.set(t.id,t);
    });
    const manageableTeams=[...combinedMap.values()].sort((a,b)=>a.name.localeCompare(b.name,"it"));

    showModal("Le mie squadre",`
      <div class="field"><label>Cerca squadra</label><input id="team-search" placeholder="Nome o sigla"></div>
      <div class="section-note">Puoi nascondere una squadra dal cambio rapido senza smettere di seguirla. “Non seguire più” è disponibile solo quando in quella squadra sei esclusivamente fan.</div>
      <div style="height:12px"></div>
      <div class="list" id="team-manager-list"></div>
      <div style="height:12px"></div>
      <button class="btn btn-primary" id="create-team-from-manager">${state.canCreateTeam?"Crea nuova squadra":"Richiedi nuova squadra"}</button>
    `,root=>{
      const list=$("#team-manager-list",root);
      const search=$("#team-search",root);

      const draw=()=>{
        const q=search.value.trim().toLowerCase();
        const rows=manageableTeams.filter(t=>{
          const joined=activeMap.get(t.id);
          const hay=`${t.name} ${t.short_name||""} ${t.slug}`.toLowerCase();
          return joined || !q || hay.includes(q);
        });

        list.innerHTML=rows.map(t=>{
          const joined=activeMap.get(t.id);
          const hidden=joined?.membership?.is_hidden;
          return `<div class="list-item" data-team-row="${t.id}">
            <div class="player-name">
              <span class="avatar" style="background:${activeBrandPalette(t,t.organization)[0]};color:${contrastColor(activeBrandPalette(t,t.organization)[0])}">${teamMark(t,"TM",t.organization)}</span>
              <div>
                <strong>${esc(t.name)}</strong>
                <div class="muted">${esc(t.short_name||t.slug)}${hidden?" · nascosta dal selettore":""}</div>
              </div>
            </div>
            <div class="actions">
              ${joined
                ? `<button class="btn btn-sm" data-hide-team="${t.id}" data-hidden="${hidden?"true":"false"}">${hidden?"Mostra":"Nascondi"}</button>
                   ${!joined.membership?.is_owner?`<button class="btn btn-sm btn-danger" data-unfollow-team="${t.id}">Non seguire più</button>`:""}`
                : (t.allow_fan_follow
                    ? `<button class="btn btn-sm btn-primary" data-follow-team="${t.id}">Segui</button>`
                    : `<span class="badge">non seguibile</span>`)
              }
            </div>
          </div>`;
        }).join("") || `<div class="empty">Nessuna squadra trovata</div>`;

        $$("[data-follow-team]",list).forEach(b=>b.onclick=async()=>{
          try{
            await must(supabase.rpc("follow_team",{p_team_id:b.dataset.followTeam}));
            toast("Squadra aggiunta","ok");
            await refreshTeamsAfterMembershipChange();
            if($("#modal-body")) openManageTeams();
          }catch(err){toast(err.message,"error")}
        });

        $$("[data-hide-team]",list).forEach(b=>b.onclick=async()=>{
          try{
            await must(supabase.rpc("set_team_hidden",{
              p_team_id:b.dataset.hideTeam,
              p_hidden:b.dataset.hidden!=="true"
            }));
            toast(b.dataset.hidden==="true"?"Squadra ripristinata":"Squadra nascosta","ok");
            const remained=await refreshTeamsAfterMembershipChange();
            if(remained && $("#modal-body")) openManageTeams();
          }catch(err){toast(err.message,"error")}
        });

        $$("[data-unfollow-team]",list).forEach(b=>b.onclick=async()=>{
          if(!confirm("Non seguire più questa squadra? Lo storico del tuo account non verrà cancellato.")) return;
          try{
            await must(supabase.rpc("unfollow_team",{p_team_id:b.dataset.unfollowTeam}));
            toast("Squadra rimossa dalle seguite","ok");
            const remained=await refreshTeamsAfterMembershipChange();
            if(remained && $("#modal-body")) openManageTeams();
          }catch(err){toast(err.message,"error")}
        });
      };

      search.oninput=draw;
      $("#create-team-from-manager",root).onclick=()=>{
        closeModal();
        state.canCreateTeam?openCreateTeam():openTeamCreationRequest();
      };
      draw();
    });
  }catch(err){
    toast(err.message,"error");
  }
}

function teamWorkspaceForm(prefix,{includeMessage=false,submitLabel="Invia"}={}){
  const now=new Date();
  const y=now.getMonth()>=6?now.getFullYear():now.getFullYear()-1;
  const seasonName=`${y}/${String(y+1).slice(-2)}`;

  return `
    <div class="field"><label>Nome società / organizzazione</label><input id="${prefix}-org" required></div>
    <div class="field"><label>Nome squadra</label><input id="${prefix}-team" required></div>

    <div class="form-grid">
      <div class="field"><label>Sigla / nome breve</label><input id="${prefix}-short"></div>
      <div class="field">
        <label>Slug</label>
        <input id="${prefix}-slug" required>
        <div class="muted" style="font-size:.72rem;margin-top:5px">Generato automaticamente dal nome e modificabile.</div>
      </div>
    </div>

    <h3>Prima stagione</h3>
    <div class="field"><label>Nome stagione</label><input id="${prefix}-season" value="${seasonName}" required></div>

    <div class="form-grid">
      <div class="field"><label>Inizio</label><input id="${prefix}-start" type="date" value="${y}-07-01" required></div>
      <div class="field"><label>Fine</label><input id="${prefix}-end" type="date" value="${y+1}-06-30" required></div>
    </div>

    ${includeMessage
      ? `<div class="field"><label>Messaggio al Super Admin</label><textarea id="${prefix}-message" rows="3" placeholder="Informazioni utili sulla squadra o sulla tua richiesta"></textarea></div>`
      : ""
    }

    <button class="btn btn-primary">${submitLabel}</button>
  `;
}

function wireTeamSlug(prefix,root){
  const name=$(`#${prefix}-team`,root);
  const slug=$(`#${prefix}-slug`,root);
  let touched=false;

  slug.oninput=()=>touched=true;
  name.oninput=()=>{
    if(!touched)slug.value=slugify(name.value);
  };
}

async function platformRoute(page="dashboard",push=true){
  if(!state.isSuperAdmin){
    return chooseFallbackTeam();
  }

  if(push)location.hash=`#/platform/${page}`;

  try{
    await must(supabase.rpc("set_platform_context"));
    state.preferences={
      ...(state.preferences||{}),
      profile_id:state.profile.id,
      last_context:"platform"
    };
  }catch(_){}

  if(page==="teams")return platformTeams();
  if(page==="users")return platformUsers();
  if(page==="requests")return platformRequests();
  return platformDashboard();
}

                ${creator?`<span class="badge blue">Creatore squadre</span>`:""}

    const pwd=prompt("Nuova password temporanea (min 8 caratteri)");

async function refreshNotificationBell(){
  if(!state.profile?.id||!state.team?.id)return;

  try{
    const rows=await must(
      supabase.from("team_notifications")
        .select("id")
        .eq("team_id",state.team.id)
        .eq("recipient_profile_id",state.profile.id)
        .is("read_at",null)
    );

    const count=rows.length;

    ["#notification-count-top","#notification-count-mobile"].forEach(sel=>{
      const el=$(sel);
      if(!el)return;
      el.textContent=count>99?"99+":String(count);
      el.classList.toggle("hidden",count===0);
    });
  }catch(err){
    console.warn("Notifiche:",err);
  }
}

async function openNotifications(){
  try{
    const rows=await must(
      supabase.from("team_notifications")
        .select("*")
        .eq("team_id",state.team.id)
        .eq("recipient_profile_id",state.profile.id)
        .order("created_at",{ascending:false})
        .limit(50)
    );

    showModal("Notifiche",`
      <div class="notification-list">
        ${rows.map(n=>`
          <div class="notification-item ${n.read_at?"":"unread"}" data-notification="${n.id}" data-notification-entity="${esc(n.entity_type||"")}" data-notification-entity-id="${esc(n.entity_id||"")}">
            <div>
              <strong>${esc(n.title)}</strong>
              ${n.body?`<div class="muted" style="margin-top:2px">${esc(n.body)}</div>`:""}
              <div class="muted" style="margin-top:3px">${fmtDateTime(n.created_at)}</div>
            </div>
            <div>${n.read_at?"":"●"}</div>
          </div>
        `).join("")||`<div class="empty">Nessuna notifica</div>`}
      </div>
    `,root=>{
      root.closest(".modal").style.width="min(650px,100%)";

      $$("[data-notification]",root).forEach(el=>el.onclick=async()=>{
        try{
          await must(
            supabase.from("team_notifications")
              .update({read_at:new Date().toISOString()})
              .eq("id",el.dataset.notification)
          );
        }catch{}

        const type=el.dataset.notificationEntity;
        closeModal();
        refreshNotificationBell();

        if(type==="player_unavailability")return route("absences");
        if(type==="membership_fee"||type==="fine")return route("cash");
      });

      const unread=rows.filter(x=>!x.read_at).map(x=>x.id);
      if(unread.length){
        supabase.from("team_notifications")
          .update({read_at:new Date().toISOString()})
          .in("id",unread)
          .then(()=>refreshNotificationBell());
      }
    });
  }catch(err){
    toast(err.message,"error");
  }
}

async function route(path,push=true){
  stopLive();

  const [page,id,sub]=path.split("/");

  if(page==="platform"){
    return platformRoute(id||"dashboard",push);
  }

  if(!state.team){
    return chooseFallbackTeam();
  }

  state.currentContext="team";

  const requestedPage=page||"dashboard";
  const fanBlockedPages=new Set([
    "trainings","absences","opponents","venues","medical","cash","admin",
    "discipline","fines","injuries"
  ]);

  if(isFanAudience()&&fanBlockedPages.has(requestedPage)){
    state.currentPage="dashboard";
    if(push)location.hash="#/dashboard";
    return pageDashboard();
  }

  state.currentPage=requestedPage;

  if(push)location.hash=`#/${path}`;

  const routes={
    dashboard:pageDashboard,
    calendar:pageCalendar,
    trainings:pageTrainings,
    matches:pageMatches,
    competitions:pageCompetitions,
    roster:pageRoster,
    absences:pageAbsences,
    opponents:pageOpponents,
    venues:pageVenues,
    medical:pageMedical,
    cash:pageCash,
    stats:pageStats,
    admin:pageAdmin,
    profile:pageProfile,
    discipline:pageAbsences,
    fines:pageCash,
    injuries:pageAbsences
  };

  if(["roster","trainings","absences","match"].includes(page)){
    await syncMedicalAbsencesSafe();
  }

  if(page==="match"&&id)return pageMatch(id);
  if(page==="live"&&id)return pageLive(id);
  if(page==="player"&&id)return pagePlayer(id);

  const fn=routes[page]||pageDashboard;
  await fn(sub);
}

window.addEventListener("hashchange",()=>{
  const p=location.hash.replace(/^#\/?/,"")||"dashboard";
  if(p.startsWith("platform/")){
    if(state.currentContext!=="platform" || `platform-${p.split("/")[1]}`!==state.currentPage){
      route(p,false);
    }
    return;
  }
  if(state.currentContext!=="team" || p.split("/")[0]!==state.currentPage){
    route(p,false);
  }
});

async function dashboardRosterContext(){

      supabase.rpc("get_roster_generic_roles",{

        p_season_id:state.season.id
      })
    )
  ]);

  const activeIds=new Set(

        && today()>=x.start_date

    playerMap:new Map(players.map(p=>[p.id,p])),
